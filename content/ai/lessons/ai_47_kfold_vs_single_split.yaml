challenge: |
  Replace `score_single_split` with `score_kfold(rows, labels, model_fn,
  k)`, doing real 3-fold cross-validation (train on 2 folds, test on the
  held-out fold, three times) and averaging the results. Call it with
  `k=3` and print the rounded average. It should print `0.667`.
expected_output: |
  0.667
hints:
  - "For each of the k folds, the test set is one contiguous slice; the train set is everything else -- collect a score per fold, then average all k scores at the end."
  - "With this majority-class dummy model and this particular 9-row/2-class split, 2 of the 3 folds correctly predict their held-out fold's majority; the third doesn't -- averaging gives 0.667."
