  def assemble_context(chunks):
      return " ".join(c["text"] for c in chunks)

  chunks = [
      {"text": "The subscription costs $9.99/month.", "fact": "price", "value": 9.99},
      {"text": "The subscription costs $14.99/month.", "fact": "price", "value": 14.99},
  ]
  print("CONFLICT" in assemble_context(chunks))
challenge: |
  Fix `assemble_context` so it groups chunks by `fact`, detects any
  fact with more than one distinct `value` among the retrieved chunks,
  and prepends a `[CONFLICT DETECTED in: ...]` marker when one is found.
  It should print `True`, not `False`.
expected_output: |
  True
hints:
  - "Build by_fact = {} and do by_fact.setdefault(c[\"fact\"], set()).add(c[\"value\"]) for each chunk."
  - "conflicts = [fact for fact, values in by_fact.items() if len(values) > 1] -- any fact with more than one distinct value is a genuine conflict."
