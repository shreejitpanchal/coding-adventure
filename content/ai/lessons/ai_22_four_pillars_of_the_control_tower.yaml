comprehension_check:
  - question: "Why must the Registry pillar exist before the Access pillar can meaningfully function?"
    options:
      - "Access permissions have to be scoped to a specific agent identity -- an agent that was never registered has no identity for permissions to attach to, making it invisible to governance entirely"
      - "Registry and Access are actually the same pillar with two names"
      - "Access must exist first, and Registry is built on top of it"
      - "There is no dependency between these two pillars"
    correct: 0
    explanation: "The four pillars build on each other in order -- Registry provides the identity everything else attaches to."
  - question: "What does the Observability pillar provide that the Access pillar alone does not?"
    options:
      - "A log of what an agent actually did -- which tools it called, what data it touched, and when -- letting a security team investigate after the fact"
      - "It removes the need to ever grant an agent any permissions"
      - "It is identical in function to the Registry pillar"
      - "It only tracks which agents exist, not what they did"
    correct: 0
    explanation: "Access defines what's allowed; Observability records what actually happened, which is what makes post-incident investigation possible."
