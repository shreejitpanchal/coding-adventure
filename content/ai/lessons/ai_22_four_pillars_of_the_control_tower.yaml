id: ai_22
title: "The Control Tower's Four Pillars: Registry, Access, Observability, Lifecycle"
language: ai
level: 22
objective: "Learn the four functional pillars the AI Agent Control Tower organizes its governance around, as the next level of detail below 'a single pane of glass for agents.'"
explanation: |
  This category's opening lesson framed the Control Tower at the
  broadest level: one place to see every agent instead of scattered
  per-platform silos. That single sentence hides four genuinely
  distinct functions, each solving a different half of the governance
  problem, and understanding them as separate pillars is the next step
  down from the one-sentence pitch.

  **Registry** is the inventory function: every agent, regardless of
  which platform built it, gets registered with a first-class identity
  -- a name, an owner, a platform, and metadata about what it's for --
  the same way Entra ID (Microsoft's identity platform) already does
  for human user accounts and service principals. Without a registry,
  none of the other three pillars have anything to attach to; an
  ungoverned agent that was never registered is invisible to every
  other pillar by definition. **Access** is the permissions function:
  once an agent has an identity, that identity can be granted specific,
  scoped permissions -- which systems it can call, which data it can
  read, which actions require a human approval step -- instead of an
  agent inheriting broad, unscoped access by default. **Observability**
  is the activity function: a log of what each registered agent
  actually did -- which tools it called, what data it touched, when --
  so a security team can investigate an incident after the fact instead
  of having no record at all. **Lifecycle** is the time-bound function:
  agents get provisioned, they should get reviewed periodically (is
  this agent still needed? does its owner still work here?), and
  eventually decommissioned -- an agent that was spun up for a
  three-month project and never turned off is exactly the kind of
  forgotten, unreviewed access that governance is meant to catch.

  These four pillars build on each other in a specific order:
  Registry has to exist before Access can be scoped to anything, Access
  has to exist before Observability's logs mean anything specific about
  what was *allowed* versus *attempted*, and Lifecycle depends on all
  three being current to make a sound decommission decision.
example_code: |
  # Illustrative shape of what a Control Tower's registry entry
  # conceptually holds -- not literal Agent 365 API/schema.
  agent_registry_entry = {
      "identity": "finance-recon-agent",                 # Registry
      "owner": "finance-ops@example.com",
      "platform": "Vendor SaaS",
      "permissions": ["read:general_ledger", "read:bank_feed"],  # Access
      "requires_human_approval_for": ["post_journal_entry"],      # Access
      "activity_log_endpoint": "/agents/finance-recon-agent/logs", # Observability
      "provisioned_date": "2026-01-15",                    # Lifecycle
      "last_reviewed_date": "2026-06-01",                  # Lifecycle
      "review_due_date": "2026-12-01",
  }
