challenge: |
  Fix `run_full_pipeline` so it builds `messages` with the system
  message first, merges each branch's result under its own `name` (not
  a shared `"output"` key), and returns `{"messages": messages,
  **branch_results}`. It should print
  `['messages', 'sentiment', 'summary']`, not `['combined']`.
expected_output: |
  ['messages', 'sentiment', 'summary']
hints:
  - "Fix all three at once: system message first in the list, branch_results[name] = fn(user_input) instead of .update({\"output\": ...}), and return {\"messages\": messages, **branch_results}."
  - "This ties together three separate lessons from earlier in this category -- message ordering, distinct branch keys, and preserving existing data when merging in something new."
