id: ai_17
title: "A JSON-RPC Response That Includes Both result and error"
language: ai
level: 17
objective: "Fix a response builder that always includes both \"result\" and \"error\" fields (one of them null), since JSON-RPC 2.0 requires exactly one to be present, never both."
explanation: |
  JSON-RPC 2.0 defines `result` and `error` as *mutually exclusive* on
  a response object -- a successful call includes `result` and omits
  `error` entirely; a failed call includes `error` and omits `result`
  entirely. A response builder that always sets both fields, using
  `None` for whichever one doesn't apply, technically carries the right
  information (a receiver could infer success or failure by checking
  which field is `null`), but it doesn't actually conform to the
  specification most MCP clients and servers are built against --
  strict JSON-RPC 2.0 parsers may reject a response carrying both keys
  at once, or behave unpredictably, since the spec explicitly says a
  conforming response contains exactly one of the two, not both with
  one nulled out.

  The fix is to build the response conditionally: include `result` only
  when there's no error, and `error` only when there is one -- never
  both keys on the same response object. `if error is not None:
  resp["error"] = error else: resp["result"] = result` constructs
  exactly the fields the spec requires and nothing extra, which is the
  general lesson here: a field being merely *unused* isn't the same as
  a field being *absent* -- a spec that says "include this field only
  when it applies" means don't include it at all otherwise, not include
  it with a placeholder value standing in for "not applicable."
example_code: |
  import json

  # The trap: always includes both fields, nulling out whichever doesn't apply.
  def make_response_trap(request_id, result=None, error=None):
      return {"jsonrpc": "2.0", "id": request_id, "result": result, "error": error}

  print(json.dumps(make_response_trap(1, result={"ok": True})))
  # {"jsonrpc": "2.0", "id": 1, "result": {"ok": true}, "error": null} -- error shouldn't be here at all

  # The fix: include only the field that actually applies.
  def make_response(request_id, result=None, error=None):
      resp = {"jsonrpc": "2.0", "id": request_id}
      if error is not None:
          resp["error"] = error
      else:
          resp["result"] = result
      return resp

  print(json.dumps(make_response(1, result={"ok": True})))
  # {"jsonrpc": "2.0", "id": 1, "result": {"ok": true}} -- no error key at all
starter_code: |
  import json

  def make_response(request_id, result=None, error=None):
      return {"jsonrpc": "2.0", "id": request_id, "result": result, "error": error}

  print(json.dumps(make_response(1, result={"ok": True})))
challenge: |
  Fix `make_response` so a successful response includes ONLY
  "jsonrpc"/"id"/"result" -- no "error" key at all when there's no
  error -- producing:
  {"jsonrpc": "2.0", "id": 1, "result": {"ok": true}}
expected_output: |
  {"jsonrpc": "2.0", "id": 1, "result": {"ok": true}}
hints:
  - "Build resp = {\"jsonrpc\": \"2.0\", \"id\": request_id} first, then conditionally add EITHER resp[\"error\"] = error OR resp[\"result\"] = result."
  - "if error is not None: resp[\"error\"] = error; else: resp[\"result\"] = result"
