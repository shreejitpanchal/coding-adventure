id: ai_01
title: "A Train/Test Split That Isn't Actually Reproducible"
language: ai
level: 1
objective: "Fix a train/test split that silently depends on the global random module's state, by giving it its own seeded Random instance."
explanation: |
  Calling `random.shuffle(data)` inside a `train_test_split` function
  looks self-contained, but it isn't: `random.shuffle` mutates and reads
  from Python's one *global* random number generator, shared by every
  other piece of code in the entire process that happens to call
  anything in the `random` module. The split's actual result depends
  on whatever that global generator's internal state happens to be at
  the moment `train_test_split` is called -- which depends on how many
  other random calls happened earlier in the program, in what order,
  none of which `train_test_split` itself controls or even knows about.
  Two calls with what looks like "the same setup" can silently produce
  different splits if anything else touched the global random state
  in between -- exactly the kind of "works differently depending on
  what ran before it" bug that makes an ML experiment impossible to
  reproduce reliably.

  The fix is for the split to own its randomness completely:
  `random.Random(seed)` creates an independent random number generator,
  entirely separate from the global one, whose entire sequence of
  outputs is determined solely by `seed`. Calling `.shuffle()` on that
  dedicated instance produces the exact same result every time for the
  same `seed`, regardless of what any other code anywhere in the
  program has done with the global `random` module before, after, or
  concurrently. This is the general reproducibility pattern for any
  code whose correctness or scientific validity depends on a specific
  randomized outcome being exactly repeatable: own your own generator,
  seeded explicitly, rather than depending on shared global state.
example_code: |
  import random

  # The trap: shuffling with the GLOBAL random module -- depends on
  # whatever else has touched global random state before this runs.
  def train_test_split_trap(data, train_frac):
      shuffled = data.copy()
      random.shuffle(shuffled)
      cut = int(len(shuffled) * train_frac)
      return shuffled[:cut], shuffled[cut:]

  data = list(range(10))
  random.seed(1)
  print(train_test_split_trap(data, 0.7))
  random.seed(2)                              # some unrelated code seeds differently
  print(train_test_split_trap(data, 0.7))     # different result -- not reproducible!

  # The fix: own a dedicated, seeded Random instance.
  def train_test_split(data, train_frac, seed):
      rng = random.Random(seed)
      shuffled = data.copy()
      rng.shuffle(shuffled)
      cut = int(len(shuffled) * train_frac)
      return shuffled[:cut], shuffled[cut:]

  random.seed(999)                             # unrelated global state, irrelevant now
  print(train_test_split(data, 0.7, seed=42))
  random.seed(111)                             # different unrelated global state
  print(train_test_split(data, 0.7, seed=42))  # identical result -- genuinely reproducible
starter_code: |
  import random

  def train_test_split(data, train_frac):
      shuffled = data.copy()
      random.shuffle(shuffled)
      cut = int(len(shuffled) * train_frac)
      return shuffled[:cut], shuffled[cut:]

  data = list(range(10))
  random.seed(7)
  first = train_test_split(data, 0.7)
  random.seed(13)
  second = train_test_split(data, 0.7)
  print(first == second)
challenge: |
  Fix `train_test_split` so it takes an explicit `seed` parameter and
  uses its own `random.Random(seed)` instance instead of the global
  `random` module, so two calls with the same seed produce identical
  results regardless of unrelated global random state in between. Call
  it as `train_test_split(data, 0.7, seed=42)` both times, and print
  whether the two results are equal (should be True).
expected_output: |
  True
hints:
  - "rng = random.Random(seed); rng.shuffle(shuffled) replaces the global random.shuffle(shuffled) call."
  - "Add seed as a third parameter to train_test_split, and call it with the SAME seed value both times."
