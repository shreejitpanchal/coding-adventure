challenge: |
  Fix `trim_with_summary` so it summarizes the dropped older messages
  (via `summarize_fn`) and keeps that summary in place of them, instead
  of dropping them with nothing left behind. It should print `True`,
  not `False`.
expected_output: |
  True
hints:
  - "Compute dropped = conversation[:-max_length], then summary = summarize_fn(dropped)."
  - "Return [summary] + conversation[-max_length:] -- the summary replaces the dropped messages instead of them vanishing entirely."
