id: ai_24
title: "Observability: Activity Logs and Anomaly Detection"
language: ai
level: 24
objective: "Go one level deeper into the Observability pillar: understand what a useful agent activity log actually records, and why detecting a deviation from an agent's normal behavior pattern matters as much as logging individual actions."
explanation: |
  This category's second lesson named Observability as "a log of what
  each agent did" at a high level. The next level of detail is what
  that log actually needs to capture to be useful for a security
  investigation, and what gets built on top of raw logs once enough of
  them accumulate.

  A useful per-action log entry records more than just "agent X ran" --
  it needs the agent's identity (per the previous lesson's first-class
  identity concept), which specific tool or system it called, what
  data it read or wrote, and a timestamp, at minimum. This is what
  turns "something happened" into "agent X read customer records Y and
  Z from the CRM at 3:47 AM on a Sunday" -- specific enough that a human
  investigating an incident can actually reconstruct what occurred,
  rather than a generic "agent activity detected" entry that answers
  none of the follow-up questions an investigation actually needs
  answered.

  Once enough of these detailed logs accumulate for a given agent, a
  **baseline** of normal behavior emerges -- which systems it typically
  calls, roughly how often, during which hours, touching which category
  of data. **Anomaly detection** compares new activity against that
  baseline and flags meaningful deviations: an agent that normally only
  reads sales data suddenly querying HR records, or an agent that
  typically runs during business hours suddenly active at 3 AM. This
  matters because a compromised or misconfigured agent doesn't
  necessarily do something an access-control check would outright
  block -- it might use permissions it's genuinely entitled to, just in
  a way that's wildly inconsistent with its established normal pattern
  -- and only a baseline comparison, not a static permissions check
  alone, can catch that kind of deviation.
example_code: |
  # Illustrative shape of what a detailed log entry needs to capture --
  # not literal Agent 365 log schema.
  log_entry = {
      "agent_id": "finance-recon-agent",     # WHO (first-class identity, previous lesson)
      "action": "read",                       # WHAT kind of action
      "target": "general_ledger.transactions_q3",  # WHAT specifically was touched
      "timestamp": "2026-09-12T03:47:00Z",    # WHEN
  }

  # A baseline built from many such log entries over time:
  agent_baseline = {
      "finance-recon-agent": {
          "typical_targets": {"general_ledger", "bank_feed"},
          "typical_hours": range(8, 19),        # business hours only, historically
      }
  }

  def is_anomalous(entry, baseline):
      profile = baseline.get(entry["agent_id"])
      if profile is None:
          return False
      hour = int(entry["timestamp"][11:13])
      # flag EITHER an unusual target OR an unusual hour -- a permissions
      # check alone wouldn't catch this if the agent is technically entitled
      return entry["target"] not in profile["typical_targets"] or hour not in profile["typical_hours"]
