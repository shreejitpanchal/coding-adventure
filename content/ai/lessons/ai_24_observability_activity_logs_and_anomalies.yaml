comprehension_check:
  - question: "What does a useful per-action agent log entry need to capture, beyond just 'agent X ran'?"
    options:
      - "The agent's identity, which specific tool/system it called, what data it read or wrote, and a timestamp -- enough detail to reconstruct exactly what happened during an investigation"
      - "Nothing else is needed -- knowing an agent ran at all is sufficient for any investigation"
      - "Only the agent's name, with no other details"
      - "Only the timestamp, since the identity is assumed to always be the same"
    correct: 0
    explanation: "A generic 'agent activity detected' entry answers none of the follow-up questions a real investigation needs -- specificity is what makes the log actually useful."
  - question: "Why is anomaly detection against a behavioral baseline needed in addition to access-control checks?"
    options:
      - "A compromised or misconfigured agent might use permissions it's genuinely entitled to, just in a way wildly inconsistent with its established normal pattern -- something a static permissions check wouldn't catch"
      - "Anomaly detection replaces the need for any access control entirely"
      - "Baselines are only useful for agents that have zero permissions"
      - "There is no meaningful difference between access control and anomaly detection"
    correct: 0
    explanation: "An agent using its own legitimate access in an unusual way (wrong data category, unusual hour) wouldn't be blocked by a permissions check, but would stand out against its own historical baseline."
