  print(len(run_fanout("classify", edges, nodes, {})))
challenge: |
  Fix `run_fanout` so it returns `[nodes[next_node](state) for
  next_node in edges[node_name]]`, running every node in the fan-out
  list, instead of only `edges[node_name][0]`. It should print `3`,
  not `1`.
expected_output: |
  3
hints:
