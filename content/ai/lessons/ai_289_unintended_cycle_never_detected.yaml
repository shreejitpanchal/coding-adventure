  except ValueError as e:
      print(str(e))
challenge: |
  Fix `run_graph` so it tracks a `seen` set and raises `ValueError(f
  "unintended cycle detected at node: {current}")` when a node not in
  `allowed_cycle_nodes` is revisited. It should print
  `unintended cycle detected at node: a`, not `completed`.
expected_output: |
  unintended cycle detected at node: a
hints:
  - "seen = set() before the loop; inside it, check if current in seen and current not in allowed_cycle_nodes: raise ValueError(...), then seen.add(current)."
  - "With edges {\"a\": \"b\", \"b\": \"a\"}, \"a\" is revisited on the third step -- that's exactly the point where the check should fire."
