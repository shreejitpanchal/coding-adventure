challenge: |
  Fix `dedupe_chunks` so it skips a chunk whose word-overlap similarity
  to any already-kept chunk is at or above `threshold`, instead of
  returning every chunk untouched. It should print `2`, not `3`.
expected_output: |
  2
hints:
  - "Build a `kept` list, and for each chunk check: if not any(word_overlap(chunk, k) >= threshold for k in kept): kept.append(chunk)."
  - "The first two sentences share 8 of their 10 combined unique words (0.8 overlap), which is above the 0.75 threshold -- the second should be skipped as a near-duplicate of the first."
