challenge: |
  Fix `precision_at_k` so it divides `hits` by `k`, instead of by
  `len(relevant_docs)`. It should print `0.4`, not `0.5`.
expected_output: |
  0.4
hints:
  - "Change the divisor to k: return hits / k."
  - "2 of the 4 relevant docs (doc1, doc3) are in the top 5 shown -- dividing by 5 (what was shown) gives 0.4, the actual precision; dividing by 4 (total relevant) gives 0.5, which is recall instead."
