challenge: |
  Fix `run_tool_calls` so each individual tool call is wrapped in its
  own `try/except`, converting a raised exception into
  `{"error": str(e)}` for just that tool and continuing to the next,
  instead of letting one failure abort the whole batch. It should print
  `['ok', {'error': 'external API timed out'}, 'ok']`.
expected_output: |
  ['ok', {'error': 'external API timed out'}, 'ok']
hints:
  - "Wrap result = fn() in a try/except Exception as e: block, setting result = {\"error\": str(e)} in the except branch."
  - "The try/except must be INSIDE the for loop, around just the single fn() call -- not around the whole loop -- so each tool's failure is isolated to itself."
