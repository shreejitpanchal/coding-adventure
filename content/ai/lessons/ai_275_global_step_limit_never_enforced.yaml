  edges = {"a": "b", "b": "a"}
  print(run_with_limit(nodes, edges, "a", "END", 5))
challenge: |
  Fix `run_with_limit` so its `while` condition includes `and steps <
  max_steps`, instead of only relying on the unrelated internal hard
  cap of 10000. It should print `5`, not `10001`.
expected_output: |
  5
hints:
  - "Change the while condition to: while current != end and steps < max_steps:"
  - "The graph's own step budget needs to be checked regardless of which specific nodes are involved in an accidental cycle."
