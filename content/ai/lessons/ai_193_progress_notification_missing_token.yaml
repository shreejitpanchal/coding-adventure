id: ai_193
title: "A Progress Notification Needs the Same Token the Client Provided"
language: ai
level: 193
objective: "Fix a progress-notification builder that generates its own token instead of using the progressToken the client actually provided in its request, breaking the client's ability to correlate the notification back to the specific operation it's tracking."
explanation: |
  For a long-running operation, MCP lets a client attach a
  `progressToken` to its original request, and the server is expected
  to include that *exact same token* on every progress notification it
  sends back -- this is the notification-side equivalent of this
  category's request/response `id` correlation lesson: the token is
  what lets a client with several long-running operations in flight
  simultaneously match each progress update to the correct one.
  Generating a fresh token on the server side instead severs that link
  entirely.

  The bug this exercise fixes generates its own token for every
  progress notification, ignoring the one the client actually provided.
  The fix reuses the client's own `progressToken` from the original
  request, correctly preserving the correlation.
example_code: |
  # The trap: generates its OWN token -- the client has no way to match
  # this notification back to the request it actually came from.
  def build_progress_notification_trap(client_progress_token, percent_complete):
      return {"method": "notifications/progress", "params": {"progressToken": "server-generated-999", "progress": percent_complete}}

  notif_trap = build_progress_notification_trap("client-token-42", 50)
  print(notif_trap["params"]["progressToken"])   # "server-generated-999" -- doesn't match anything the client tracked!

  # The fix: reuse the CLIENT'S OWN token from the original request.
  def build_progress_notification(client_progress_token, percent_complete):
      return {"method": "notifications/progress", "params": {"progressToken": client_progress_token, "progress": percent_complete}}

  notif = build_progress_notification("client-token-42", 50)
  print(notif["params"]["progressToken"])   # "client-token-42" -- correctly matches what the client is tracking
starter_code: |
  def build_progress_notification(client_progress_token, percent_complete):
      return {"method": "notifications/progress", "params": {"progressToken": "server-generated-999", "progress": percent_complete}}

  notif = build_progress_notification("client-token-42", 50)
  print(notif["params"]["progressToken"])
challenge: |
  Fix `build_progress_notification` so it uses `client_progress_token`
  as the `progressToken`, instead of a hardcoded server-generated
  value. It should print `client-token-42`, not `server-generated-999`.
expected_output: |
  client-token-42
hints:
  - "Change \"progressToken\": \"server-generated-999\" to \"progressToken\": client_progress_token."
  - "The whole point of the progress token is that it originates from the CLIENT's request and gets echoed back unchanged, not regenerated by the server."
