comprehension_check:
  - question: "What problem occurs when an agent runs using a human employee's own credentials instead of its own identity?"
    options:
      - "Every action is indistinguishable from the human acting directly, permissions can't be scoped to just what the agent needs, and the agent's access is tied to that employee's continued employment"
      - "There is no problem -- this is the recommended approach"
      - "The agent automatically gets fewer permissions this way"
      - "This only matters for agents that never access any data"
    correct: 0
    explanation: "The agent inherits whatever broad access the human's account already has, and if the employee leaves, the agent either breaks or keeps running on an unmonitored lingering credential."
  - question: "What does giving an agent its own first-class identity in a directory like Entra ID make possible?"
    options:
      - "Permissions scoped specifically to what that agent needs, unambiguous attribution in logs, and access that can be reviewed or revoked independently of any human's employment status"
      - "It makes the agent invisible to all logging"
      - "It requires removing all permission scoping entirely"
      - "It has no effect on how the agent's actions appear in logs"
    correct: 0
    explanation: "This is the same underlying idea as giving a service its own service account, applied specifically to AI agents at organizational scale."
