  print(round(auc(y_true, y_scores), 3))
challenge: |
  Fix `auc` so it computes the real pairwise-concordance AUC (fraction
  of positive/negative pairs where the positive scores higher), instead
  of accuracy at a single fixed threshold. It should print `0.75`, not
  `0.5`.
expected_output: |
  0.75
hints:
  - "Split y_scores into `positives` (where y_true is 1) and `negatives` (where y_true is 0)."
  - "Count concordant pairs with a nested comparison: sum(1 for p in positives for n in negatives if p > n), then divide by len(positives) * len(negatives)."
