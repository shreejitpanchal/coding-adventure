challenge: |
  Fix `f1_multiclass` so it computes each class's own F1 independently
  and averages those scores (macro averaging), instead of pooling
  counts across classes first. It should print `0.45`, not `0.857`.
expected_output: |
  0.45
hints:
  - "Loop over each class in per_class_tp, compute that class's own precision/recall/F1 from just its own tp/fp/fn, and collect the per-class F1 scores into a list."
  - "Return the average of that list of per-class F1 scores, not one F1 computed from pooled totals."
