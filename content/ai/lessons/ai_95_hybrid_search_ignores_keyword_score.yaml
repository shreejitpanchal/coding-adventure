challenge: |
  Fix `rank` so it sorts by a weighted combination of `keyword_score`
  and `vector_score`, instead of `vector_score` alone. It should print
  `exact_keyword_hit`, not `semantic_match`.
expected_output: |
  exact_keyword_hit
