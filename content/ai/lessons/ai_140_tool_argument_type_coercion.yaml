id: ai_140
title: "A Tool Call's Arguments Arrive as Strings and Need Type Coercion"
language: ai
level: 140
objective: "Fix a tool-call executor that passes a model-generated argument straight through as a string, when the tool function actually expects a number -- the model's JSON-shaped output can carry the right value in the wrong type."
explanation: |
  Tool-call arguments generated by a model typically arrive as JSON, and
  JSON's own type system doesn't always align cleanly with what a
  Python function actually expects -- a quantity argument might arrive
  as the string `"5"` instead of the integer `5`, especially depending
  on how the model or the surrounding framework serialized it. Passing
  that string straight into a function expecting a number either
  crashes outright or, worse, silently produces the wrong result if
  Python's own operators happen to accept both types but behave
  differently for each (string repetition vs. numeric multiplication
  being a classic case).

  The bug this exercise fixes passes the raw string argument straight
  into a tool function expecting a number, producing string repetition
  instead of numeric multiplication. The fix coerces the argument to
  the expected type before calling the tool, based on the tool's own
  declared parameter type.
example_code: |
  # The trap: passes the argument straight through as a STRING --
  # Python's `*` operator happily "multiplies" it as repetition instead.
  def calculate_total_trap(price, quantity):
      return price * quantity

  print(calculate_total_trap(9.99, "3"))   # 9.999.999.99 -- STRING repetition, not numeric multiplication!

  # The fix: coerce the argument to the tool's expected type first.
  def call_tool_with_coercion(tool_fn, args, param_types):
      coerced_args = {k: param_types[k](v) for k, v in args.items()}
      return tool_fn(**coerced_args)

  def calculate_total(price, quantity):
      return price * quantity

  result = call_tool_with_coercion(
      calculate_total, {"price": 9.99, "quantity": "3"}, {"price": float, "quantity": int}
  )
  print(round(result, 2))   # 29.97 -- correctly coerced "3" to the int 3 before multiplying
starter_code: |
  def call_tool_with_coercion(tool_fn, args, param_types):
      return tool_fn(**args)

  def calculate_total(price, quantity):
      return price * quantity

  result = call_tool_with_coercion(
      calculate_total, {"price": 9.99, "quantity": "3"}, {"price": float, "quantity": int}
  )
  print(round(result, 2) if isinstance(result, float) else result)
challenge: |
  Fix `call_tool_with_coercion` so it coerces each argument to its
  declared type from `param_types` before calling `tool_fn`, instead of
  passing the raw arguments through unchanged. It should print
  `29.97`, not `9.999.999.99`.
expected_output: |
  29.97
hints:
  - "Build coerced_args = {k: param_types[k](v) for k, v in args.items()} -- applying each parameter's declared type as a conversion function."
  - "Call tool_fn(**coerced_args) with the coerced dict, not the original raw args."
