  print(len(retrieve(candidates, user_allowed_docs, k=2)))
challenge: |
  Fix `retrieve` so it filters `candidates` by `user_allowed_docs`
  first, then ranks and takes the top `k` from the allowed set --
  instead of ranking and truncating to top-k before filtering. It
  should print `1`, not `0`.
expected_output: |
  1
hints:
  - "Build `allowed` first: [c for c in candidates if c[\"doc_id\"] in user_allowed_docs]."
  - "Only THEN sort `allowed` by score and slice to [:k] -- filtering must happen before the top-k truncation, not after."
