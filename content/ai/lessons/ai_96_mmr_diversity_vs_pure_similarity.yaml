challenge: |
  Fix `select_mmr` so it picks the most relevant candidate first, then
  for each subsequent pick, chooses whichever remaining candidate
  maximizes `lambda_param * relevance - (1 - lambda_param) *
  similarity_to_a`, instead of just taking the top-k by relevance alone.
  It should print `['a', 'c']`, not `['a', 'b']`.
expected_output: |
  ['a', 'c']
hints:
  - "Start selected with the single highest-relevance candidate, then remove it from a `remaining` list."
  - "Repeatedly pick from `remaining` using max(remaining, key=mmr_score) where mmr_score subtracts a redundancy penalty, until k items are selected."
