challenge: |
  Fix `reweight` so it boosts the weight of examples where `t != p`
  (misclassified), instead of where `t == p` (correctly classified). It
  should print `[1.0, 1.0, 2.0, 2.0]`, not `[2.0, 2.0, 1.0, 1.0]`.
expected_output: |
  [1.0, 1.0, 2.0, 2.0]
hints:
  - "Change the condition to: w * boost_factor if t != p else w."
  - "Only the misclassified examples (index 2 and 3, where y_true and y_pred disagree) should get their weight boosted."
