challenge: |
  Fix `rank_with_recency` so it adds `recency_bonus` to a document's
  similarity score when `is_current` is `True`, before ranking. It
  should print `policy_2024`, not `policy_2021`.
expected_output: |
  policy_2024
hints:
  - "Define score(c) returning c[\"similarity\"] + (recency_bonus if c[\"is_current\"] else 0), and sort using key=score."
  - "0.88 + 0.05 = 0.93, which now beats 0.91 -- the current document's recency bonus correctly tips the balance."
