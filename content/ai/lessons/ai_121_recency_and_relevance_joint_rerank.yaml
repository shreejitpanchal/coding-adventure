challenge: |
  Fix `rank_joint` so it combines each candidate's `relevance` with a
  recency factor (`1 - (max_date - c["date"]) * recency_weight`) into
  one joint score, instead of sorting by date alone. It should print
  `highly_relevant_old`, not `barely_relevant_new`.
expected_output: |
  highly_relevant_old
hints:
  - "Compute max_date = max(c[\"date\"] for c in candidates) once, then define score(c) = c[\"relevance\"] * (1 - (max_date - c[\"date\"]) * recency_weight)."
  - "highly_relevant_old's score is 0.95 * (1 - 4*0.02) = 0.95 * 0.92 = 0.874; barely_relevant_new's is 0.20 * (1 - 0) = 0.20 -- relevance still dominates the outcome."
