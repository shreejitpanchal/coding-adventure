  checkpoints = {}
  run_pipeline(nodes, edges, "classify", "END", checkpoints)
  print(sorted(checkpoints["classify"].keys()))
challenge: |
  Fix both bugs together: make `classify` merge its own key into a copy
  of the state it receives (`new_state = dict(state); new_state
  ["category"] = "safe"`), and move `checkpoints[current] = dict(state)`
  to after `state = nodes[current](state)` runs. It should print
  `['category', 'order_id']`, not `['order_id']`.
expected_output: |
  ['category', 'order_id']
hints:
  - "Fix classify first: new_state = dict(state); new_state[\"category\"] = \"safe\"; return new_state."
  - "Then reorder run_pipeline's loop body: state = nodes[current](state) has to run BEFORE checkpoints[current] = dict(state), not after."
