  print(nearest(query, candidates))
challenge: |
  Fix `nearest` so it computes cosine similarity between the query and
  each candidate and returns whichever has the HIGHEST similarity
  (`max`, not `min`), instead of the lowest raw L2 distance. It should
  print `A`, not `B`.
expected_output: |
  A
hints:
  - "Define cosine(a, b) computing dot / (norm_a * norm_b), then use max(candidates, key=lambda name: cosine(query, candidates[name]))."
  - "Candidate A's direction [10, 1] is very close to the query's direction [1, 0] (cosine ~0.995), even though it's geometrically far away in raw distance -- cosine correctly recognizes this."
