challenge: |
  Fix `collect_results` so it builds `results_by_name =
  dict(results_in_completion_order)` and looks each tool up by its own
  name, instead of matching purely by position. It should print
  `sunny`, not `3pm`.
expected_output: |
  sunny
hints:
  - "results_by_name = dict(results_in_completion_order), then return {name: results_by_name[name] for name in tool_calls}."
  - "get_time finished before get_weather in this example -- matching by position pairs get_weather with get_time's result purely by coincidence of list position."
