comprehension_check:
  - question: "What is 'agent sprawl,' as this lesson defines it?"
    options:
      - "The situation where AI agents multiply across many teams and platforms with nobody having a single, reliable inventory of which agents exist, what they can access, or who owns them"
      - "A technical bug that makes an individual agent run slowly"
      - "A feature that lets one agent call unlimited other agents"
      - "A synonym for a single team having too many chatbots"
    correct: 0
    explanation: "It's a visibility and governance problem, not a technical capability problem -- individual agents work fine at build time; what's missing is an organization-wide answer to what exists and who owns it."
  - question: "Why does agent sprawl carry more risk than earlier 'shadow IT' problems like unmanaged SaaS signups?"
    options:
      - "An agent doesn't just store data -- it can act on a user's behalf, making the blast radius of an unmanaged or compromised agent larger"
      - "Agents are always more expensive than SaaS subscriptions"
      - "There is no meaningful difference in risk between the two"
      - "SaaS tools can never be misused, unlike agents"
    correct: 0
    explanation: "The ability to take action, not just hold data, is what raises the stakes of an over-permissioned or compromised agent compared to an unmanaged spreadsheet or SaaS tool."
