challenge: |
  Fix `run_with_checkpoint` so each node's checkpoint snapshot is taken
  *after* that node finishes running, not before -- so
  `checkpoints["charge_card"]` correctly reflects the charge having
  happened. It should print `True`, not `False`.
expected_output: |
  True
hints:
  - "Move the checkpoints[current] = dict(state) line to AFTER state = nodes[current](state), not before it."
  - "The order inside the loop should be: run the node (updating state), THEN snapshot that updated state into checkpoints, THEN follow the edge."
