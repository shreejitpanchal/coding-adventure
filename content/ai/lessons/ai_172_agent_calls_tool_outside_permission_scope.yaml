      print(e)
challenge: |
  Fix `call_tool` so it checks `tool_name not in agent_allowed_tools`
  first, raising `PermissionError(f"tool '{tool_name}' is not permitted
  for this agent")` in that case, instead of calling any tool from the
  registry unconditionally. It should print
  `tool 'delete_all_accounts' is not permitted for this agent`, not
  `ALL ACCOUNTS DELETED`.
expected_output: |
  tool 'delete_all_accounts' is not permitted for this agent
hints:
  - "Add: if tool_name not in agent_allowed_tools: raise PermissionError(f\"tool '{tool_name}' is not permitted for this agent\")."
  - "This check needs to happen BEFORE the tool_registry lookup, so an out-of-scope tool is refused rather than executed."
