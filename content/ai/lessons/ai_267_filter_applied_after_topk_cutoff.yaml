      ranked = sorted(results, key=lambda r: r["score"], reverse=True)[:k]
      return [r for r in ranked if r["metadata"].get("category") == metadata_filter]

  results = [
      {"doc": "a", "score": 0.9, "metadata": {"category": "other"}},
      {"doc": "b", "score": 0.8, "metadata": {"category": "other"}},
      {"doc": "c", "score": 0.5, "metadata": {"category": "target"}},
  ]
  print(len(search(results, "target", 2)))
challenge: |
  Fix `search` so it filters `results` by `metadata_filter` FIRST, then
  sorts and slices to `k` among what remains -- instead of ranking and
  slicing to `k` before ever checking the filter. It should print `1`,
  not `0`.
expected_output: |
  1
hints:
  - "filtered = [r for r in results if r[\"metadata\"].get(\"category\") == metadata_filter], THEN sort and slice that."
  - "Once the top-k cutoff has already discarded a document, no later filtering step can bring it back -- the order these two operations happen in is the entire bug."
