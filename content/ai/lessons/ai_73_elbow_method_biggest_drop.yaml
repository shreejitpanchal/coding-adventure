  inertia_by_k = {2: 300, 3: 120, 4: 100, 5: 95, 6: 92}
  print(best_k(inertia_by_k))
challenge: |
  Fix `best_k` so it finds the elbow -- the k right before the
  improvement over the previous k drops below `drop_threshold` --
  instead of just returning the k with the lowest inertia outright. It
  should print `3`, not `6`.
expected_output: |
  3
hints:
  - "Sort the k values, then walk through consecutive pairs computing improvement = inertia_by_k[ks[i-1]] - inertia_by_k[ks[i]]."
  - "Return ks[i-1] the first time improvement drops below drop_threshold -- from k=2 to k=3, improvement is 180 (still big); from k=3 to k=4, it's only 20 (below the threshold of 30), so 3 is the elbow."
