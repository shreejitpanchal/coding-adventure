challenge: |
  Fix both bugs together: include `"source": "webhook"` when building
  `task`, and loop over `agent_registry` selecting the first candidate
  whose `"capabilities"` list actually contains `required_capability`,
  instead of always `agent_registry[0]`. It should print `chart-agent`,
  not `db-agent`.
expected_output: |
  chart-agent
hints:
  - "Fix the task shape first: task = {\"text\": raw_payload[\"message\"], \"source\": \"webhook\"}."
  - "Then fix agent selection: for candidate in agent_registry: if required_capability in candidate[\"capabilities\"]: agent = candidate; break."
