challenge: |
  Fix `find_duplicates` so it tracks seen *content* instead of seen
  *IDs*, catching a document whose content matches an already-seen
  document even if its ID is different. It should print
  `['doc-migrated-047']`, not `[]`.
expected_output: |
  ['doc-migrated-047']
hints:
  - "Track a `seen_content` set instead of `seen_ids`, checking `if doc[\"content\"] in seen_content:`."
  - "Still append doc[\"id\"] to the duplicates list (so the report names WHICH id was the duplicate) -- just base the detection itself on content, not id."
