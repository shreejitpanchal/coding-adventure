comprehension_check:
  - question: "What does a scheduled lifecycle review check for, according to this lesson's example?"
    options:
      - "Whether the agent is still needed, whether its owner still works there, and whether its actual observed behavior still matches its originally scoped purpose -- catching permission creep"
      - "Only whether the agent's code still compiles"
      - "It checks nothing -- lifecycle reviews are purely a formality with no real function"
      - "Only the agent's uptime percentage"
    correct: 0
    explanation: "The review compares accumulated observed behavior against the agent's originally scoped purpose, which is exactly how quietly expanded, unreviewed permission creep gets caught."
  - question: "Why is decommissioning a first-class-identity agent a single, clean action, unlike revoking a borrowed human credential?"
    options:
      - "Revoking the agent's own identity revokes every one of its scoped permissions at once, with no risk of an orphaned credential lingering the way an unmanaged personal-account workaround would"
      - "Decommissioning a first-class agent identity is actually more complicated than revoking a human credential"
      - "First-class agent identities can never be decommissioned once created"
      - "There is no difference between the two approaches"
    correct: 0
    explanation: "Because the agent never borrowed a human's credential in the first place, there's nothing left dangling once its own identity is revoked -- exactly the payoff of the first-class-identity design from earlier in this category."
