  print(run_until_solved(always_fails))
challenge: |
  Fix `run_until_solved` so it tracks each attempt's result, and
  abandons early with `f"ABANDONED: repeated identical result, likely
  unsolvable -- {result}"` the moment two consecutive attempts produce
  the exact same result, instead of always exhausting every step first.
  It should print
  `ABANDONED: repeated identical result, likely unsolvable -- no matching record found`.
expected_output: |
  ABANDONED: repeated identical result, likely unsolvable -- no matching record found
hints:
  - "Track a `results` list, appending each attempt's result, and check `if len(results) >= 2 and results[-1] == results[-2]:` after each attempt."
  - "Since attempt_fn always returns the exact same string, the check triggers on the very second attempt -- no need to wait for max_steps to run out."
