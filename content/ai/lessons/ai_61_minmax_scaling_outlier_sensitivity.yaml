id: ai_61
title: "Min-Max Scaling Lets a Single Outlier Compress Everything Else"
language: ai
level: 61
objective: "Fix a scaler that computes min/max directly from raw data including an extreme outlier, which crushes every ordinary value's scaled range down to almost nothing."
explanation: |
  Min-max scaling maps a feature's minimum to `0` and maximum to `1` --
  which works well when the data has no extreme outliers, but a single
  unusually large value blows out the max, and every other, perfectly
  ordinary value then gets squeezed into a tiny sliver of the `0-1`
  range near `0`, losing almost all the meaningful variation between
  them. One common, practical fix is to **clip** values to a
  reasonable bound *before* computing min/max, so a single extreme
  outlier doesn't get to single-handedly define the scale everything
  else is measured against.

  The bug this exercise fixes computes min/max straight from the raw
  data, letting the one outlier dominate the whole range. The fix
  clips values to a sensible cap first -- here, `20`, since the rest of
  the data clearly lives well under that -- so the scaled gap between
  two ordinary values (`12` and `13`) stays meaningfully large, instead
  of being compressed into a barely-registering sliver by the outlier's
  presence in the raw min/max calculation.
example_code: |
  # The trap: min/max computed from RAW data -- one outlier defines the
  # whole scale, crushing every ordinary value's range near zero.
  def scale_trap(values):
      lo, hi = min(values), max(values)
      return [round((v - lo) / (hi - lo), 3) for v in values]

  values = [10, 12, 11, 13, 1000]   # one huge outlier
  scaled_trap = scale_trap(values)
  print(round(scaled_trap[3] - scaled_trap[1], 3))   # 0.001 -- a real gap (12 vs 13), nearly erased

  # The fix: clip to a sensible cap BEFORE computing min/max.
  def scale_clipped(values, cap):
      clipped = [min(v, cap) for v in values]
      lo, hi = min(clipped), max(clipped)
      return [round((v - lo) / (hi - lo), 3) for v in clipped]

  scaled = scale_clipped(values, cap=20)
  print(round(scaled[3] - scaled[1], 3))   # 0.1 -- 100x larger; no longer swamped by the outlier
starter_code: |
  def scale(values, cap):
      lo, hi = min(values), max(values)
      return [round((v - lo) / (hi - lo), 3) for v in values]

  values = [10, 12, 11, 13, 1000]
  scaled = scale(values, cap=20)
  print(round(scaled[3] - scaled[1], 3))
challenge: |
  Fix `scale` so it clips every value to `cap` *before* computing
  min/max, instead of computing min/max from the raw, unclipped data.
  It should print `0.1`, not `0.001`.
expected_output: |
  0.1
hints:
  - "Build a clipped list first: clipped = [min(v, cap) for v in values]."
  - "Compute lo/hi and the final scaled list from `clipped`, not from the original `values`."
