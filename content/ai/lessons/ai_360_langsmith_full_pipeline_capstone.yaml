challenge: |
  Fix both bugs together: compute `total_cost` as `sum(run_costs)`
  instead of just `run_costs[0]`, and compute `regression` by checking
  every example individually for a flip from correct to wrong (`b and
  not c`), instead of comparing only the two aggregate totals. It
  should print `5 REGRESSION`, not `0 OK`.
expected_output: |
  5 REGRESSION
hints:
  - "First fix the cost: total_cost = sum(run_costs)."
  - "Then fix the regression check: regressed = [i for i, (b, c) in enumerate(zip(baseline_leaf_scores, candidate_leaf_scores)) if b and not c], and regression = \"REGRESSION\" if regressed else \"OK\"."
