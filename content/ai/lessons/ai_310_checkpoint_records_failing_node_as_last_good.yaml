challenge: |
  Fix `run_interruptible` so the failing branch just raises, without
  ever setting `checkpoints["last_good"]` for a node that hasn't
  actually completed. It should print `a`, not `b`.
expected_output: |
  a
hints:
  - "Remove the checkpoints[\"last_good\"] = current line from inside the if current == fail_at: branch -- only the line after a node actually runs should set it."
  - "\"last_good\" should only ever be updated once a node's own work (state = nodes[current](state)) has genuinely completed without raising."
