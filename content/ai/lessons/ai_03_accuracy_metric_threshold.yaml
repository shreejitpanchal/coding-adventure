id: ai_03
title: "Comparing Raw Probabilities Directly to Integer Labels"
language: ai
level: 3
objective: "Fix an accuracy calculation that compares raw prediction probabilities directly to 0/1 labels, by thresholding the probability into a class first."
explanation: |
  A classification model's raw output is typically a probability --
  `0.9` meaning "90% confident this is the positive class" -- not
  already the discrete label `0` or `1` the ground truth is expressed
  in. Comparing them directly with `p == l` checks whether the *exact
  float* `0.9` equals the *exact int* `1`, which is essentially never
  true for any real probability short of a model being absurdly,
  suspiciously overconfident -- `accuracy` computed this way reports
  `0.0` even for a model whose predictions are, substantively,
  completely correct. Nothing about this crashes or raises a warning;
  it just silently reports every model as having zero accuracy, which
  is exactly the kind of "technically ran, but the number is
  meaningless" bug that's easy to mistake for a genuinely bad model
  rather than a broken metric.

  The fix is to convert the probability into the same discrete space
  the labels live in *before* comparing: `round(p)` maps any
  probability at or above `0.5` to `1` and anything below to `0`,
  matching the standard "which class is this closer to" decision rule
  for binary classification. Only after that thresholding step does
  `== label` mean the thing it's supposed to mean -- "did the model's
  predicted *class* match the true class" -- rather than a coincidental
  float-equals-int comparison that was never going to be true in
  practice.
example_code: |
  # The trap: comparing raw probabilities directly to integer labels.
  def accuracy_trap(preds, labels):
      correct = sum(1 for p, l in zip(preds, labels) if p == l)
      return correct / len(labels)

  preds = [0.9, 0.1, 0.8, 0.4]     # raw probabilities, clearly correct predictions
  labels = [1, 0, 1, 0]
  print(accuracy_trap(preds, labels))   # 0.0 -- reports total failure for a good model!

  # The fix: threshold the probability into a class before comparing.
  def accuracy(preds, labels):
      correct = sum(1 for p, l in zip(preds, labels) if round(p) == l)
      return correct / len(labels)

  print(accuracy(preds, labels))         # 1.0 -- correctly reflects the model's real accuracy
starter_code: |
  def accuracy(preds, labels):
      correct = sum(1 for p, l in zip(preds, labels) if p == l)
      return correct / len(labels)

  preds = [0.9, 0.1, 0.8, 0.4]
  labels = [1, 0, 1, 0]
  print(accuracy(preds, labels))
challenge: |
  Fix `accuracy` so it correctly reports 1.0 for these clearly-correct
  predictions -- threshold each probability with `round(p)` before
  comparing it to the label.
expected_output: |
  1.0
hints:
  - "if round(p) == l instead of if p == l -- that's the only change needed."
  - "round(0.9) is 1, round(0.1) is 0, round(0.8) is 1, round(0.4) is 0 -- all four now correctly match their labels."
