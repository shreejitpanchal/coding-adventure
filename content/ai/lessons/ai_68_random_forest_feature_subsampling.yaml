  _, n_considered = best_split_feature(feature_scores, subset_size=1, seed=1)
  print(n_considered)
challenge: |
  Fix `best_split_feature` so it samples exactly `subset_size` random
  candidate features (using `random.Random(seed).sample(...)`) before
  picking the best one, instead of always considering every feature. It
  should print `1`, not `3`.
expected_output: |
  1
hints:
  - "Add `import random` and inside the function: rng = random.Random(seed); candidates = rng.sample(list(feature_scores.keys()), subset_size)."
  - "len(candidates) will then correctly equal subset_size (1), instead of always equaling the full number of features (3)."
