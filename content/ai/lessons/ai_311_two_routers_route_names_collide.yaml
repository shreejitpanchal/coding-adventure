challenge: |
  Fix `merge_routes` so it prefixes each router's route names
  (`f"a:{name}"` and `f"b:{name}"` respectively) before merging,
  instead of merging the raw route names directly with `.update()`. It
  should print `True`, not `False`.
expected_output: |
  True
hints:
  - "Build merged as an empty dict, then loop over each router's routes separately, writing merged[f\"a:{name}\"] = target and merged[f\"b:{name}\"] = target."
  - "Namespacing turns two different routers' coincidentally identical route names into two genuinely distinct keys."
