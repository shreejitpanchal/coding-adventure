challenge: |
  Fix `fuzzy_match` so it returns `edit_distance(actual, expected) <=
  max_distance`, instead of the bare `actual == expected` comparison.
  It should print `True`, not `False`.
expected_output: |
  True
hints:
  - "Replace return actual == expected with return edit_distance(actual, expected) <= max_distance."
  - "\"colour\" and \"color\" differ by exactly one character (a deleted \"u\") -- edit_distance should return 1, which is within max_distance=1."
