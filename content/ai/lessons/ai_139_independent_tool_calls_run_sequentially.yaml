challenge: |
  Fix `run_concurrent` so it calls `tracker.start(name)` for every tool
  call *before* running any of them, then runs all the functions, then
  calls `tracker.end(name)` for all of them -- instead of starting,
  running, and ending each one before moving to the next. It should
  print `3`, not `1`.
expected_output: |
  3
hints:
  - "Split into three separate loops (or list comprehensions): one to call tracker.start() for every tool, one to actually call every fn(), and one to call tracker.end() for every tool."
  - "The key change is that ALL start() calls must happen before ANY of the actual function calls run -- that's what makes max_concurrent reach 3 instead of staying at 1."
