id: ai_139
title: "Independent Tool Calls Don't Need to Wait for Each Other"
language: ai
level: 139
objective: "Fix an agent step that calls several independent tools one after another, waiting for each to finish before starting the next, when none of them actually depend on each other's results -- wasting time that running them concurrently would save."
explanation: |
  When an agent needs several pieces of independent information --
  checking weather, checking calendar availability, checking flight
  prices, none of which depend on each other's results -- calling them
  one after another forces the total wait to be the *sum* of every
  individual call's latency. Since none of these calls need each
  other's output as input, they could run concurrently instead,
  making the total wait roughly the *slowest single call*, not the sum
  of all of them combined -- a real, meaningful latency difference,
  especially as the number of independent calls grows.

  This exercise's simulated tools record how long they were "in
  flight" simultaneously with others (a stand-in for real concurrency
  without needing actual threads or asyncio in this sandboxed check).
  The bug this exercise fixes calls each tool strictly one at a time,
  so no two calls ever overlap. The fix issues all the independent
  calls together before waiting on any of their results, letting them
  genuinely run concurrently.
example_code: |
  # The trap: calls each tool ONE AT A TIME, in sequence -- nothing
  # ever runs concurrently, even though nothing here depends on anything else.
  def run_sequential_trap(tool_calls, tracker):
      results = []
      for name, fn in tool_calls:
          tracker.start(name)
          results.append(fn())
          tracker.end(name)
      return results

  class OverlapTracker:
      def __init__(self):
          self.active = set(); self.max_concurrent = 0
      def start(self, name):
          self.active.add(name)
          self.max_concurrent = max(self.max_concurrent, len(self.active))
      def end(self, name):
          self.active.discard(name)

  tools = [("weather", lambda: "sunny"), ("calendar", lambda: "free at 3pm"), ("flights", lambda: "$320")]
  tracker = OverlapTracker()
  run_sequential_trap(tools, tracker)
  print(tracker.max_concurrent)   # 1 -- nothing ever overlapped, even though nothing here depended on anything else

  # The fix: start ALL independent calls together, before waiting on results.
  def run_concurrent(tool_calls, tracker):
      for name, fn in tool_calls:
          tracker.start(name)
      results = [fn() for name, fn in tool_calls]
      for name, fn in tool_calls:
          tracker.end(name)
      return results

  tracker2 = OverlapTracker()
  run_concurrent(tools, tracker2)
  print(tracker2.max_concurrent)   # 3 -- correctly reflects that all 3 independent calls overlapped
