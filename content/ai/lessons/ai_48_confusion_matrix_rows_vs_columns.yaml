  y_true = [0, 0, 1, 1, 1]
  y_pred = [0, 1, 1, 1, 0]
  print(confusion_matrix(y_true, y_pred, 2))
challenge: |
  Fix `confusion_matrix` so it indexes `matrix[t][p]` (actual as row,
  predicted as column), not `matrix[p][t]`. It should print
  `[[1, 1], [1, 2]]`.
expected_output: |
  [[1, 1], [1, 2]]
hints:
  - "Swap the indexing order inside the loop: matrix[t][p] += 1, not matrix[p][t] += 1."
  - "Row index = actual label (t), column index = predicted label (p) -- this is the scikit-learn convention downstream metrics assume."
