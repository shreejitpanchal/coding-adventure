challenge: |
  Replace the MSE-based `loss` with cross-entropy: `-log` of the
  probability assigned to `true_class_index`, guarding against `log(0)`.
  It should print `0.3567`, not the MSE value.
expected_output: |
  0.3567
hints:
  - "Add `import math`. Get p = predicted_probs[true_class_index], then clamp it: p = min(max(p, 1e-15), 1 - 1e-15)."
  - "Return -math.log(p) -- cross-entropy only ever looks at the probability assigned to the TRUE class, ignoring the other classes' probabilities entirely."
