id: ai_381
title: "Every Requested Tool Call in a Single Turn Needs to Actually Run"
language: ai
level: 381
objective: "Fix a tool-execution function that only runs the first of several requested tool calls, when a model requesting multiple tool calls in one turn expects every single one of them to actually execute, not just whichever happens to be listed first."
explanation: |
  A model can request several independent tool calls in a single turn
  -- checking the weather and the time at once, say -- and expects the
  next turn to include results for all of them, not just one.
  Executing only the first requested call silently drops every other
  one the model explicitly asked for, leaving the model to reason about
  its next step with incomplete information it has no way to know is
  incomplete.

  The bug this exercise fixes executes only `tool_calls[0]`. The fix
  executes every tool call the model actually requested.
example_code: |
  # The trap: only executes the FIRST requested tool call, ignoring
  # the rest of the batch.
  def execute_tool_calls_trap(tool_calls, tools_by_name):
      return [tools_by_name[tool_calls[0]]()]

  tools_by_name = {"get_weather": lambda: "sunny", "get_time": lambda: "3pm"}
  print(len(execute_tool_calls_trap(["get_weather", "get_time"], tools_by_name)))
  # 1 -- "get_time" never ran

  # The fix: execute every tool call that was actually requested.
  def execute_tool_calls(tool_calls, tools_by_name):
      return [tools_by_name[name]() for name in tool_calls]

  print(len(execute_tool_calls(["get_weather", "get_time"], tools_by_name)))
  # 2 -- correctly ran both requested tool calls
starter_code: |
  def execute_tool_calls(tool_calls, tools_by_name):
      return [tools_by_name[tool_calls[0]]()]

  tools_by_name = {"get_weather": lambda: "sunny", "get_time": lambda: "3pm"}
  print(len(execute_tool_calls(["get_weather", "get_time"], tools_by_name)))
challenge: |
  Fix `execute_tool_calls` so it returns `[tools_by_name[name]() for
  name in tool_calls]`, executing every requested tool call, instead of
  only `tool_calls[0]`. It should print `2`, not `1`.
expected_output: |
  2
hints:
  - "Replace the single-item list with a comprehension over tool_calls: [tools_by_name[name]() for name in tool_calls]."
  - "A model requesting several tool calls at once expects results back for every single one, not just whichever was listed first."
