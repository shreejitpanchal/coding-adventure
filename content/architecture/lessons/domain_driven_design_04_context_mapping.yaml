comprehension_check:
  - question: "What is a 'shared kernel' relationship between two bounded contexts?"
    options:
      - "Two contexts explicitly agree to share a small, jointly-owned piece of model that both depend on directly -- appropriate when it's genuinely small and stable"
      - "A relationship where the two contexts share absolutely nothing at all"
      - "A synonym for a full merge of two bounded contexts into one"
      - "A pattern that only applies to legacy systems"
    correct: 0
    explanation: "It's the tightest coupling option -- neither team can change the shared piece unilaterally, since both sides depend on it directly, so it only makes sense for something genuinely small and stable."
  - question: "When is an anti-corruption layer the right choice between two bounded contexts, according to this lesson?"
    options:
      - "When one context (e.g. a legacy or third-party system) is outside the downstream team's control, so they need insulation from its internal changes"
      - "It's always the best choice for every relationship between any two contexts"
      - "Only when the two contexts are owned by exactly the same team"
      - "It's never an appropriate choice between bounded contexts"
    correct: 0
    explanation: "Matching the coupling to the actual relationship matters -- an ACL insulates a downstream context from an upstream model the team has no influence over changing."
