comprehension_check:
  - question: "Why does an API Gateway's central position make it uniquely risky compared to any one individual microservice going down?"
    options:
      - "If the gateway itself goes down, nothing is reachable at all, regardless of how healthy every individual service behind it is -- unlike one service failing, which only affects its own functionality"
      - "The gateway has no more risk than any other single service in the system"
      - "A gateway going down only affects requests made on weekends"
      - "Microservices cannot function at all without a gateway present"
    correct: 0
    explanation: "The gateway becomes the single point of failure for a system that was specifically split into independent services to avoid exactly that kind of blast radius."
  - question: "What happens if a gateway calls three backend services sequentially and waits for all of them before responding?"
    options:
      - "Total latency becomes the sum of all three calls, and one slow or hanging service can stall the entire aggregated response even if the others responded instantly"
      - "The three calls automatically run in parallel regardless of how they're coded"
      - "It has no effect on latency at all"
      - "Sequential calls are always faster than concurrent calls"
    correct: 0
    explanation: "A naive gateway can turn one service's localized slowness into system-wide slowness -- the fix is issuing independent calls concurrently with their own timeouts, degrading gracefully instead of failing entirely."
