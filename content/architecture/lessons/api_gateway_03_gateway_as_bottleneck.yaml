id: api_gateway_03
title: "The Gateway as a Single Point of Failure"
language: architecture
level: 38
objective: "Understand why a gateway's central position -- exactly what makes it useful -- also makes its own availability and resilience uniquely critical, and the mitigations that address that risk."
explanation: |
  Every request to every service now passes through one component (see
  this category's previous two lessons) -- which is precisely what
  makes the gateway valuable, and precisely what makes it dangerous if
  it isn't built with that responsibility in mind. If twelve
  microservices are each independently deployed and one of them goes
  down, only the functionality that specific service provided is
  affected. If the gateway itself goes down, *nothing* is reachable at
  all, regardless of how healthy every individual service behind it
  is -- the gateway has become the single point of failure for a system
  that was specifically split into independent services to avoid
  exactly that kind of blast radius.

  The same concentration risk shows up in latency and fault
  propagation, not just total outages. If the gateway aggregates
  responses from three services (per this category's opening example)
  and calls them sequentially, the client's total latency is the *sum*
  of all three -- and if it calls them and waits for every one to
  respond before returning anything, one slow or hanging service can
  stall the entire aggregated response even though the other two
  services responded instantly. A naive gateway can turn one
  service's localized slowness into a system-wide slowness experienced
  by every client.

  The mitigations follow directly from naming the risk precisely: the
  gateway itself needs to be deployed with real redundancy (multiple
  instances behind a load balancer, not a single process), calls to
  independent backend services should be issued concurrently rather
  than sequentially where the responses don't depend on each other,
  and each backend call needs its own timeout and circuit breaker (see
  this track's own Circuit Breaker category) so one failing dependency
  degrades gracefully -- returning a partial response with the healthy
  data included, where the client experience allows it -- rather than
  making the entire aggregated request fail because of a single
  unhealthy dependency.
example_code: |
  # RISKY: sequential calls mean total latency is the SUM of every call,
  # and one hanging service stalls the ENTIRE response.
  def get_dashboard_naive(user_id):
      profile = user_service.get(user_id)              # waits fully before starting the next call
      orders = order_service.get_recent(user_id)
      recs = recommendation_service.get_for_user(user_id)
      return combine(profile, orders, recs)

  # BETTER: concurrent calls with per-call timeouts and graceful degradation --
  # one slow/failing service doesn't take down the whole aggregated response.
  def get_dashboard_resilient(user_id):
      results = run_concurrently([
          (user_service.get, user_id, timeout=2),
          (order_service.get_recent, user_id, timeout=2),
          (recommendation_service.get_for_user, user_id, timeout=2),
      ])
      profile = results["user_service"] if results["user_service"].ok else None
      orders = results["order_service"] if results["order_service"].ok else []
      recs = results["recommendation_service"] if results["recommendation_service"].ok else []
      return combine(profile, orders, recs)   # a partial response, not a total failure
