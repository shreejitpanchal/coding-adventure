comprehension_check:
  - question: "Why might a CQRS read model deliberately duplicate data that the write model already stores once?"
    options:
      - "Denormalizing pre-joins the data once, moving the cost of joining from every single read to the one-time cost of building the projection -- worthwhile when reads far outnumber writes"
      - "Data duplication is always a mistake with no valid justification"
      - "The write model and read model must always contain completely different, non-overlapping data"
      - "It's required by CQRS's specification with no performance rationale"
    correct: 0
    explanation: "A pre-joined document (customer name, product names, computed total already included) can be served directly with a single lookup, instead of joining across multiple tables on every read."
  - question: "When does denormalizing a read model NOT pay off, according to this lesson?"
    options:
      - "When the underlying data is rarely read -- denormalizing it is then pure overhead with no compensating benefit"
      - "It always pays off in every situation with no exceptions"
      - "Only when the write model has zero writes ever"
      - "Denormalization never has any downside to weigh against"
    correct: 0
    explanation: "The tradeoff specifically pays off when reads genuinely outnumber writes by a wide margin -- common for dashboards, but not universal."
