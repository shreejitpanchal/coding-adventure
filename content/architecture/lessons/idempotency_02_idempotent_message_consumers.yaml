concept_tags: [idempotency, at_least_once_delivery, event_driven_architecture, idempotent_consumer]
comprehension_check:
  - question: "Why does a message consumer need its own idempotency mechanism, distinct from an idempotency key generated by an API caller?"
    options:
      - "A consumer doesn't control whether a message gets redelivered under at-least-once delivery, so it defends itself using the message's own unique ID as the equivalent of an idempotency key"
      - "Message consumers never receive duplicate messages under any circumstances"
      - "Idempotency keys and message IDs are exactly the same mechanism with no adaptation needed"
      - "Consumers should always process every redelivered message again, regardless of duplication"
    correct: 0
    explanation: "The underlying problem is the same as an API retry -- a duplicate attempt at a logically one-time operation -- just triggered by broker redelivery instead of a client retry."
  - question: "Why must recording a message ID as processed happen in the SAME transaction as the side effect it guards?"
    options:
      - "A crash between performing the work and recording the ID could otherwise leave the system able to redo the work on the next delivery without any record that it already ran"
      - "Transactions have no bearing on idempotent consumer correctness at all"
      - "It's only necessary if the message broker is misconfigured"
      - "Recording the ID separately is always faster and equally safe"
    correct: 0
    explanation: "Atomicity between the side effect and the recorded ID ensures either both happen or neither does -- otherwise a crash at exactly the wrong moment reintroduces the duplicate-processing risk this pattern exists to prevent."
