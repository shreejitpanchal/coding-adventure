id: idempotency_02
title: "Idempotent Consumers for At-Least-Once Delivery"
language: architecture
level: 47
objective: "Apply the idempotency-key idea to message consumers, using a processed-message-ID record to make handling a duplicate event safe under at-least-once delivery."
explanation: |
  This track's Event-Driven Architecture category established that most
  message brokers guarantee *at-least-once* delivery -- a consumer
  should expect to receive the same message more than once occasionally
  and must be built to handle that safely. This category's opening
  lesson solved the equivalent problem for direct API calls using an
  idempotency key the *caller* generates. A message consumer faces the
  same underlying problem from the other side: it doesn't control
  whether a message gets redelivered, so it has to defend itself
  independently, using the message's own identity as the equivalent of
  an idempotency key.

  The standard mechanism is an **idempotent consumer**: before
  processing a message, the consumer checks whether that message's own
  unique ID has already been recorded as processed; if so, it
  acknowledges the message and returns without repeating the work,
  exactly mirroring the idempotency-key store from this category's
  opening lesson, except keyed by the broker's own message ID instead
  of a caller-generated key. If the ID hasn't been seen before, the
  consumer performs the actual work and records the ID as processed --
  critically, in the *same* atomic transaction as the work's own
  side effect, so a crash between "did the work" and "recorded the ID"
  can't leave the system able to redo the work on the next delivery
  without knowing it already ran.

  This is the same idempotency property as this category's opening
  lesson, just applied to a different trigger: instead of a client
  retrying an HTTP call because a response was lost, a broker
  redelivers a message because it never received an acknowledgment in
  time. Both cases produce a duplicate attempt at what's logically the
  same one-time operation, and both need the exact same fix -- checking
  a recorded identity before repeating a side effect, rather than
  trusting the transport layer to guarantee exactly-once delivery,
  which most real brokers deliberately don't promise (see this track's
  own lesson on why at-least-once, not exactly-once, is the realistic
  default).
example_code: |
  # WITHOUT an idempotent consumer: a redelivered message re-runs the
  # side effect -- e.g. sending a duplicate shipment-confirmation email.
  def handle_order_shipped_naive(message):
      send_confirmation_email(message.order_id)   # runs AGAIN on every redelivery

  # WITH an idempotent consumer: the message's own ID is checked first,
  # and the check + side effect are recorded atomically together.
  def handle_order_shipped_idempotent(message):
      with db.transaction():
          if processed_messages.exists(message.id):
              return                                # already handled -- redelivery, safely ignored
          send_confirmation_email(message.order_id)  # the actual work
          processed_messages.record(message.id)      # recorded in the SAME transaction as the work
  # A crash between the email and the record would be caught by the
  # transaction boundary -- either both happen, or neither does.
category: idempotency
category_level: 2
difficulty: core
