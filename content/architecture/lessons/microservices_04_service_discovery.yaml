comprehension_check:
  - question: "Why does hardcoding a service's network address break down in a modern microservices environment?"
    options:
      - "Services can be restarted with a new IP, scaled to multiple instances, or moved to a different host as normal operational behavior -- a hardcoded address goes stale the moment any of that happens"
      - "Hardcoded addresses never actually change in any real deployment"
      - "It only affects services written in compiled languages"
      - "Network addresses are irrelevant to how services communicate"
    correct: 0
    explanation: "In a containerized or auto-scaled environment, instances moving/restarting/scaling is routine, not a failure -- a hardcoded address can't keep up with that."
  - question: "What does service discovery let a caller do instead of hardcoding an address?"
    options:
      - "Look up a service by name at call time, letting the discovery layer resolve it to whichever instance(s) are currently healthy and available"
      - "It requires every caller to manually track every instance's IP address themselves"
      - "It eliminates the need for services to have network addresses at all"
      - "It only works for services running on the exact same physical machine"
    correct: 0
    explanation: "Whether via a dedicated registry (Consul, etcd) or a platform-managed DNS name (Kubernetes-style), the caller never needs to know or update anything when underlying instances change."
