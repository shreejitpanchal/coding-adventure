comprehension_check:
  - question: "What problem occurs when every microservice independently implements its own authentication and rate limiting?"
    options:
      - "It creates duplicated logic across every service, multiplying the places a security bug can be introduced or a format change needs updating, and lets clients evade a true quota by spreading requests across uncoordinated services"
      - "There is no problem -- duplicating this logic is always the best approach"
      - "It makes every service run measurably faster"
      - "It only affects services written in different programming languages"
    correct: 0
    explanation: "Twelve services each implementing token validation means twelve separate places a security bug or format-drift issue can appear, instead of one centralized, consistently-maintained implementation."
  - question: "What real cost does centralizing auth and rate limiting at the gateway introduce, according to this lesson?"
    options:
      - "The gateway becomes a single point of failure for these concerns across the entire system -- a bug in its auth logic now affects everything, since nothing downstream double-checks it"
      - "Centralizing these concerns has no downside whatsoever"
      - "It makes internal services incapable of ever being tested"
      - "It requires removing authentication from the system entirely"
    correct: 0
    explanation: "Since internal services trust that requests reaching them are already authenticated, the gateway's own auth logic must be correct -- a flaw there is a single point of failure for the whole system's security."
