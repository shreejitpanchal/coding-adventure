concept_tags: [hexagonal_architecture, ports_and_adapters, dependency_inversion]
comprehension_check:
  - question: "What problem occurs when business logic calls a specific database or SDK directly?"
    options:
      - "The dependency points the wrong way -- stable business logic ends up depending on infrastructure details, which are usually the most likely to change, making testing and swapping providers much harder"
      - "There is no problem -- this is always the correct approach"
      - "It makes the code run measurably faster in every case"
      - "It only affects compiled languages, never interpreted ones"
    correct: 0
    explanation: "Testing business logic that calls Stripe's SDK directly means needing a real Stripe sandbox (or elaborate mocks fighting the SDK's own API) instead of a simple substitute."
  - question: "What's the difference between a 'port' and an 'adapter' in Hexagonal Architecture?"
    options:
      - "A port is an interface the application core defines in its own vocabulary; an adapter is a concrete implementation of that port using a specific technology, plugged in from outside"
      - "They are the same thing, just different names for it"
      - "A port is always a network port number; an adapter is a type of cable"
      - "Ports are only used in Java, adapters only in Python"
    correct: 0
    explanation: "PaymentGateway is a port defined by the core; StripePaymentAdapter (real) and FakePaymentGateway (test) are two different adapters implementing that same port."
  - question: "Why does substituting a FakePaymentGateway in tests work so easily under this architecture?"
    options:
      - "Because the business logic only ever depends on the PaymentGateway port interface, never on a concrete adapter like Stripe's SDK directly"
      - "Because Hexagonal Architecture requires disabling all tests"
      - "Because FakePaymentGateway happens to be faster at making real network calls"
      - "It doesn't actually work easily -- this is a common misconception"
    correct: 0
    explanation: "Since OrderService depends on the PaymentGateway interface (not on Stripe directly), any class implementing that interface -- real or fake -- can be substituted with zero changes to OrderService itself."
