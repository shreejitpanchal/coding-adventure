concept_tags: [saga_pattern, distributed_transactions, compensating_actions, microservices]
comprehension_check:
  - question: "Why doesn't a single database rollback work once a transaction spans multiple microservices?"
    options:
      - "Each service has its own database and commits its own local changes independently -- there's no shared transaction mechanism spanning multiple separate databases"
      - "Rollbacks are impossible in any database, monolith or not"
      - "Microservices don't use databases at all"
      - "It works exactly the same as a single-database rollback, with no difference"
    correct: 0
    explanation: "Once InventoryService and BillingService each commit to their own database independently, there's no single rollback mechanism that can undo both at once -- that's exactly the problem the Saga pattern is designed to address."
  - question: "What does a saga do instead of relying on a database rollback when a later step fails?"
    options:
      - "It runs explicit compensating actions (like refund_payment or release_inventory) in reverse order to semantically undo whatever already succeeded"
      - "It ignores the failure and proceeds as if nothing happened"
      - "It deletes the entire database and starts over"
      - "It waits indefinitely for the failed step to eventually succeed with no compensation at all"
    correct: 0
    explanation: "Each step's compensating action is a normal local operation in its own service -- not a database-level rollback -- explicitly correcting the temporary inconsistency the saga passed through."
  - question: "What property must compensating actions generally have, since a compensation might itself need to be retried?"
    options:
      - "Idempotency -- safe to run more than once without causing incorrect results"
      - "They must always run faster than the original action"
      - "They must never be automated"
      - "They must always involve sending an email"
    correct: 0
    explanation: "If refund_payment() needs to be retried after a transient failure, running it twice must not double-refund -- this is exactly the idempotency property covered elsewhere in this track."
