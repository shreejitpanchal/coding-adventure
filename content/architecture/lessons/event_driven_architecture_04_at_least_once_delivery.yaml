comprehension_check:
  - question: "Why do most real message brokers guarantee 'at-least-once' delivery instead of 'exactly-once'?"
    options:
      - "Guaranteeing exactly-once delivery across an unreliable network with independently-failing services is extraordinarily expensive, so brokers instead guarantee a message is never lost, even if it means it might be delivered more than once"
      - "Brokers are buggy and this is an unintentional flaw"
      - "Exactly-once delivery is trivially easy and brokers just choose not to implement it"
      - "At-least-once delivery means messages are sometimes lost entirely"
    correct: 0
    explanation: "A lost acknowledgment from consumer back to broker is a normal failure mode -- the broker, unsure whether the message was handled, redelivers it rather than risk losing it."
  - question: "What must an event consumer do to safely handle at-least-once delivery?"
    options:
      - "Be idempotent -- processing the same event twice must produce the same result as processing it once, typically by tracking already-processed event IDs"
      - "Nothing -- at-least-once delivery requires no special handling from consumers"
      - "Refuse to process any event that could theoretically be redelivered"
      - "Always process every event exactly twice on purpose"
    correct: 0
    explanation: "A consumer that blindly decrements inventory on every OrderPlaced event will double-decrement on redelivery -- tracking processed event IDs prevents this."
