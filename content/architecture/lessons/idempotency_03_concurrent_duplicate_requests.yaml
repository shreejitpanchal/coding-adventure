comprehension_check:
  - question: "How can two concurrent requests with the same idempotency key both end up performing a non-idempotent side effect, despite the idempotency key existing?"
    options:
      - "A naive check-then-act implementation lets both requests see 'key not found' before either has finished recording its result, since the check and the act aren't atomic"
      - "This is impossible once an idempotency key is in use, under any timing"
      - "Idempotency keys only protect against sequential retries and were never intended to handle any concurrency"
      - "It only happens if the idempotency key itself is invalid"
    correct: 0
    explanation: "A narrow timing window where both requests pass the lookup before either records a result reproduces the exact double-charge outcome the idempotency key was meant to prevent."
  - question: "What is the fix for this race condition?"
    options:
      - "Make the check and the act one atomic operation -- e.g. an atomic 'insert if not exists' against the idempotency store, so only one concurrent request can win it"
      - "Add a longer timeout to the client so it never retries"
      - "Remove the idempotency key mechanism entirely, since it doesn't help"
      - "Always process every request twice to guarantee consistency"
    correct: 0
    explanation: "This is the same fix as any other check-then-act race condition -- closing the gap between checking and acting with a single atomic operation, using the database's own uniqueness guarantee."
