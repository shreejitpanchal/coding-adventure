comprehension_check:
  - question: "What failure mode can occur even with a circuit breaker in place, if all outbound calls share one thread/connection pool?"
    options:
      - "A struggling dependency can exhaust the entire shared pool with slowly-timing-out calls before the circuit breaker trips, starving calls to completely unrelated, healthy dependencies"
      - "Circuit breakers make shared resource pools completely unnecessary"
      - "Shared pools have no downside as long as a circuit breaker exists somewhere in the system"
      - "This failure mode only happens if the circuit breaker is misconfigured"
    correct: 0
    explanation: "While threads sit blocked waiting on the struggling service, calls to healthy services have no threads left to run on -- pure resource contention, with no actual coupling between the services themselves."
  - question: "How does the Bulkhead pattern prevent that failure mode?"
    options:
      - "It gives each dependency its own dedicated, isolated resource pool, so exhaustion in one dependency's pool is contained and can't starve calls to other dependencies"
      - "It merges all dependencies into a single larger shared pool"
      - "It removes the need for a circuit breaker entirely"
      - "It only isolates pools for dependencies that have never failed before"
    correct: 0
    explanation: "Named after a ship's watertight compartments, bulkheads contain resource exhaustion to one dependency's own pool -- complementary to a circuit breaker, which then stops sending that struggling dependency more traffic."
