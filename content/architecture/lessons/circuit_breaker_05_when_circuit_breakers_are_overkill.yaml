comprehension_check:
  - question: "Why doesn't a plain in-process function call need a circuit breaker?"
    options:
      - "It doesn't have the risk profile a circuit breaker protects against -- it fails atomically and immediately, with no independent slowdown or network-hang failure mode to guard against"
      - "In-process calls are technically incapable of ever failing"
      - "Circuit breakers only work across network boundaries for technical reasons unrelated to risk"
      - "Every function call in a codebase should always be wrapped in a circuit breaker regardless of risk"
    correct: 0
    explanation: "An in-process call doesn't get slower under load the way an independently-scaled remote service can, and has no 'hanging while tying up a connection pool' failure mode -- the exact risk circuit breakers exist to mitigate."
  - question: "Where does a circuit breaker actually earn its cost, according to this lesson?"
    options:
      - "At genuine network boundaries to genuinely independent systems -- another microservice, a third-party API, a database over the network -- where the caller and callee can fail on independent timelines"
      - "Everywhere in a codebase, with no exceptions, regardless of whether a network call is involved"
      - "Only inside unit tests, never in production code"
      - "Circuit breakers never actually earn their cost in any situation"
    correct: 0
    explanation: "This mirrors the same discipline this track applies to other patterns: identify the actual risk being protected against, and reach for the pattern exactly where that risk is real."
