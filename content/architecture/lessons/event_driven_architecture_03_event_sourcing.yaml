comprehension_check:
  - question: "What does event sourcing store as the source of truth, instead of current state directly?"
    options:
      - "The complete, ordered sequence of events that led to the current state -- current state is derived by replaying them"
      - "Only the very latest value, exactly like a conventional database"
      - "Nothing is stored at all -- state exists only in memory"
      - "A single snapshot taken once, never updated again"
    correct: 0
    explanation: "This makes questions like 'what was the status at 2pm last Tuesday' answerable by replaying events up to that point -- impossible once a conventional model has overwritten the old value."
  - question: "How does event sourcing handle correcting a mistake, given that past events are immutable?"
    options:
      - "By appending a new compensating event, rather than editing or deleting the original event"
      - "By deleting the incorrect event from the log entirely"
      - "By rewriting history so the mistake never appears to have happened"
      - "Mistakes cannot be corrected at all in an event-sourced system"
    correct: 0
    explanation: "This preserves an honest, permanent record of what actually happened -- including the mistake and its correction -- rather than silently erasing it."
