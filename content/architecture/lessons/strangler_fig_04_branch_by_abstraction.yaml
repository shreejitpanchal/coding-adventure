comprehension_check:
  - question: "What problem does Branch by Abstraction avoid, compared to a long-lived feature branch?"
    options:
      - "A single risky big-bang merge event, since the new implementation is built and merged incrementally behind a runtime flag instead"
      - "It avoids the need to ever write any new code at all"
      - "It eliminates the need for any interface or abstraction layer"
      - "It requires the old implementation to be deleted before any new code is written"
    correct: 0
    explanation: "A long-lived branch eventually needs one risky big-bang merge -- Branch by Abstraction lets the new implementation be merged in small pieces the whole time, disabled behind a flag until it's ready."
  - question: "What happens to the abstraction layer introduced by Branch by Abstraction once the migration is complete?"
    options:
      - "It gets deleted along with the old implementation -- it was a temporary migration scaffold, not a permanent design fixture"
      - "It must be kept in the codebase forever, unchanged"
      - "It automatically becomes the new implementation itself"
      - "It's converted into a completely separate microservice"
    correct: 0
    explanation: "Once the new implementation is fully validated, both the old implementation and the now-unneeded abstraction are removed -- the abstraction only existed to make the incremental switch possible."
