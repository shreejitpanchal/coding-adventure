comprehension_check:
  - question: "What scaling problem does hand-written REST-style gateway aggregation run into?"
    options:
      - "The gateway's own code grows in proportion to the number of different client data-shape combinations needed, since each combination needs its own hand-written aggregation method"
      - "REST-style aggregation has no scaling problems of any kind"
      - "It can only ever support exactly one combination of data per gateway"
      - "It requires rewriting every backend service for each new combination"
    correct: 0
    explanation: "A new screen needing a different combination of profile/orders/recommendations means either another hand-written method or growing query-parameter logic in the gateway."
  - question: "How does GraphQL federation address that scaling problem?"
    options:
      - "Each service declares its own piece of a combined schema, and clients send a query expressing exactly the fields/combination they want -- no pre-written aggregation method is needed for each combination"
      - "It eliminates the need for any backend services to communicate at all"
      - "It requires exactly one service to own the entire combined schema"
      - "It removes the need to handle fan-out, timeouts, or partial failures entirely"
    correct: 0
    explanation: "The client's query itself expresses the desired combination -- but the underlying fan-out, timeout, and partial-failure concerns from aggregating across services still exist under the hood."
