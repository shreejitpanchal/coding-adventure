id: api_gateway_04
title: "GraphQL Federation as an Alternative to Hand-Rolled Aggregation"
language: architecture
level: 39
objective: "Understand GraphQL federation as an alternative to a gateway's hand-written aggregation code, letting each service declare its own piece of a combined schema instead of a central gateway hardcoding every combination."
explanation: |
  The `combine(profile, orders, recs)` style of gateway aggregation used
  throughout this category works, but it has a scaling problem of its
  own: every new combination of data a client might want (a screen
  needing profile + orders but not recommendations; a different screen
  needing recommendations + orders but not profile) means another
  hand-written aggregation method in the gateway, or a growing set of
  query parameters controlling which pieces to include. The gateway's
  own code grows in proportion to the number of client data-shape
  combinations, not the number of underlying services.

  **GraphQL federation** addresses this differently: each backend
  service declares its own piece of a single, combined GraphQL schema
  (`UserService` owns the `User` type's fields, `OrderService` owns the
  `Order` type's fields and how an `Order` relates to a `User`), and a
  federation gateway stitches those declarations into one unified
  schema at startup. Clients then send a single GraphQL query
  specifying *exactly* the fields they want, in whatever combination
  they need, and the federation gateway resolves that query by calling
  only the specific services that own the requested fields --
  no hand-written aggregation method has to exist in advance for that
  particular combination, because the client's query itself expresses
  the combination.

  This isn't a strictly better replacement for a REST-style aggregating
  gateway -- it trades one kind of complexity for another. A federated
  schema requires real discipline across every contributing team (each
  service's schema fragment has to compose correctly with every other
  team's, and a bad or breaking schema change now has system-wide
  reach), and the resolution logic under the hood still has to solve
  exactly the same fan-out, timeout, and partial-failure concerns this
  category's previous lesson covered -- federation changes how the
  aggregation is *expressed* and *discovered*, not whether the
  underlying multi-service coordination problem exists at all.
example_code: |
  # Hand-written gateway aggregation: a NEW method for every combination clients need.
  class ApiGateway:
      def get_profile_and_orders(self, user_id): ...      # one specific combination
      def get_orders_and_recs(self, user_id): ...          # another specific combination
      def get_everything(self, user_id): ...                # yet another

  # GraphQL federation: each service declares ITS OWN piece of one combined schema.
  # UserService's schema fragment:
  #   type User { id: ID!, name: String! }
  # OrderService's schema fragment:
  #   type Order { id: ID!, total: Float! }
  #   extend type User { orders: [Order!]! }   # OrderService extends User with its own field

  # A client sends ONE query expressing exactly the combination it needs --
  # no gateway method had to be pre-written for this specific shape:
  # query {
  #   user(id: "123") {
  #     name
  #     orders { total }
  #   }
  # }
  # The federation gateway resolves this by calling UserService for `name`
  # and OrderService for `orders`, then combining -- automatically, per query.
