comprehension_check:
  - question: "What problem does a single, shared 'Customer' model used across Sales, Support, and Billing tend to create?"
    options:
      - "It forces three genuinely different concerns to agree on one shape, leading to bloat or constant cross-team merge conflicts as each team's changes affect the others"
      - "It has no downsides at all and is always the most efficient approach"
      - "It makes the codebase impossible to compile"
      - "Shared models are only a problem in monolithic architectures, never in any other context"
    correct: 0
    explanation: "Sales, Support, and Billing each care about different fields and different rules -- a single shared model either bloats with irrelevant fields or becomes a source of conflicts."
  - question: "What is a 'bounded context' in Domain-Driven Design?"
    options:
      - "An explicit boundary within which a specific model (like a domain-specific definition of 'Customer') is consistent and meaningful, which may not apply outside that boundary"
      - "A synonym for a single shared database table used by every team"
      - "A rule that says every domain must use exactly one universal model"
      - "A type of network boundary with no relation to domain modeling"
    correct: 0
    explanation: "Sales' Prospect, Support's Ticketholder, and Billing's PayingAccount are three legitimately different models within their own bounded contexts, not three views onto one 'true' shared Customer object."
  - question: "According to DDD, what's the actual anti-pattern being pushed back against?"
    options:
      - "Reflexively normalizing everything into one shared domain model for an entire business, rather than recognizing where distinct bounded contexts naturally belong"
      - "Ever having more than one class in a codebase"
      - "Using any form of object-oriented programming at all"
      - "Splitting an application into multiple deployable services"
    correct: 0
    explanation: "A large business genuinely has multiple domains with different rules and vocabulary -- DDD teaches recognizing and deliberately drawing boundaries between them, instead of forcing one shared model everywhere."
