comprehension_check:
  - question: "What does CQRS split apart that a typical single-model application keeps combined?"
    options:
      - "The write path (commands, enforcing business invariants) from the read path (queries, often against a separately optimized, denormalized model)"
      - "It splits the frontend from the backend entirely"
      - "It splits every class into exactly two files"
      - "It has nothing to do with reads or writes at all"
    correct: 0
    explanation: "Commands go through a write model enforcing invariants; queries read from a separate model purpose-built for how the data is actually queried."
  - question: "What's the real cost CQRS introduces, and why does it matter?"
    options:
      - "The read model is only eventually consistent with the write model -- there's a real window where a just-written change hasn't appeared in reads yet"
      - "CQRS has no real cost at all and should always be used"
      - "CQRS makes writes and reads use the exact same model, so there's no consistency concern"
      - "CQRS eliminates the need for a database entirely"
    correct: 0
    explanation: "Keeping the read model in sync (often via published events) is asynchronous, so there's a genuine, if usually small, delay before a write shows up in queries."
  - question: "When is CQRS actually the right choice, according to the reasoning here?"
    options:
      - "When the read and write shapes/scaling needs have genuinely diverged enough to justify maintaining two models and their synchronization -- not as a default for every application"
      - "For every single application, starting on day one, regardless of complexity"
      - "Only for applications with no read operations at all"
      - "CQRS should never be used under any circumstances"
    correct: 0
    explanation: "Applying full CQRS to a small CRUD app where one simple model already serves both jobs well adds real overhead with no corresponding benefit -- a widely recognized case of over-engineering."
