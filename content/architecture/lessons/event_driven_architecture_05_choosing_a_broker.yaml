comprehension_check:
  - question: "Why might two events for the same order need to be partitioned together in a log-based broker?"
    options:
      - "To guarantee they're processed in the order they actually happened -- ordering is typically only guaranteed within a single partition, not across the whole topic"
      - "Partitioning has no effect on the order in which events are processed"
      - "All events across every order must always share one single partition"
      - "Partitioning only affects how much disk space a broker uses"
    correct: 0
    explanation: "Partitioning by order_id keeps PaymentReceived before OrderShipped for the SAME order, while different orders' events can still be processed independently and concurrently."
  - question: "What does 'replayability' let a brand-new consumer do that a simple consume-and-discard queue typically can't?"
    options:
      - "Read the entire historical event log from the beginning, not just events published after the consumer started listening"
      - "Replayability has no practical use case in real systems"
      - "Consume events faster than any other broker feature allows"
      - "It only allows replaying the single most recent event"
    correct: 0
    explanation: "This is what makes event sourcing practical, and what lets a new CQRS read-model service bootstrap itself from the complete history instead of starting with an empty, incomplete view."
