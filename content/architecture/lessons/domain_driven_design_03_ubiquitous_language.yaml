comprehension_check:
  - question: "What does the ubiquitous language principle require, within a single bounded context?"
    options:
      - "Code's class, method, and variable names should be the exact words domain experts actually use, not a technical translation of them"
      - "Every class must be named using only generic, technology-neutral terms"
      - "Domain experts should learn to use the codebase's existing technical vocabulary instead"
      - "It only applies to comments, never to actual code identifiers"
    correct: 0
    explanation: "If underwriters say 'bind a policy' but the code has finalizeInsuranceRecord(), that mismatch is a quiet, compounding translation cost paid on every conversation between engineers and domain experts."
  - question: "According to this lesson, how should the ubiquitous language be treated as a project progresses?"
    options:
      - "As something that evolves -- if a better term is jointly discovered later, the code should be renamed to match, not left as a one-time naming decision"
      - "It should be fixed permanently on day one and never changed again"
      - "It only matters during the initial project kickoff meeting"
      - "It has nothing to do with renaming code over time"
    correct: 0
    explanation: "The vocabulary is an artifact worth actively maintaining -- as understanding deepens, code should be updated to keep speaking the domain's current, actual language."
