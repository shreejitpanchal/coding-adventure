comprehension_check:
  - question: "What's the key structural difference between a modular monolith and microservices?"
    options:
      - "Microservices split modules into genuinely separate processes/deployments (often with their own databases), while a modular monolith's modules still share one process and one deployment"
      - "A modular monolith has no internal organization at all"
      - "Microservices always run faster than any monolith"
      - "There is no real difference -- they're the same thing with different names"
    correct: 0
    explanation: "Independent deployability -- being able to ship one service without rebuilding/redeploying everything -- is the defining benefit microservices add over a modular monolith."
  - question: "What complexity do microservices introduce that a single-process monolith doesn't have to deal with?"
    options:
      - "Every service-to-service interaction is now a network call that can time out or partially fail, and there's typically no single database transaction spanning multiple services anymore"
      - "Microservices eliminate the need for any error handling"
      - "Microservices guarantee every operation is instantly consistent across all services"
      - "There is no added complexity -- it's strictly simpler than a monolith"
    correct: 0
    explanation: "A local function call can only return or raise; a network call to another service can also time out or fail partially -- this is why patterns like Saga exist, to handle transactions that now span independently-failing services."
  - question: "According to a common, well-documented architecture mistake, when should a team typically adopt microservices?"
    options:
      - "When genuine organizational (many independent teams) or scaling pressure justifies the added operational complexity -- not simply because the pattern is popular"
      - "Immediately, for every project, regardless of team size or scale"
      - "Only for projects with fewer than 2 developers"
      - "Microservices should replace monoliths in literally every case with no exceptions"
    correct: 0
    explanation: "A well-factored modular monolith is often the right starting point, with microservices adopted later once real scaling or team-independence pressure actually appears -- adopting them prematurely is a common, expensive mistake."
