comprehension_check:
  - question: "What is the composition root's job?"
    options:
      - "It's the single place in the codebase that knows about both the core's port interfaces and the concrete adapter classes, wiring them together -- typically at the application's entry point"
      - "It's a synonym for the application core's own business logic"
      - "It's a database table storing configuration values"
      - "Every class in the codebase should independently act as its own composition root"
    correct: 0
    explanation: "It imports both StripePaymentAdapter and OrderService and wires them together, while OrderService itself never imports StripePaymentAdapter at all."
  - question: "What is the specific tell that composition-root discipline has been violated somewhere in the codebase?"
    options:
      - "A concrete adapter class name shows up directly inside the application core's own logic, instead of only inside the composition root"
      - "The application has more than one adapter implementing the same port"
      - "The composition root is located in a file called main.py"
      - "Tests use a fake instead of a real adapter"
    correct: 0
    explanation: "If OrderService referenced StripePaymentAdapter directly anywhere, it would be depending on a concrete adapter again -- undoing the whole point of defining PaymentGateway as a port."
