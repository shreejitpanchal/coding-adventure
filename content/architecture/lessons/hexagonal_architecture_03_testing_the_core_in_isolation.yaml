comprehension_check:
  - question: "Why is an in-memory fake different from a typical mocking-library mock, in this lesson's framing?"
    options:
      - "A fake is a small, real, working implementation of the port's contract (it genuinely stores and returns data), not just an object recording 'was this method called' assertions"
      - "Fakes and mocks are exactly the same thing with no meaningful difference"
      - "Fakes always require a real network connection, unlike mocks"
      - "Mocks are always faster than fakes in every situation"
    correct: 0
    explanation: "InMemoryOrderRepository genuinely stores and returns saved orders, closely enough to real behavior to exercise genuine logic, while staying fast and fully in-process."
  - question: "What is the three-tier test strategy this lesson describes?"
    options:
      - "Many fast unit tests against the core using fakes for every port, a smaller set of adapter tests verifying each real adapter against its actual technology, and a handful of full end-to-end tests"
      - "Only end-to-end tests, since Hexagonal Architecture makes unit testing unnecessary"
      - "Only unit tests, since adapters never need to be tested at all"
      - "A single test tier that mixes fakes and real infrastructure randomly"
    correct: 0
    explanation: "This gives the core's business rules fast, thorough testing without paying real-infrastructure costs on every single test, while adapter and end-to-end tests still catch what fakes alone can't."
