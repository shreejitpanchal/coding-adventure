comprehension_check:
  - question: "Is event sourcing required to implement CQRS?"
    options:
      - "No -- CQRS is only about separating the write model from the read model, and says nothing about how the write model itself stores data; they're independent, separable patterns"
      - "Yes, CQRS cannot exist without a full event-sourced write model"
      - "CQRS and event sourcing are the exact same pattern with two different names"
      - "Event sourcing replaces CQRS entirely, making CQRS unnecessary"
    correct: 0
    explanation: "A simpler CQRS variant keeps a conventional write database and simply triggers a direct update to a separate read model after each write, with no event log at all."
  - question: "What does the simpler, non-event-sourced CQRS variant give up compared to the full event-sourced version?"
    options:
      - "A full audit history and true replayability -- 'what was this at time T' isn't answerable without an event log to replay"
      - "It gives up the ability to have a separate read model at all"
      - "It gives up nothing -- the two variants are functionally identical"
      - "It requires MORE infrastructure than the event-sourced version"
    correct: 0
    explanation: "The simpler variant keeps CQRS's core benefit (an independently optimized read model) while avoiding event sourcing's specific costs (schema versioning, snapshotting, out-of-order handling)."
