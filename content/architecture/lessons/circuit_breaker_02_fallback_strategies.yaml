id: circuit_breaker_02
title: "Fallback Strategies When the Circuit Is Open"
language: architecture
level: 42
objective: "Understand the range of responses available when a circuit breaker is open -- beyond simply failing -- and how to choose one appropriate to what the call was actually for."
explanation: |
  This category's opening lesson showed a circuit breaker raising a
  `CircuitOpenError` immediately once open -- failing fast instead of
  waiting out a doomed timeout. Failing fast is strictly better than
  failing slow, but "fail" is still often not the best available
  response; what a caller should actually do when the circuit is open
  depends entirely on what that call was for, and treating every open
  circuit identically wastes an opportunity to degrade far more
  gracefully than an outright error.

  A **cached fallback** returns the last known-good response instead of
  a fresh one -- a product recommendation service that's currently
  unreachable can fall back to yesterday's cached recommendations
  rather than showing nothing at all; slightly stale recommendations
  are a far better user experience than a visible error message on the
  page. A **default/degraded value** returns a reasonable placeholder
  when no cached data exists to fall back to -- a "trending items"
  widget that can't reach its personalization service might show a
  generic, non-personalized bestseller list instead. A **fail loudly**
  response is still correct for calls where a wrong or stale answer
  would be actively harmful rather than merely less good -- a payment
  authorization call has no acceptable "stale" fallback; if the
  payment gateway's circuit is open, the checkout should fail visibly
  rather than silently proceeding with unconfirmed payment information.

  Choosing the right fallback per call site is a deliberate design
  decision, not a detail to default uniformly across a codebase:
  it requires knowing whether staleness is tolerable for that specific
  piece of data, and whether a wrong answer is actively worse than a
  visible failure. A circuit breaker without any thought put into its
  fallback path just relocates where a failure surfaces, without
  capturing the real benefit graceful degradation could have provided
  the user.
example_code: |
  # Fail-fast with no fallback: strictly better than hanging, but still
  # a visible error where a better user experience was available.
  def get_recommendations(user_id):
      try:
          return circuit_breaker.call(recommendation_service.get, user_id)
      except CircuitOpenError:
          raise                      # the user just sees a broken widget

  # Cached fallback: stale data beats a visible error for low-stakes reads.
  def get_recommendations_with_fallback(user_id):
      try:
          recs = circuit_breaker.call(recommendation_service.get, user_id)
          cache.set(user_id, recs)
          return recs
      except CircuitOpenError:
          return cache.get(user_id, default=GENERIC_BESTSELLERS)   # graceful degradation

  # Fail loudly on purpose: a wrong/stale answer would be actively harmful.
  def authorize_payment(order):
      try:
          return circuit_breaker.call(payment_gateway.authorize, order)
      except CircuitOpenError:
          raise CheckoutUnavailableError()   # no acceptable fallback exists for this call
