comprehension_check:
  - question: "Why is 'fail' often not the best response when a circuit breaker is open?"
    options:
      - "What the call was for matters -- a cached or degraded fallback (like slightly stale recommendations) can provide a far better experience than a visible error, when staleness is tolerable for that data"
      - "Failing fast is always worse than waiting out a full timeout"
      - "Circuit breakers are incapable of ever failing, only succeeding"
      - "Fallback strategies only exist for payment-related calls"
    correct: 0
    explanation: "Choosing the right fallback per call site is deliberate: cached/default responses work well for data where staleness is tolerable, while fail-fast is still correct where a wrong answer would be actively harmful."
  - question: "Why does a payment authorization call use a 'fail loudly' fallback instead of a cached or default response?"
    options:
      - "A wrong or stale answer for payment authorization would be actively harmful, not just less good -- there's no acceptable stale substitute for confirming a real charge succeeded"
      - "Payment calls should never use a circuit breaker at all"
      - "Fail loudly is always the correct choice for every kind of call, with no exceptions"
      - "Caching payment data is technically impossible"
    correct: 0
    explanation: "Unlike recommendations, where slightly stale data is a fine substitute, silently proceeding with unconfirmed payment information would be worse than a visible checkout failure."
