concept_tags: [saga_pattern, pivot_transaction, distributed_transactions, retries]
comprehension_check:
  - question: "What is a saga's pivot transaction?"
    options:
      - "The step after which backward compensation is no longer possible or appropriate, and failures must instead be handled by retrying forward until success"
      - "The very first step of every saga, with no exceptions"
      - "A step that has no effect on the saga's outcome either way"
      - "A transaction that always runs on a completely separate database"
    correct: 0
    explanation: "Once a courier has physically been dispatched, there's no clean compensation the way refund_payment() cleanly reverses a charge -- from that point on, the saga must retry forward instead."
  - question: "Why do sagas typically use different failure-handling logic before versus at/after the pivot transaction?"
    options:
      - "Steps before the pivot are safely undoable via compensation, while steps at or after it either can't be undone or shouldn't be, so retry-with-backoff is used instead"
      - "There is no meaningful difference, and both should always use identical logic"
      - "Steps before the pivot should never be retried under any circumstances"
      - "The pivot transaction only exists in sagas with exactly two steps"
    correct: 0
    explanation: "Treating the entire sequence as uniformly compensatable is exactly the mistake this lesson identifies -- identifying the pivot is a deliberate design step for every saga."
