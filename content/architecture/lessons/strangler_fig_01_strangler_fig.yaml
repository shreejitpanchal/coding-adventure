comprehension_check:
  - question: "What's the main risk of a 'big bang' full rewrite that the Strangler Fig pattern is designed to avoid?"
    options:
      - "Years of accidentally-load-bearing edge-case handling in the legacy system get rediscovered (or missed) all at once, on the day of a single high-risk cutover with no fallback"
      - "Big bang rewrites are always faster than incremental migration"
      - "There is no risk at all in a full rewrite -- the pattern solves a non-problem"
      - "Strangler Fig has nothing to do with rewrites or migrations"
    correct: 0
    explanation: "A full cutover exposes every gap in the new system at once, with the old system already decommissioned and unavailable as a fallback -- the worst possible way to discover what was missing."
  - question: "How does the Strangler Fig pattern route traffic during a migration?"
    options:
      - "A routing facade sends most traffic to the legacy system while incrementally redirecting specific, validated routes to new services one at a time"
      - "All traffic switches to the new system on day one, with no facade at all"
      - "It requires deleting the legacy system before writing any new code"
      - "It only works if the legacy system is already fully decommissioned"
    correct: 0
    explanation: "Both the legacy system and newly migrated services run simultaneously in production -- each migrated route can be validated independently, with an easy fallback to legacy if something's wrong."
  - question: "What's the real, ongoing cost of using the Strangler Fig pattern during a migration?"
    options:
      - "Running two systems side by side (the legacy system plus the routing facade and new services) for an extended period is a genuine operational cost, not free"
      - "There is no cost at all -- it's strictly better than a rewrite in every situation"
      - "It requires no additional infrastructure whatsoever"
      - "It only takes one day to complete, same as a big-bang rewrite"
    correct: 0
    explanation: "For a small, well-understood legacy system, a straightforward rewrite can still be faster and simpler -- Strangler Fig earns its cost specifically when a big-bang cutover's risk is high enough to justify a longer, incremental migration."
