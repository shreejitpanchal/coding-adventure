comprehension_check:
  - question: "What is a driving (primary) port in Hexagonal Architecture?"
    options:
      - "An interface the application core exposes for the outside world to call INTO it, such as a use-case interface an HTTP controller or CLI handler depends on"
      - "The exact same thing as a driven port, just a different name"
      - "An interface the core uses to call out to a database or external API"
      - "A port that only exists in web applications, never in CLI tools"
    correct: 0
    explanation: "A driving port like PlaceOrderUseCase is called into by driving adapters (an HTTP controller, a CLI command) -- the core doesn't know or care which one triggered any given call."
  - question: "Why does the driving/driven distinction matter, beyond just naming?"
    options:
      - "It clarifies which side initiates the call relative to the core, and shows that the same core logic can be driven by multiple different entry-point adapters simultaneously with no awareness of which one is calling"
      - "It has no practical effect and is purely cosmetic terminology"
      - "Driven ports can only ever have one adapter, while driving ports can have unlimited adapters"
      - "It determines which programming language the core must be written in"
    correct: 0
    explanation: "A REST controller and a CLI tool can both call the exact same driving port/use-case interface -- the substitutability this provides mirrors the benefit driven ports provide on the outbound side."
