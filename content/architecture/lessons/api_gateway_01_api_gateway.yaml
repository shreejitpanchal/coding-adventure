comprehension_check:
  - question: "What problem does an API Gateway solve for clients of a microservices system?"
    options:
      - "Without it, every client would need to know the entire internal service topology and call multiple services directly, handling each one's auth and failures individually"
      - "It eliminates the need for microservices to have any network communication at all"
      - "It makes every internal service completely identical to every other one"
      - "There is no problem to solve -- gateways add pure overhead with no benefit"
    correct: 0
    explanation: "The gateway provides one stable entry point that can route, aggregate, and handle cross-cutting concerns (auth, rate limiting) once, so clients don't need to know the internal topology."
  - question: "Why might a single shared API Gateway eventually become a problem of its own?"
    options:
      - "Different client types (mobile, desktop web, partner integrations) can have genuinely different data-shape needs, and a single generic gateway accumulates client-specific conditional logic trying to serve all of them"
      - "API Gateways can only handle one request at a time, ever"
      - "A single gateway is always faster than having no gateway at all, with no downside"
      - "Gateways are incompatible with microservices architecture entirely"
    correct: 0
    explanation: "A mobile client on a slow connection wants a small summarized payload, while a desktop dashboard wants full detail -- one generic gateway trying to serve both accumulates complexity."
  - question: "What does the Backend-for-Frontend (BFF) pattern do differently from a single shared API Gateway?"
    options:
      - "It gives each distinct client type its own dedicated gateway, tailored specifically to that client's needs, instead of one gateway serving every client"
      - "It removes the API Gateway layer entirely"
      - "It requires every client to have identical needs by definition"
      - "It only works for exactly one client type, the same as a single gateway"
    correct: 0
    explanation: "The tradeoff is maintaining multiple gateways instead of one -- worth it specifically when different clients' needs have diverged enough that a shared gateway's compromises are hurting more than one client type."
