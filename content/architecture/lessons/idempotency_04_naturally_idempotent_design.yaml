comprehension_check:
  - question: "How does combining a client-generated resource ID with an upsert make an operation naturally idempotent?"
    options:
      - "Calling it once creates the resource; calling it again with the same ID and data simply overwrites the same row with the same values, harmless by construction, with no separate tracking record needed"
      - "Client-generated IDs have no effect on idempotency whatsoever"
      - "It requires the server to reject every request after the first one"
      - "Upserts are inherently non-idempotent and make the problem worse"
    correct: 0
    explanation: "This is exactly why HTTP designates PUT (caller-specified identity) as idempotent while POST (server-assigned identity, inherently creates a new thing) is not."
  - question: "When is the idempotency-key store mechanism from earlier lessons in this category still needed, according to this lesson?"
    options:
      - "Specifically for operations that can't be redesigned to be naturally idempotent -- like a real card charge, which has no 'absolute value' version of itself"
      - "It's never needed once natural idempotency techniques are known"
      - "It's needed for every single operation, even ones that are naturally idempotent by design"
      - "Only for read-only operations like GET requests"
    correct: 0
    explanation: "Natural idempotency (upserts, absolute-value assignments) removes the need for bookkeeping where the operation itself can be redesigned -- the key-store mechanism remains necessary for operations that genuinely can't be redesigned that way."
