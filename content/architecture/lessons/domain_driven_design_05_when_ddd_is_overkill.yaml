comprehension_check:
  - question: "What determines whether DDD's full toolkit is worth applying to a given project, according to this lesson?"
    options:
      - "The domain's actual complexity -- intricate business rules, divergent team concepts, evolving behavior -- not the size of the organization building it"
      - "Whether the company building it has more than 100 employees"
      - "DDD should always be applied to every project regardless of domain complexity"
      - "Whether the project uses a relational database"
    correct: 0
    explanation: "A one-person project with a genuinely gnarly domain can benefit from DDD's modeling tools, while a fifty-person team building straightforward CRUD screens gets nothing from the ceremony."
  - question: "What happens when DDD's machinery (aggregates, bounded contexts, context mapping) is applied to a domain with no real underlying complexity?"
    options:
      - "It adds indirection and process with nothing underneath it to protect -- the machinery has no specific problem to attach to"
      - "It always makes the application meaningfully faster"
      - "It has no downside whatsoever in any situation"
      - "It automatically simplifies the codebase regardless of the domain"
    correct: 0
    explanation: "DDD's ceremony is the price of correctly modeling genuine complexity -- without that complexity present, the same machinery is pure cost with no corresponding benefit."
