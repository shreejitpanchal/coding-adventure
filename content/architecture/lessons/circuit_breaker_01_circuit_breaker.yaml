comprehension_check:
  - question: "How can naive retrying make a struggling downstream service's situation worse?"
    options:
      - "The service keeps fielding the same volume of requests, except now every one fails slowly instead of quickly, tying up resources on both sides waiting out timeouts that were unlikely to succeed"
      - "Retrying always fixes the problem immediately with no downside"
      - "Retries are impossible to implement in any programming language"
      - "It has no effect on the downstream service at all, only on the caller"
    correct: 0
    explanation: "This is exactly the mechanism behind a cascading failure -- one overloaded service's slowness propagates outward as callers keep piling on requests it's already failing to handle."
  - question: "What are the three states a circuit breaker moves through?"
    options:
      - "Closed (calls pass through normally), open (calls fail immediately without attempting the network call), and half-open (a small number of trial calls test recovery)"
      - "On, off, and reset -- with no other behavior"
      - "Only two states: working and broken"
      - "Fast, medium, and slow, based on response time alone"
    correct: 0
    explanation: "After failures cross a threshold, the breaker opens (failing fast during a cooldown), then moves to half-open to test with trial calls before deciding whether to close again or reopen."
  - question: "How is a circuit breaker different from a simple retry policy?"
    options:
      - "A circuit breaker recognizes a sustained pattern of failures and changes behavior at the system level (stopping calls entirely for a period), while a retry policy just tries the same single failing call again"
      - "They are exactly the same thing with different names"
      - "A circuit breaker only works for successful calls, never failures"
      - "Retry policies always take longer to implement than circuit breakers"
    correct: 0
    explanation: "They're complementary tools -- retry handles a single transient failure, while a circuit breaker handles a sustained pattern by deliberately failing fast until there's evidence of actual recovery."
