comprehension_check:
  - question: "Why is a database shared across multiple microservices considered a hidden form of coupling?"
    options:
      - "A schema change in one service's tables requires checking every other service that queries the same tables directly, reintroducing deployment coupling through the database layer"
      - "Shared databases have no downsides and are the recommended standard"
      - "It makes every query run measurably slower with no other effect"
      - "It only affects services written in different programming languages"
    correct: 0
    explanation: "This silently recreates the monolith's coupling -- services can no longer be deployed independently if a database schema change might break another service reading the same tables."
  - question: "What does 'database-per-service' require when one service needs data that conceptually belongs to another?"
    options:
      - "It must ask through the owning service's own API (or react to its published events) -- never query that service's database tables directly"
      - "It must be granted direct read access to every other service's database"
      - "The two services must be merged back into one"
      - "Database-per-service means no service can ever access another service's data in any way"
    correct: 0
    explanation: "This preserves real independent deployability, at the cost of turning what could have been a single JOIN into API calls or a maintained read model aggregated at the application layer."
