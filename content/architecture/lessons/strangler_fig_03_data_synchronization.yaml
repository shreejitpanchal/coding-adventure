requires_code: false
concept_tags: [strangler_fig, data_synchronization, change_data_capture, legacy_migration]
comprehension_check:
  - question: "When does data synchronization become a real problem during a Strangler Fig migration?"
    options:
      - "Once a migrated service gets its own database, since the same logical data can now exist in two places that must be kept from drifting apart"
      - "It's a problem from the very first day of any migration, even before any service has its own database"
      - "It's never a real problem in any Strangler Fig migration"
      - "Only once the legacy system has been fully decommissioned"
    correct: 0
    explanation: "As long as a route still reads/writes through the legacy database, there's still only one copy of the data -- the problem appears specifically once a service gets its own separate store."
  - question: "Why is change data capture (CDC) generally more robust than application-level dual writes?"
    options:
      - "It reads from the database's own committed transaction log rather than relying on application code to remember to perform two separate writes, so it can't silently miss a write"
      - "CDC requires no infrastructure at all, unlike dual writes"
      - "CDC and dual writes provide identical guarantees with no tradeoff"
      - "CDC only works if there is exactly one database involved"
    correct: 0
    explanation: "A dual write can fail on the second write after the first succeeds, leaving the stores silently disagreeing -- CDC instead streams from the database's actual log, which already reflects what was truly committed."
