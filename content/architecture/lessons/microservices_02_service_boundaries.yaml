id: microservices_02
title: "Service Boundaries: By Bounded Context, Not by Layer"
language: architecture
level: 7
objective: "Understand why splitting microservices along technical layers (a 'database service', a 'UI service') is a common mistake, compared to splitting by business capability."
explanation: |
  A tempting first instinct when splitting a monolith is to split along
  *technical* layers -- a `DatabaseService` that owns all data access, a
  `BusinessLogicService` that owns rules, a `UIService` that renders
  pages. This looks organized, but it actually recreates the monolith's
  coupling in a worse form: implementing one business feature (say,
  "cancel an order") now requires coordinated changes across all three
  services, each change requiring its own deploy, and every request
  fans out across a chain of network calls just to do one cohesive
  piece of business logic. Splitting by layer optimizes for "what kind
  of code is this" rather than "what business capability does this
  serve," which is exactly backwards for the independence microservices
  are supposed to buy.

  The better boundary follows Domain-Driven Design's bounded contexts
  (see this track's own Domain-Driven Design category): each service owns a complete
  vertical slice of one business capability -- its own data, its own
  business rules, its own API -- rather than one horizontal layer
  shared across every capability. An `OrderService` owns everything
  order-related end to end; a `ShippingService` owns everything
  shipping-related end to end. "Cancel an order" now touches
  `OrderService` alone (plus whatever events it publishes for others to
  react to), because the boundary was drawn around a real business
  capability, not an implementation-technology layer.
example_code: |
  # The trap: split by technical layer -- one business feature spans all three.
  class DatabaseService: ...       # owns ALL data access, for every feature
  class BusinessLogicService: ...  # owns ALL business rules, for every feature
  class UIService: ...             # owns ALL rendering, for every feature
  # "Cancel an order" touches all three services, three separate deploys.

  # The fix: split by business capability -- each service is a full vertical slice.
  class OrderService:              # owns order data, order rules, order API -- end to end
      def cancel_order(self, order_id):
          order = self.db.get(order_id)
          order.cancel()                        # business rule lives HERE, with its own data
          self.db.save(order)
          event_bus.publish("OrderCancelled", order)

  class ShippingService:           # owns shipping data, shipping rules, shipping API
      @event_bus.subscribe("OrderCancelled")
      def on_order_cancelled(self, order):
          self.cancel_pending_shipment(order.id)
