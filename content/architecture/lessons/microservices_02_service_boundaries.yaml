comprehension_check:
  - question: "What's the problem with splitting microservices along technical layers (a DatabaseService, a BusinessLogicService, a UIService)?"
    options:
      - "Implementing one business feature now requires coordinated changes across all the layer-based services, recreating the monolith's coupling in a worse, more network-heavy form"
      - "There is no problem -- this is the recommended way to split microservices"
      - "Technical-layer splitting eliminates the need for a database entirely"
      - "It's impossible to implement a UI layer as a separate service"
    correct: 0
    explanation: "Splitting by layer optimizes for 'what kind of code is this' instead of 'what business capability does this serve' -- exactly backwards for the independence microservices should provide."
  - question: "What does splitting services by bounded context (business capability) look like instead?"
    options:
      - "Each service owns a complete vertical slice of one business capability end to end -- its own data, its own rules, its own API -- rather than one horizontal layer shared across every capability"
      - "Every service must share the exact same database schema"
      - "It requires eliminating all business logic from every service"
      - "It's identical to splitting by technical layer, just renamed"
    correct: 0
    explanation: "An OrderService owning everything order-related end to end means 'cancel an order' touches one service, not a coordinated chain across three layer-based services."
