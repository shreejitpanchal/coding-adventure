comprehension_check:
  - question: "Why does a single-service, single-client-type system get nothing from adding an API Gateway?"
    options:
      - "There's no internal topology to hide, no cross-cutting concern duplicated across multiple services, and no aggregation to perform -- all the problems a gateway solves require multiple services to exist in the first place"
      - "API Gateways only work with more than one client type, by technical requirement"
      - "A gateway always makes a single-service system faster with no downside"
      - "Single-service systems are incapable of handling any network requests"
    correct: 0
    explanation: "The client could call the one backend service directly and lose nothing -- there's no internal topology being hidden, because there's only one thing back there."
  - question: "According to this lesson, at what point does an API Gateway actually earn its cost?"
    options:
      - "Once a client would otherwise need direct knowledge of, and direct calls to, multiple independently-evolving backend services"
      - "As soon as a system has any backend service at all, regardless of how many"
      - "Only once a system has been running in production for over a year"
      - "Gateways never earn their cost under any real circumstances"
    correct: 0
    explanation: "Before that point, a gateway solves a coordination problem that hasn't actually arisen yet -- the same 'don't reach for this before the need is real' lesson this track applies elsewhere."
