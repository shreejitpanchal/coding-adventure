comprehension_check:
  - question: "What's the key signal that CQRS is being applied prematurely to an application?"
    options:
      - "The read and write shapes haven't actually diverged -- the same simple model would serve both jobs well without contorting itself"
      - "The application has more than one screen"
      - "CQRS is always the correct default choice for every application"
      - "The application has never had a single bug reported"
    correct: 0
    explanation: "Splitting into two models when one would already serve both jobs well adds real cost (two schemas, synchronization, eventual-consistency bugs) with no corresponding benefit."
  - question: "What kind of concrete pressure makes CQRS actually earn its cost?"
    options:
      - "Read volume that swamps the write model, or reporting/dashboard views that would require increasingly convoluted joins against the write schema"
      - "CQRS should be adopted before any pressure exists, purely as a precaution"
      - "It earns its cost only for applications with zero read operations"
      - "There is no scenario where CQRS is ever justified"
    correct: 0
    explanation: "Reaching for CQRS before that pressure exists means optimizing for a problem the application doesn't have yet, at the cost of real complexity it does have right now."
