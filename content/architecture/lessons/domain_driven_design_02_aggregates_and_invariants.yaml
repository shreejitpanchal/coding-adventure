comprehension_check:
  - question: "What problem does the aggregate pattern solve?"
    options:
      - "It protects invariants that span multiple related objects (like an order's total matching its line items) by funneling every change through a single aggregate root"
      - "It makes every object in the domain model directly modifiable from anywhere"
      - "It eliminates the need for any business rules at all"
      - "It merges every bounded context into a single shared aggregate"
    correct: 0
    explanation: "If code could modify a LineItem directly without going through Order, nothing would enforce rules like 'the total must equal the sum of the line items' -- the aggregate root is the one place those rules are enforced every time."
  - question: "Why should an aggregate boundary be kept as small as the actual invariant requires, rather than drawn around 'everything that seems related'?"
    options:
      - "A boundary drawn too widely (e.g. merging Order and Customer with no invariant requiring it) creates needless contention and complexity with no correctness benefit"
      - "Larger aggregates always perform better than smaller ones"
      - "Aggregates must always contain every object in the entire domain model"
      - "There is no such thing as too large an aggregate"
    correct: 0
    explanation: "A smaller aggregate means more objects can be modified concurrently without contention -- the boundary should match exactly what must be transactionally consistent at all times, nothing broader."
