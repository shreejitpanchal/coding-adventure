comprehension_check:
  - question: "Why do sagas give up the isolation guarantee that a normal ACID transaction provides?"
    options:
      - "The compensating-action model requires intermediate state to be reachable, since a later step's compensation must reference and undo the concrete result of an earlier step"
      - "Sagas are not allowed to modify any data at all"
      - "Isolation is impossible in any distributed system for any reason"
      - "Sagas run faster than transactions specifically because they skip isolation checks"
    correct: 0
    explanation: "This is a deliberate tradeoff, not an oversight -- the saga model needs visible intermediate state to compensate correctly later."
  - question: "What problem does a semantic lock solve?"
    options:
      - "It makes a step's pending, not-yet-final state explicitly visible (e.g. a distinct status field) instead of silently mutating a field in a way indistinguishable from a permanent committed change"
      - "It physically locks a database row the same way a real row-level lock does"
      - "It prevents any other process from ever reading the record again"
      - "It removes the need for compensating actions entirely"
    correct: 0
    explanation: "A semantic lock is a convention, not a database-enforced lock -- it lets other participants see that a record is mid-flight and treat it accordingly, and lets a compensation revert cleanly and unambiguously."
