id: event_driven_architecture_02
title: "Notification Events vs. Event-Carried State Transfer"
language: architecture
level: 2
objective: "Understand the difference between a thin notification event and one that carries a full copy of the changed data, and the tradeoff each makes."
explanation: |
  Not every event needs to carry the same amount of data, and the choice
  has real consequences. A *notification event* -- `{"event":
  "OrderUpdated", "order_id": 4521}` -- carries just enough information
  to say "something changed, go look it up yourself." The subscriber
  has to call back to `OrderService` to fetch the actual current state,
  which keeps the event tiny and guarantees the subscriber always sees
  the *current* data, but couples every subscriber to `OrderService`'s
  availability at the moment they process the event -- if it's down,
  every subscriber is stuck too.

  *Event-carried state transfer* embeds the actual data in the event
  itself -- `{"event": "OrderUpdated", "order_id": 4521, "status":
  "shipped", "items": [...]}` -- so subscribers never need to call back
  at all. This removes the runtime coupling to the source service
  entirely, at the cost of a larger event payload and a new problem:
  the subscriber's copy is a *snapshot at publish time*, which can
  silently drift from the source's current truth if a later update
  event is missed or processed out of order. Choosing between the two
  is a genuine tradeoff between "small events plus a live dependency on
  the source" and "self-contained events plus the risk of a stale
  copy" -- neither one is universally correct.
example_code: |
  # Notification event: tiny, but subscribers must call back for data.
  {"event": "OrderUpdated", "order_id": 4521}
  # Subscriber: on_order_updated(event) -> order_service.get(event["order_id"])

  # Event-carried state transfer: self-contained, no callback needed.
  {
    "event": "OrderUpdated", "order_id": 4521,
    "status": "shipped", "items": [{"sku": "A1", "qty": 2}]
  }
  # Subscriber: on_order_updated(event) -> use event["status"] directly
