achievement: null
requires_code: false
concept_tags: [event_driven_architecture, event_carried_state_transfer, notification_event]
comprehension_check:
  - question: "What does a subscriber have to do after receiving a thin 'notification' event?"
    options:
      - "Call back to the source service to fetch the actual current data, since the event itself only signals that something changed"
      - "Nothing -- notification events already contain all the data needed"
      - "Notification events cannot have subscribers at all"
      - "Discard the event immediately without any further action"
    correct: 0
    explanation: "This callback requirement couples every subscriber's processing to the source service's availability at that exact moment."
  - question: "What risk does event-carried state transfer introduce that a notification event avoids?"
    options:
      - "The embedded data is a snapshot at publish time, which can drift from the source's current truth if a later event is missed or processed out of order"
      - "It has no risk at all -- it's strictly better in every situation"
      - "It requires the subscriber to always be online"
      - "It makes the event payload smaller than a notification event"
    correct: 0
    explanation: "Self-contained events remove the live dependency on the source service, but introduce the possibility of a stale copy if events are missed or reordered."
