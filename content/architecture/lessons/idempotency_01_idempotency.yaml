comprehension_check:
  - question: "Why is a network call's timeout genuinely ambiguous in a way a local function call's failure isn't?"
    options:
      - "A timeout can mean the operation never happened, OR that it succeeded and only the confirmation response got lost -- the caller can't tell which"
      - "Network calls never time out, so this ambiguity doesn't actually exist"
      - "A timeout always means the operation definitely failed, with no ambiguity"
      - "Local function calls have the exact same ambiguity as network calls"
    correct: 0
    explanation: "This ambiguity is exactly why retrying is usually the correct default response to a network failure -- and exactly why the retried operation needs to be safe to run more than once."
  - question: "What does it mean for an operation to be idempotent?"
    options:
      - "Performing it multiple times has the same effect as performing it once"
      - "It always executes instantly with no delay"
      - "It can never fail under any circumstances"
      - "It only works correctly the very first time it's called, never after"
    correct: 0
    explanation: "SET balance = 100 is naturally idempotent (same result no matter how many times it runs); balance += 10 is not (each run adds 10 more)."
  - question: "How does an idempotency key make a 'charge this card' request safe to retry?"
    options:
      - "The server records the result against a unique key on the first attempt; any later attempt with the SAME key returns the recorded result instead of charging the card again"
      - "It encrypts the card number so it can never be charged twice by definition"
      - "It makes the network connection itself immune to ever timing out"
      - "It requires the customer to manually approve every single retry"
    correct: 0
    explanation: "The caller generates one idempotency key per logical request and reuses it on every retry -- the server checks for that key first, so a retried request returns the already-recorded result rather than re-executing the charge."
