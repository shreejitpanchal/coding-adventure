comprehension_check:
  - question: "In an orchestrated saga, where does the overall sequence of steps and compensations live?"
    options:
      - "In one central orchestrator component -- the entire flow is readable in a single place"
      - "It doesn't exist as a concept in orchestrated sagas"
      - "Spread invisibly across every participating service with no coordinator"
      - "It's stored only in the database schema, never in code"
    correct: 0
    explanation: "Reading the orchestrator is reading the whole saga, start to finish, success or failure -- that centralization is its main debuggability advantage."
  - question: "What is the main cost of a choreographed saga compared to an orchestrated one?"
    options:
      - "The overall flow is no longer visible in any single place -- understanding it means tracing event subscriptions across every service involved"
      - "Choreographed sagas cannot use compensating actions at all"
      - "Choreography requires more central coordination than orchestration"
      - "Choreographed sagas are always slower to execute"
    correct: 0
    explanation: "Choreography keeps services maximally decoupled, but that decoupling is exactly what makes the overall sequence hard to see in any one place as more steps get added."
