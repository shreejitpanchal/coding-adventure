comprehension_check:
  - question: "What happens when a circuit breaker's failure threshold is set too low?"
    options:
      - "It triggers on ordinary, expected transient noise (a single slow response or blip), failing fast on a dependency that was never actually struggling -- a false trip that hurts availability"
      - "It has no negative effect -- a lower threshold is always safer"
      - "It makes the downstream service permanently unavailable"
      - "A low threshold only affects services written in the same language as the caller"
    correct: 0
    explanation: "The breaker can't distinguish ordinary noise from a genuine sustained problem, so it cuts off real available capacity unnecessarily."
  - question: "How should the right failure threshold and cooldown period actually be chosen, according to this lesson?"
    options:
      - "Based on the call's actual observed baseline failure rate under normal conditions and how long the downstream service realistically takes to recover -- measured and tuned, not a generic default left alone forever"
      - "Always use the same fixed numbers for every dependency in every system"
      - "Threshold and cooldown values have no real effect on system behavior"
      - "The lowest possible threshold and the longest possible cooldown are always correct"
    correct: 0
    explanation: "There's no universal correct number -- it depends on the specific dependency's real behavior, and should be revisited as observed traffic patterns change."
