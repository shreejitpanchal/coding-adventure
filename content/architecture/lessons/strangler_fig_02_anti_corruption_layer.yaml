comprehension_check:
  - question: "What is an anti-corruption layer's job during a Strangler Fig migration?"
    options:
      - "It translates between the legacy system's data model and the new service's own clean domain model, so legacy quirks never leak directly into new code"
      - "It deletes the legacy system's data entirely before any migration begins"
      - "It makes the new service adopt the exact same schema as the legacy system"
      - "It has no purpose related to data models at all"
    correct: 0
    explanation: "Legacy quirks (odd status codes, duplicated fields from past half-migrations) get translated in exactly one place, so the rest of the new service only ever sees a clean domain model."
  - question: "Why does skipping the anti-corruption layer as a 'shortcut' cause problems later?"
    options:
      - "It creates long-term coupling to the legacy model throughout the new service, exactly the coupling the migration was supposed to eliminate"
      - "Skipping it has no downside since legacy and new schemas are always identical"
      - "It makes the new service run measurably faster with no tradeoff"
      - "It only matters for services that never talk to the legacy system"
    correct: 0
    explanation: "When the legacy system is eventually decommissioned, only the ACL would need to change if it exists -- without one, the legacy shape is scattered throughout the new service's own logic."
