comprehension_check:
  - question: "How does a CQRS read model typically stay up to date with write-side changes?"
    options:
      - "A projection subscribes to the events the write side publishes and incrementally updates the read model each time a relevant event arrives, asynchronously"
      - "The read model queries the write database live on every single request"
      - "Read models never update after they're first created"
      - "Projections have nothing to do with keeping read models current"
    correct: 0
    explanation: "Querying the write database live on every request would defeat the entire purpose of denormalizing the read model in the first place."
  - question: "Why does a projection need to be able to replay the entire historical event stream, not just react to new events?"
    options:
      - "If the read model is ever rebuilt from scratch (a schema change, a bug fix), replaying the full history is how it's reconstructed correctly and deterministically"
      - "Replaying history is never actually necessary for any reason"
      - "It's only needed if the read model has never been queried before"
      - "New events and historical events are processed by completely unrelated systems"
    correct: 0
    explanation: "This is exactly why CQRS pairs naturally with event sourcing and a replayable log-based broker -- a read model is fully rebuildable from the event log whenever needed."
