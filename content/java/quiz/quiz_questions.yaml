questions:
  - id: q01
    question: "What does == compare for objects like String in Java?"
    options:
      - "The content of the objects"
      - "Object references -- whether both variables point at the same object"
      - "The hash codes of the objects"
      - "Nothing -- == doesn't work on objects"
    correct: 1
    explanation: "== on non-primitive types compares references, not content -- .equals() is what compares content."
    concept_tags: [strings, equality, gotchas]

  - id: q02
    question: "Why can == on two boxed Integer values of 1000 return false even though they look equal?"
    options:
      - "Integer comparison is always unreliable"
      - "The autoboxing cache only covers -128 to 127 -- outside that range, boxed values are different objects"
      - "1000 is too large to store in an Integer"
      - "It never returns false for equal values"
    correct: 1
    explanation: "Java caches boxed Integers in the -128..127 range; == outside that range compares distinct objects."
    concept_tags: [autoboxing, integer_cache, gotchas]

  - id: q03
    question: "What happens to a try block's return value if finally also contains a return?"
    options:
      - "Both values are returned as an array"
      - "finally's return silently overrides try's return (or a pending exception)"
      - "It raises a compile error"
      - "try's return always wins"
    correct: 1
    explanation: "A return inside finally unconditionally overrides whatever try was about to return or throw."
    concept_tags: [exceptions, finally, gotchas]

  - id: q04
    question: "What's the default value of an unassigned slot in a String[] array?"
    options:
      - "An empty string \"\""
      - "null"
      - "0"
      - "It's a compile error to leave a slot unassigned"
    correct: 1
    explanation: "Object arrays default every slot to null -- there's no implicit empty-string default."
    concept_tags: [arrays, null, gotchas]

  - id: q05
    question: "What does marking a field static do?"
    options:
      - "Makes it read-only"
      - "Shares that single field across every instance of the class, instead of one copy per instance"
      - "Makes it thread-safe automatically"
      - "Nothing observable"
    correct: 1
    explanation: "A static field belongs to the class itself -- every instance reads and writes the same underlying value."
    concept_tags: [static_fields, classes, gotchas]

  - id: q06
    question: "Which method correctly compares the content of two String objects?"
    options:
      - "=="
      - ".equals()"
      - ".hashCode()"
      - ".toString()"
    correct: 1
    explanation: ".equals() compares content; == compares references."
    concept_tags: [strings, equality]

  - id: q07
    question: "What can a lambda expression replace?"
    options:
      - "Any class in Java"
      - "An anonymous inner class implementing a single-method (functional) interface"
      - "A for loop"
      - "An import statement"
    correct: 1
    explanation: "Lambdas are shorthand for implementing a functional interface's one abstract method."
    concept_tags: [lambdas, functional_interfaces]

  - id: q08
    question: "What does stream().filter(...).map(...) express?"
    options:
      - "Sorting a collection"
      - "A filter-then-transform pipeline, instead of a manual loop with an if and an accumulator"
      - "Removing duplicates"
      - "Converting a list to an array"
    correct: 1
    explanation: "filter() keeps matching elements, map() transforms each one -- a declarative pipeline replacing the loop."
    concept_tags: [streams, collections]

  - id: q09
    question: "What does Optional.ofNullable(x).orElse(y) do?"
    options:
      - "Always returns y"
      - "Returns x if it's non-null, otherwise returns the fallback y"
      - "Throws if x is null"
      - "Returns both x and y"
    correct: 1
    explanation: "ofNullable wraps a possibly-null value; orElse supplies the fallback used only when it's actually null."
    concept_tags: [optional, null_handling]

  - id: q10
    question: "What does a Java record generate automatically?"
    options:
      - "Only a constructor"
      - "Constructor, accessors, equals(), hashCode(), and toString()"
      - "A database schema"
      - "Only toString()"
    correct: 1
    explanation: "record derives all the common boilerplate methods from its declared fields."
    concept_tags: [records, immutability]

  - id: q11
    question: "What does try-with-resources guarantee?"
    options:
      - "The code runs faster"
      - "close() is called automatically on the resource, even if the block throws"
      - "No exceptions can occur inside the block"
      - "The resource is reused across multiple blocks"
    correct: 1
    explanation: "try-with-resources calls close() when the block exits, exception or not -- unlike a manual close() that's easy to skip on an error path."
    concept_tags: [try_with_resources, resource_management]

  - id: q12
    question: "What interface must a class implement to be used in try-with-resources?"
    options:
      - "Runnable"
      - "AutoCloseable"
      - "Comparable"
      - "Serializable"
    correct: 1
    explanation: "AutoCloseable's close() method is what try-with-resources calls automatically."
    concept_tags: [try_with_resources, resource_management]

  - id: q13
    question: "Does HashMap guarantee a specific iteration order?"
    options:
      - "Yes, insertion order"
      - "No -- it's unspecified and can vary by JVM/internal layout"
      - "Yes, always sorted by key"
      - "Yes, reverse insertion order"
    correct: 1
    explanation: "HashMap makes no ordering promise -- code needing a reproducible order must sort explicitly (or use LinkedHashMap/TreeMap)."
    concept_tags: [collections, hashmap, gotchas]

  - id: q14
    question: "Why is ArrayDeque preferred over ArrayList for queue operations?"
    options:
      - "ArrayDeque uses less memory always"
      - "It supports O(1) add/remove at both ends, vs O(n) for ArrayList.remove(0)"
      - "ArrayList can't hold more than 100 elements"
      - "There's no real difference"
    correct: 1
    explanation: "Removing from the front of an ArrayList shifts every remaining element; ArrayDeque avoids that entirely."
    concept_tags: [collections, performance]

  - id: q15
    question: "What does Comparator.comparingInt(Person::age) build?"
    options:
      - "A list of ages"
      - "A comparator that sorts by the value the given key-extractor returns"
      - "A new Person object"
      - "A boolean"
    correct: 1
    explanation: "comparingInt derives a full Comparator from a key-extractor method reference, avoiding a hand-written compare()."
    concept_tags: [collections, comparator, sorting]

  - id: q16
    question: "What's the benefit of TreeMap over HashMap when keys need to stay sorted?"
    options:
      - "TreeMap is always faster"
      - "TreeMap's keys stay sorted automatically -- no need to re-sort a copy every time"
      - "TreeMap uses less memory"
      - "There's no benefit"
    correct: 1
    explanation: "TreeMap is backed by a sorted tree structure, keeping keys in order at all times."
    concept_tags: [collections, treemap, sorting]

  - id: q17
    question: "What does PriorityQueue.peek() return?"
    options:
      - "A random element"
      - "The smallest element (for a min-heap), without removing it"
      - "The most recently added element"
      - "null, always"
    correct: 1
    explanation: "PriorityQueue is a heap; peek() reads the current minimum without dequeuing it."
    concept_tags: [collections, priority_queue, algorithms]

  - id: q18
    question: "What's the time complexity of ArrayList.remove(0)?"
    options:
      - "O(1)"
      - "O(n) -- every remaining element shifts left one slot"
      - "O(log n)"
      - "O(n^2)"
    correct: 1
    explanation: "Removing from the front requires shifting the rest of the backing array."
    concept_tags: [collections, performance]

  - id: q19
    question: "Why is StringBuilder preferred over += in a string-building loop?"
    options:
      - "It's required by the compiler"
      - "String is immutable, so += allocates a brand-new String every iteration; StringBuilder mutates a buffer in place"
      - "StringBuilder uses less memory for a single string"
      - "There's no real difference"
    correct: 1
    explanation: "Repeated String concatenation is O(n^2) overall due to immutability; StringBuilder.append() is O(n) total."
    concept_tags: [strings, stringbuilder, performance]

  - id: q20
    question: "What does String.format's %d placeholder expect?"
    options:
      - "A String value"
      - "An integer value"
      - "A double value"
      - "A boolean value"
    correct: 1
    explanation: "%d formats an integer; %s formats a string, %f a floating-point value."
    concept_tags: [strings, formatting]

  - id: q21
    question: "What does java.util.Objects.equals(a, b) do differently from a.equals(b)?"
    options:
      - "Nothing, they're identical"
      - "It's null-safe -- it doesn't throw if a is null"
      - "It's faster"
      - "It only works on numbers"
    correct: 1
    explanation: "Objects.equals handles null on either side; a.equals(b) throws NullPointerException if a is null."
    concept_tags: [null_handling, objects_utility, gotchas]

  - id: q22
    question: "What does Duration.ofMillis(x).toMinutes() do?"
    options:
      - "Converts minutes to milliseconds"
      - "Converts an elapsed number of milliseconds into whole minutes"
      - "Returns the current time"
      - "Throws an exception"
    correct: 1
    explanation: "Duration wraps an elapsed time amount and exposes direct unit conversions like toMinutes()."
    concept_tags: [java_time, duration]

  - id: q23
    question: "What does \"12a34\".matches(\"\\\\d+\") return?"
    options:
      - "true"
      - "false, since 'a' isn't a digit and \\d+ must match the whole string"
      - "It throws an exception"
      - "It returns the matched substring"
    correct: 1
    explanation: "matches() requires the entire string to match the pattern; the letter 'a' breaks that."
    concept_tags: [regex, strings]

  - id: q24
    question: "Why is manual character-range validation (like checking c < '0') risky compared to a regex?"
    options:
      - "It's not risky at all"
      - "It's easy to get boundary conditions wrong, missing letters or symbols that should be rejected"
      - "Regex is always faster"
      - "Character comparisons don't work in Java"
    correct: 1
    explanation: "A boundary check like c < '0' doesn't correctly reject every non-digit character -- a regex like \\d+ expresses the intent directly and correctly."
    concept_tags: [regex, strings, gotchas]

  - id: q25
    question: "Why isn't counter++ safe across threads without synchronization?"
    options:
      - "It's actually always safe"
      - "It's a non-atomic read-modify-write -- two threads can interleave between the steps"
      - "++ doesn't work on shared variables"
      - "It only works on final variables"
    correct: 1
    explanation: "counter++ is read, then increment, then write as separate steps -- concurrent threads can lose updates between them."
    concept_tags: [threading, synchronized, race_conditions]

  - id: q26
    question: "What does AtomicInteger.incrementAndGet() provide?"
    options:
      - "A random number generator"
      - "A lock-free atomic increment, safe across threads without explicit synchronization"
      - "A way to decrement instead"
      - "Nothing different from a regular int++"
    correct: 1
    explanation: "AtomicInteger uses hardware compare-and-swap to make increments atomic without needing a lock."
    concept_tags: [concurrency, atomic, threading]

  - id: q27
    question: "What does ExecutorService let you avoid managing manually?"
    options:
      - "Variable declarations"
      - "Individual Thread creation, starting, and joining"
      - "Exception handling"
      - "Memory allocation"
    correct: 1
    explanation: "ExecutorService manages a pool of worker threads -- submit() hands off work instead of manually juggling Thread objects."
    concept_tags: [concurrency, executor_service, threading]

  - id: q28
    question: "What does CompletableFuture.supplyAsync() do?"
    options:
      - "Runs a computation synchronously on the current thread"
      - "Runs a computation on a background thread and returns a future for its eventual result"
      - "Blocks until the JVM shuts down"
      - "Only works with void methods"
    correct: 1
    explanation: "supplyAsync schedules work on a background thread (the common ForkJoinPool by default) and returns immediately with a handle to the result."
    concept_tags: [concurrency, completable_future, async]

  - id: q29
    question: "Does ExecutorService.shutdown() wait for already-submitted tasks to finish?"
    options:
      - "Yes, it blocks until every task completes"
      - "No -- it only stops new submissions and returns immediately"
      - "It cancels all pending tasks immediately"
      - "It only works after all tasks are done"
    correct: 1
    explanation: "shutdown() is non-blocking; awaitTermination() is what actually waits for submitted tasks to finish."
    concept_tags: [concurrency, executor_service, threading]

  - id: q30
    question: "What does awaitTermination() do after shutdown()?"
    options:
      - "Cancels all remaining tasks"
      - "Blocks until submitted tasks finish, or a timeout elapses"
      - "Restarts the thread pool"
      - "Nothing -- it's optional and has no effect"
    correct: 1
    explanation: "awaitTermination() is the blocking wait needed before it's safe to read state that submitted tasks mutate."
    concept_tags: [concurrency, executor_service, threading]

  - id: q31
    question: "What happens if a for loop condition uses <= instead of < against arr.length?"
    options:
      - "Nothing, both work identically"
      - "The loop reads one index past the last valid one, throwing ArrayIndexOutOfBoundsException"
      - "It causes an infinite loop"
      - "It's a compile error"
    correct: 1
    explanation: "Valid indices run from 0 to length-1 -- <= lets i reach length itself, one past the end."
    concept_tags: [arrays, off_by_one, gotchas]

  - id: q32
    question: "What happens without a break in a switch case?"
    options:
      - "The switch statement raises a compile error"
      - "Execution falls through into the next case (and beyond), each one overwriting the last"
      - "Only the first case ever runs"
      - "Nothing -- break is purely optional stylistic sugar"
    correct: 1
    explanation: "A traditional switch doesn't stop at the matching case automatically -- every case needs its own break unless fall-through is intentional."
    concept_tags: [switch, fallthrough, gotchas]

  - id: q33
    question: "Why does modifying a list during a for-each loop throw ConcurrentModificationException?"
    options:
      - "Lists can never be modified in Java"
      - "The for-each loop's internal iterator detects the structural change and refuses to continue silently"
      - "It's a random, unpredictable error"
      - "It only happens with more than 100 elements"
    correct: 1
    explanation: "A for-each loop uses an Iterator that fails fast on structural modification rather than producing unreliable results."
    concept_tags: [collections, iteration, gotchas]

  - id: q34
    question: "What happens when an int computation exceeds Integer.MAX_VALUE in Java?"
    options:
      - "It throws an ArithmeticException"
      - "It silently wraps around to a negative number, with no error at all"
      - "The JVM crashes"
      - "It's automatically promoted to long"
    correct: 1
    explanation: "Java's int arithmetic never checks for overflow by default -- it wraps around silently."
    concept_tags: [integers, overflow, gotchas]

  - id: q35
    question: "What's required alongside overriding equals() for correct HashSet/HashMap behavior?"
    options:
      - "Nothing else is needed"
      - "A matching hashCode() override, so equal objects produce the same hash code"
      - "Making the class final"
      - "Implementing Comparable"
    correct: 1
    explanation: "HashSet/HashMap use hashCode() to find a bucket before ever calling equals() -- without a consistent hashCode(), equal objects can land in different buckets."
    concept_tags: [equals_hashcode, hashset, gotchas]

  - id: q36
    question: "Why give a thread an explicit name instead of relying on the default Thread-N?"
    options:
      - "It runs faster"
      - "It makes logs and debuggers able to identify which thread did what"
      - "It's required by the compiler"
      - "It changes the thread's scheduling priority"
    correct: 1
    explanation: "An unnamed thread is nearly impossible to trace through logs -- naming by the work it does pays off when diagnosing issues."
    concept_tags: [threading, debugging]

  - id: q37
    question: "What does t.setDaemon(true) do?"
    options:
      - "Makes the thread run faster"
      - "Lets the JVM exit without waiting for that thread to finish"
      - "Gives the thread elevated permissions"
      - "Prevents the thread from throwing exceptions"
    correct: 1
    explanation: "A daemon thread is abandoned automatically at JVM exit instead of keeping the whole process alive."
    concept_tags: [threading, daemon_threads]

  - id: q38
    question: "Is Thread.setPriority() a guarantee of execution order?"
    options:
      - "Yes, higher priority always runs first"
      - "No -- it's only a scheduling hint the OS is free to mostly ignore"
      - "It guarantees thread-safety"
      - "It has no effect at all, ever"
    correct: 1
    explanation: "Priority nudges the scheduler but isn't a portable guarantee across platforms."
    concept_tags: [threading, thread_priority]

  - id: q39
    question: "Why is BlockingQueue.take() safer than ArrayDeque.poll() for a producer/consumer handoff?"
    options:
      - "take() is faster in every case"
      - "take() blocks until an item is actually available; poll() returns immediately, often null, racing the producer"
      - "ArrayDeque can't hold Integers"
      - "There's no real difference"
    correct: 1
    explanation: "poll() on an empty structure returns immediately (often null) instead of waiting -- take() blocks until there's really something there."
    concept_tags: [threading, queue, producer_consumer]

  - id: q40
    question: "What's the correct way to stop a thread cooperatively in Java?"
    options:
      - "Call the deprecated Thread.stop()"
      - "Have the thread check Thread.currentThread().isInterrupted() and exit cleanly after another thread calls interrupt()"
      - "Kill the JVM process"
      - "Threads can't be stopped once started"
    correct: 1
    explanation: "Thread.stop() is deprecated and unsafe -- cooperative interruption-checking is the correct pattern."
    concept_tags: [threading, interruption]

  - id: q41
    question: "What does thenApply do to a CompletableFuture?"
    options:
      - "Blocks until the future completes"
      - "Chains a transformation onto the future's eventual result, returning a new future"
      - "Cancels the future"
      - "Runs the future synchronously"
    correct: 1
    explanation: "thenApply(fn) attaches fn to run as part of the async pipeline once the original future completes."
    concept_tags: [concurrency, completable_future, async]

  - id: q42
    question: "What does thenCombine do?"
    options:
      - "Cancels two futures"
      - "Waits for two independent futures and combines their results with a given function"
      - "Merges two threads into one"
      - "Restarts a failed future"
    correct: 1
    explanation: "thenCombine(other, fn) expresses \"once both are ready, combine them\" without blocking on each sequentially."
    concept_tags: [concurrency, completable_future, async]

  - id: q43
    question: "What does exceptionally do on a CompletableFuture?"
    options:
      - "Prevents any exception from ever being thrown"
      - "Supplies a fallback value used only if the future completed with an exception"
      - "Logs the exception and re-throws it"
      - "Retries the computation automatically"
    correct: 1
    explanation: "exceptionally(fn) recovers a failed future with a fallback value instead of letting join() re-throw."
    concept_tags: [concurrency, completable_future, exceptions]

  - id: q44
    question: "Why pass a custom ExecutorService to supplyAsync instead of using the default?"
    options:
      - "supplyAsync requires it"
      - "The default uses ForkJoinPool.commonPool(), shared by every parallel stream and default-pool future in the JVM -- dedicated work may need its own pool"
      - "It makes the code shorter"
      - "There's no functional difference"
    correct: 1
    explanation: "The common pool is shared JVM-wide; an explicit executor gives dedicated capacity that doesn't compete with unrelated work."
    concept_tags: [concurrency, completable_future, executor_service]

  - id: q45
    question: "What's the benefit of virtual threads over a small fixed platform-thread pool?"
    options:
      - "Virtual threads run computations faster"
      - "Each submitted task gets its own lightweight thread instead of contending for a scarce few real OS threads"
      - "Virtual threads replace the need for any concurrency at all"
      - "There's no benefit, they're identical"
    correct: 1
    explanation: "A fixed pool of platform threads is genuinely scarce (each maps to a real OS thread); virtual threads can be created by the thousands."
    concept_tags: [concurrency, virtual_threads]

  - id: q46
    question: "When can a lambda be replaced by a method reference?"
    options:
      - "Never, they're incompatible"
      - "When the lambda's whole body is just forwarding its argument to one existing method"
      - "Only for static methods"
      - "Only inside streams"
    correct: 1
    explanation: "s -> s.toUpperCase() and String::toUpperCase are the same thing -- a method reference is shorthand for that exact pattern."
    concept_tags: [functional_programming, method_references]

  - id: q47
    question: "What does Stream.reduce(identity, accumulator) do?"
    options:
      - "Filters the stream"
      - "Folds the whole stream into one accumulated value"
      - "Sorts the stream"
      - "Removes duplicates"
    correct: 1
    explanation: "reduce is the general-purpose fold operation, replacing a manual accumulator loop."
    concept_tags: [functional_programming, streams, reduce]

  - id: q48
    question: "Why does calling .add() on a List.of(...) result throw UnsupportedOperationException?"
    options:
      - "List.of() has a bug"
      - "List.of() returns a genuinely immutable list -- every mutating call is unconditionally rejected"
      - "You can only add Strings"
      - "It only throws if the list is empty"
    correct: 1
    explanation: "Unlike a conventionally-treated-as-immutable list, List.of()'s result truly cannot be mutated -- wrap it in a real ArrayList first if mutation is needed."
    concept_tags: [functional_programming, immutability, gotchas]

  - id: q49
    question: "What does f.andThen(g) build?"
    options:
      - "g applied first, then f"
      - "A new function equivalent to applying f first, then passing its result to g"
      - "A function that runs f and g in parallel"
      - "A syntax error -- andThen doesn't exist"
    correct: 1
    explanation: "andThen composes two functions in the order they're chained: f, then g."
    concept_tags: [functional_programming, function_composition]

  - id: q50
    question: "What's Java's equivalent of Python's @lru_cache decorator?"
    options:
      - "Java has an identical built-in @Memoize annotation"
      - "There isn't one -- memoization has to be hand-rolled, typically with a Map cache checked before recursing"
      - "final fields automatically memoize"
      - "Streams memoize automatically"
    correct: 1
    explanation: "Java has no built-in memoization decorator -- the standard fix is a manual cache (e.g. HashMap<Integer, Long>)."
    concept_tags: [recursion, memoization]

  - id: q51
    question: "Why does deep recursion cause a StackOverflowError in Java?"
    options:
      - "Java doesn't support recursion"
      - "Java has no tail-call optimization, and the call stack is finite -- one call per unit of work exhausts it on large inputs"
      - "It only happens with infinite loops, not recursion"
      - "StackOverflowError never actually happens in Java"
    correct: 1
    explanation: "Each recursive call uses a real stack frame; without tail-call optimization, deep enough recursion exhausts the stack."
    concept_tags: [recursion, recursion_limit]

  - id: q52
    question: "What is mutual recursion?"
    options:
      - "A method calling itself twice"
      - "Two or more methods that call each other instead of themselves directly"
      - "A method with two base cases"
      - "Recursion inside a lambda"
    correct: 1
    explanation: "isEven calling isOdd, which calls isEven, is the classic example of mutual recursion."
    concept_tags: [recursion, mutual_recursion]

  - id: q53
    question: "How do you correctly sum every value in a binary tree recursively?"
    options:
      - "Just return the root's own value"
      - "For a null node return 0; otherwise return the node's value plus the recursive sums of both children"
      - "Trees can't be summed recursively"
      - "Sum only the left subtree"
    correct: 1
    explanation: "The null-node base case (0) plus recursing into both children is what correctly totals every node in the tree."
    concept_tags: [recursion, data_structures, trees]

  - id: q54
    question: "Why is String.compareTo unreliable for comparing version numbers like \"10.0.0\" and \"9.0.0\"?"
    options:
      - "It isn't unreliable, it always works"
      - "It compares character by character, so \"10.0.0\" sorts before \"9.0.0\" lexicographically"
      - "compareTo doesn't work on version strings at all"
      - "It only works for single-digit versions"
    correct: 1
    explanation: "'1' sorts before '9' as a character -- correct version comparison needs to split on '.' and compare parts as integers."
    concept_tags: [dependency_management, versioning, gotchas]

  - id: q55
    question: "What does Class.forName(name) throw if the class isn't on the classpath?"
    options:
      - "NullPointerException"
      - "ClassNotFoundException"
      - "IllegalStateException"
      - "It returns null silently"
    correct: 1
    explanation: "Class.forName is the standard way to check for an optional dependency, and it throws a checked ClassNotFoundException when the class isn't present."
    concept_tags: [dependency_management, reflection, exceptions]

  - id: q56
    question: "Why should a classpath conflict resolver check versions instead of always keeping whichever was registered last?"
    options:
      - "It shouldn't -- last-write-wins is always correct"
      - "The most recently registered dependency might be an older transitive one, silently downgrading a newer version already present"
      - "Checking versions is required by the JVM"
      - "There's no real risk either way"
    correct: 1
    explanation: "Blindly letting the last registration win can downgrade a legitimately newer version to an older one pulled in later by an unrelated dependency."
    concept_tags: [dependency_management, classpath, conflicts]

  - id: q57
    question: "What's the shape of a Maven coordinate string?"
    options:
      - "name@version"
      - "groupId:artifactId:version"
      - "version/artifactId/groupId"
      - "artifactId-version.jar only"
    correct: 1
    explanation: "Maven identifies a dependency as groupId:artifactId:version, e.g. com.google.guava:guava:31.0-jre."
    concept_tags: [dependency_management, maven]

  - id: q58
    question: "What does a JAR manifest's Main-Class entry specify?"
    options:
      - "The JAR's compression format"
      - "Which class's main() method the JVM should run when the JAR is executed directly"
      - "The JAR's file size"
      - "The author of the JAR"
    correct: 1
    explanation: "Main-Class in META-INF/MANIFEST.MF tells `java -jar` which class to launch."
    concept_tags: [packaging, jar, manifest]

  - id: q59
    question: "What naming convention do Java package names conventionally follow?"
    options:
      - "UPPERCASE_WITH_UNDERSCORES"
      - "Lowercase, dot-separated, reverse-domain style (e.g. com.example.app)"
      - "camelCase like method names"
      - "There's no convention at all"
    correct: 1
    explanation: "Lowercase reverse-domain notation avoids collisions and is reserved specifically to distinguish packages from class names (which use PascalCase)."
    concept_tags: [packaging, naming_conventions]

  - id: q60
    question: "In a filename like guava-31.0.jar, where's the boundary between the artifact name and the version?"
    options:
      - "The first dash in the filename"
      - "The LAST dash before the .jar extension, since the artifact name itself can contain dashes"
      - "There's no reliable way to tell"
      - "Always exactly 5 characters from the end"
    correct: 1
    explanation: "Splitting on the first dash breaks for artifact names that themselves contain dashes -- the last dash before .jar is the reliable boundary."
    concept_tags: [packaging, jar]

  - id: q61
    question: "What does a service/plugin registry (the pattern behind Java's ServiceLoader) need to actually work?"
    options:
      - "Nothing -- registration happens automatically"
      - "Something has to actually record the name-to-implementation association before it can be looked up later"
      - "A registry only works with a single implementation"
      - "It requires a database"
    correct: 1
    explanation: "A register() call that doesn't store its arguments anywhere is a no-op, however it looks -- the association has to actually be recorded."
    concept_tags: [packaging, service_registry]

  - id: q62
    question: "Why use System.getenv().getOrDefault(name, fallback) instead of System.getenv(name) directly?"
    options:
      - "They're identical"
      - "System.getenv(name) returns null if unset, which crashes downstream parsing; getOrDefault never returns null"
      - "getOrDefault is faster"
      - "System.getenv(name) doesn't exist"
    correct: 1
    explanation: "Reading a missing env var directly gives null, which crashes something like Integer.parseInt -- getOrDefault degrades gracefully to a default."
    concept_tags: [deployment, configuration, environment_variables]

  - id: q63
    question: "Why use equalsIgnoreCase instead of equals for a boolean-ish config value like \"TRUE\"?"
    options:
      - "equals() doesn't work on strings"
      - "equals() is case-sensitive, so \"TRUE\" or \"True\" would silently fail to match \"true\""
      - "equalsIgnoreCase is required by the compiler"
      - "There's no difference"
    correct: 1
    explanation: "Config values arrive in whatever casing someone wrote them -- case-sensitive comparison silently treats a valid true value as false."
    concept_tags: [deployment, configuration, gotchas]

  - id: q64
    question: "What does Runtime.getRuntime().addShutdownHook(thread) do?"
    options:
      - "Prevents the JVM from ever exiting"
      - "Registers a thread to run during JVM shutdown, including a shutdown triggered by System.exit()"
      - "Schedules the thread to run at a fixed interval"
      - "Immediately kills the current thread"
    correct: 1
    explanation: "Shutdown hooks run during JVM termination -- the standard way to guarantee cleanup code executes even after System.exit()."
    concept_tags: [deployment, shutdown_hooks, jvm]

  - id: q65
    question: "Why should a deploy step be idempotent (safe to run more than once)?"
    options:
      - "It doesn't matter, deploy steps only ever run once"
      - "Deploy pipelines get retried, so a non-idempotent step can cause duplicate work or misleading state on a re-run"
      - "Idempotency makes code run faster"
      - "It's a legal requirement"
    correct: 1
    explanation: "A retried or re-applied deploy pipeline re-runs steps -- idempotency is what keeps that safe."
    concept_tags: [deployment, idempotency]

  - id: q66
    question: "Why does real logging code configure an explicit Handler and Formatter for java.util.logging.Logger?"
    options:
      - "It's purely optional stylistic preference"
      - "The default writes verbose, timestamped records to stderr -- explicit configuration controls where and how output actually appears"
      - "Loggers don't work without one"
      - "It's required to import the logging package"
    correct: 1
    explanation: "Without configuration, java.util.logging's default format and destination (stderr) usually isn't what a deployed service wants."
    concept_tags: [observability, logging]

  - id: q67
    question: "If a Logger is set to INFO but its Handler is still set to WARNING, what happens to an INFO-level log call?"
    options:
      - "It's emitted normally"
      - "It's dropped -- a record has to clear both the logger's AND the handler's level threshold"
      - "It's automatically upgraded to WARNING"
      - "It throws an exception"
    correct: 1
    explanation: "Both the Logger's level and its Handler's level act as independent thresholds -- a record must clear both to be emitted."
    concept_tags: [observability, logging, gotchas]

  - id: q68
    question: "What does ThreadLocal provide for something like a correlation ID?"
    options:
      - "A value shared identically across every thread"
      - "A value that's implicitly available anywhere on the same thread, without passing it as an explicit parameter everywhere"
      - "Automatic encryption of the value"
      - "A way to pause the current thread"
    correct: 1
    explanation: "ThreadLocal is the mechanism real logging frameworks' MDC (Mapped Diagnostic Context) is built on for exactly this purpose."
    concept_tags: [observability, tracing, threadlocal]

  - id: q69
    question: "What's the simplest structure for a metrics counter, and what Map operation increments it cleanly?"
    options:
      - "A single boolean flag; no operation needed"
      - "A Map<String, Integer> from name to count; Map.merge(name, 1, Integer::sum) increments it, defaulting to 0 for a new key"
      - "A single global integer for everything; += 1"
      - "A List of every event that ever happened"
    correct: 1
    explanation: "merge(key, 1, Integer::sum) is a concise, correct way to express \"increment this key, starting from 0 if it's new.\""
    concept_tags: [observability, metrics]

  - id: q70
    question: "Why use System.nanoTime() instead of System.currentTimeMillis() for measuring an elapsed duration?"
    options:
      - "nanoTime() is always more precise, that's the only reason"
      - "nanoTime() is guaranteed monotonic and can't be thrown off by a wall-clock adjustment mid-measurement"
      - "currentTimeMillis() doesn't exist in modern Java"
      - "There's no real difference"
    correct: 1
    explanation: "A wall-clock change (NTP sync, manual adjustment) can make currentTimeMillis() jump mid-measurement; nanoTime() is immune to that."
    concept_tags: [observability, instrumentation]
