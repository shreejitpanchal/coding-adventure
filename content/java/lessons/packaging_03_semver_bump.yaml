id: packaging_03
title: "Bumping a Semantic Version"
language: java
level: 133
objective: "Implement a semantic-version bump: incrementing one part resets every part below it to zero."
explanation: |
  Semantic versioning (major.minor.patch) encodes meaning in each
  position -- bumping the minor version for a new backward-compatible
  feature should reset the patch number back to 0, since patch numbers
  are only meaningful relative to a specific minor release.
example_code: |
  String[] p = "1.0.0".split("\\.");
  int patch = Integer.parseInt(p[2]);
  String bumped = p[0] + "." + p[1] + "." + (patch + 1);
starter_code: |
  public class Solution {
      static String bumpVersion(String version, String part) {
          return version;
      }

      public static void main(String[] args) {
          System.out.println(bumpVersion("1.2.3", "minor"));
      }
  }
challenge: |
  bumpVersion doesn't actually bump anything -- it just returns the
  input unchanged. Fix it so a "minor" bump on "1.2.3" increments the
  minor number and resets patch to 0, producing "1.3.0".
expected_output: |
  1.3.0
hints:
  - "Split the version into major/minor/patch as integers first, using split(\"\\\\.\")."
  - "For a minor bump: major + \".\" + (minor + 1) + \".0\" -- patch resets to 0."
xp_reward: 10
achievement: null
category: packaging
category_level: 3
difficulty: core
contains_patterns:
  - "minor \\+ 1"
concept_tags: [packaging, semantic_versioning]
