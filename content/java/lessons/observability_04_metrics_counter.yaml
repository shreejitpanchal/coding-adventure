challenge: |
  increment() doesn't do anything -- metrics stays empty. Fix it to
  track a per-name counter using metrics.merge(name, 1, Integer::sum),
  so the output is {errors_total=1, requests_total=2}.
expected_output: |
  {errors_total=1, requests_total=2}
hints:
  - "metrics.merge(name, 1, Integer::sum) increments the count for name, starting from 0 if it's new."
