id: deployment_02
title: "The Feature Flag That Only Worked in Lowercase"
language: java
level: 137
objective: "Fix a boolean-flag check that's case-sensitive, so a config value like 'TRUE' is silently treated as disabled."
explanation: |
  `String.equals()` is, by design, a strict, case-sensitive comparison
  -- `"TRUE".equals("true")` is `false`, because `'T'` and `'t'` are
  genuinely different characters as far as `.equals()`'s content
  comparison is concerned, regardless of how a human reader might treat
  them as "the same word." That strictness is exactly correct for most
  string comparisons, but it's a liability for configuration values
  specifically, since environment variables and properties files are
  written by humans (or generated by varying tools) with no single
  enforced casing convention -- `"true"`, `"TRUE"`, `"True"` are all
  equally plausible spellings someone might reasonably type into a
  deployment config, and a boolean-flag check that only recognizes one
  exact casing will silently misinterpret every other spelling as
  disabled, with no error or warning anywhere to reveal the mismatch.
  `isEnabled("TRUE")` returning `false` here is exactly that failure
  mode: the flag is semantically meant to be "on," but the casing
  mismatch alone flips it to "off" from the check's point of view.

  `.equalsIgnoreCase(other)` performs the identical content comparison
  as `.equals()`, but normalizes case before comparing, so `"TRUE".
  equalsIgnoreCase("true")` correctly returns `true` regardless of
  which casing either string happens to use. For config-value parsing
  specifically, defaulting to case-insensitive comparison (rather than
  case-sensitive) is the more robust choice, since the whole point of a
  boolean config flag is to communicate a yes/no intent, and that
  intent shouldn't hinge on typographical casing a human happened to
  choose when writing the config -- the same principle that motivates
  Python's `.lower()`-before-comparing pattern for boolean environment
  variables covered elsewhere in this app, just expressed here through
  a dedicated case-insensitive comparison method instead of an explicit
  normalization step.
example_code: |
  // The trap: .equals() is strictly case-sensitive -- "TRUE" silently fails.
  static boolean isEnabledBroken(String value) {
      return value.equals("true");   // only matches the EXACT lowercase spelling
  }
  System.out.println(isEnabledBroken("TRUE"));   // false -- WRONG, meant to be enabled

  // Fix: equalsIgnoreCase compares content without regard to casing.
  public class Solution {
      static boolean isEnabled(String value) {
          return value.equalsIgnoreCase("true");
      }

      public static void main(String[] args) {
          System.out.println(isEnabled("TRUE"));   // true -- correct
          System.out.println(isEnabled("True"));    // true
          System.out.println(isEnabled("true"));    // true
          System.out.println(isEnabled("false"));   // false -- still correctly rejected
      }
  }

  boolean enabled = "TRUE".equalsIgnoreCase("true");
  System.out.println(enabled);   // true
starter_code: |
  public class Solution {
      static boolean isEnabled(String value) {
          return value.equals("true");
      }

      public static void main(String[] args) {
          System.out.println(isEnabled("TRUE"));
      }
  }
challenge: |
  isEnabled uses .equals("true"), which is case-sensitive, so "TRUE"
  doesn't match and this incorrectly prints false. Fix it using
  .equalsIgnoreCase("true") instead, so the output is true.
expected_output: |
  true
hints:
  - ".equals() is case-sensitive; .equalsIgnoreCase() is not."
