id: sync_vs_async_02
title: "Combining Two Independent Futures"
language: java
level: 112
objective: "Use thenCombine to combine two independent CompletableFutures instead of blocking on each one sequentially."
explanation: |
  `a` and `b` here are both started with `supplyAsync` and run
  genuinely concurrently, independent of each other -- neither depends
  on the other's result, so there's no actual reason to wait for them
  one after another. But `int aVal = a.join(); int bVal = b.join();`
  does exactly that structurally: it blocks on `a` completely first,
  and only *after* that block returns does it even ask about `b`. In
  practice this often doesn't cost extra wall-clock time (both `a` and
  `b` were already running concurrently in the background before either
  `join()` was called, so by the time the first `join()` unblocks, `b`
  may well already be done too) -- but the code's *structure* still
  imposes an artificial sequential dependency that isn't really there,
  and it doesn't generalize cleanly: chaining more independent futures
  this way means more sequential `join()` calls stacking up, each one
  a separate blocking point.

  `.thenCombine(other, fn)` expresses the actual relationship directly:
  "once *both* `a` and `other` have completed, combine their two
  results with `fn`." It returns a new `CompletableFuture` representing
  that combination, without the caller ever needing to `join()` on `a`
  and `b` individually -- the combination itself becomes part of the
  async pipeline, and the calling thread blocks (via `.join()` on the
  *combined* future) only once, waiting for whichever of the two
  original futures happens to finish last, rather than always waiting
  for `a` first regardless of which one is actually still running.
  `Integer::sum` here is a method reference used as the two-argument
  combining function -- any `BiFunction<T, U, R>` works, letting the
  combination logic be as simple or as involved as the actual
  relationship between the two results requires.
example_code: |
  import java.util.concurrent.CompletableFuture;

  // The trap: sequential joins impose an artificial ordering on independent work.
  CompletableFuture<Integer> aBroken = CompletableFuture.supplyAsync(() -> 3);
  CompletableFuture<Integer> bBroken = CompletableFuture.supplyAsync(() -> 4);
  int aVal = aBroken.join();          // blocks on a FIRST
  int bVal = bBroken.join();           // only then even asks about b
  System.out.println(aVal + bVal);      // 7 -- correct, but structurally sequential

  // Fix: thenCombine expresses "combine once BOTH are ready" directly.
  CompletableFuture<Integer> a = CompletableFuture.supplyAsync(() -> 3);
  CompletableFuture<Integer> b = CompletableFuture.supplyAsync(() -> 4);
  int result = a.thenCombine(b, Integer::sum).join();   // one block, waits for the SLOWER of the two
  System.out.println(result);                             // 7

  CompletableFuture<Integer> x = CompletableFuture.supplyAsync(() -> 2);
  CompletableFuture<Integer> y = CompletableFuture.supplyAsync(() -> 5);
  System.out.println(x.thenCombine(y, Integer::sum).join());   // 7

  // Any BiFunction works as the combiner, not just sum:
  CompletableFuture<String> combined = x.thenCombine(y, (xVal, yVal) -> xVal + " and " + yVal);
  System.out.println(combined.join());                          // 2 and 5
starter_code: |
  import java.util.concurrent.CompletableFuture;

  public class Solution {
      public static void main(String[] args) {
          CompletableFuture<Integer> a = CompletableFuture.supplyAsync(() -> 3);
          CompletableFuture<Integer> b = CompletableFuture.supplyAsync(() -> 4);
          int aVal = a.join();
          int bVal = b.join();
          System.out.println(aVal + bVal);
      }
  }
challenge: |
  Rewrite this using a.thenCombine(b, Integer::sum).join() instead of
  blocking on each future separately, keeping the same output: 7.
expected_output: |
  7
hints:
  - "thenCombine(other, fn) waits for both futures and applies fn to their two results."
  - "int result = a.thenCombine(b, Integer::sum).join();"
