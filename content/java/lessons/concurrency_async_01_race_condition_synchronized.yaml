challenge: |
  counter++ isn't atomic, so two threads incrementing concurrently can
  lose updates. Fix increment() to synchronize the critical section
  (e.g. synchronized on a dedicated lock object) so the final count is
  always exactly 200000.
expected_output: |
  200000
hints:
  - "counter++ is read-modify-write -- not safe across threads without synchronization."
  - "Add `static final Object lock = new Object();` and wrap `counter++;` in `synchronized (lock) { ... }`."
