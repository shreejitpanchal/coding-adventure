id: idioms_gotchas_05
title: "Array.sort()'s String-First Default"
language: node
level: 5
objective: "Pass a numeric comparator to Array.prototype.sort so numbers sort by value instead of lexicographically."
explanation: |
  `Array.prototype.sort()` with no arguments doesn't compare elements as
  numbers -- it converts every element to a string and sorts those
  strings lexicographically (character by character, like a dictionary).
  For an array like `[10, 1, 21, 2]`, that means comparing `"10"`,
  `"1"`, `"21"`, `"2"` as text: `"1"` sorts before `"10"` (it's a prefix
  of it), `"10"` sorts before `"2"` (`'1' < '2'`), and so on -- producing
  `[1, 10, 2, 21]`, which is correct alphabetically but wrong
  numerically. This isn't a rare edge case; it's `sort()`'s actual,
  documented default behavior, and it silently "works" on small arrays
  of single-digit numbers (where lexicographic and numeric order happen
  to coincide) right up until a two-digit number sneaks in.

  The fix is to always pass an explicit comparator when sorting numbers:
  `(a, b) => a - b` for ascending order. The comparator's contract is
  simple -- return negative if `a` should come first, positive if `b`
  should, zero if they're equal -- and `a - b` satisfies exactly that for
  numbers directly, with no string conversion involved at all. Descending
  order is just the mirrored comparator, `(a, b) => b - a` -- there's no
  separate "descending" flag or method, only a different subtraction
  order, since the comparator's sign is the entire interface `sort()`
  relies on. Watch for one subtlety when subtracting: `a - b` on two
  huge numbers near `Number.MAX_SAFE_INTEGER` can itself lose precision
  or overflow in unexpected ways, so `(a, b) => a - b` is the standard
  idiom for ordinary numbers, but `(a, b) => (a > b ? 1 : a < b ? -1 :
  0)` is the safer, subtraction-free comparator when the values might be
  extreme.
example_code: |
  // The trap: sort() with no comparator treats numbers as strings.
  const lexicographic = [10, 1, 21, 2];
  lexicographic.sort();
  console.log(lexicographic.join(","));  // 1,10,2,21 -- alphabetical, not numeric

  // The fix: pass a numeric comparator explicitly.
  const numeric = [10, 1, 21, 2];
  numeric.sort((a, b) => a - b);
  console.log(numeric.join(","));  // 1,2,10,21

  // Descending is just the mirrored comparator -- no separate API.
  const descending = [10, 1, 21, 2];
  descending.sort((a, b) => b - a);
  console.log(descending.join(","));  // 21,10,2,1
starter_code: |
  const nums = [10, 1, 21, 2];
  nums.sort();
  console.log(nums.join(","));
challenge: |
  Fix the sort so it orders the numbers numerically (1,2,10,21) instead
  of lexicographically -- pass a comparator to `sort()`.
expected_output: |
  1,2,10,21
hints:
  - "nums.sort((a, b) => a - b) sorts ascending by numeric value."
  - "sort() still mutates nums in place here -- you don't need to reassign the result to a new variable."
xp_reward: 10
achievement: idioms_gotchas_master
category: idioms_gotchas
category_level: 5
difficulty: gotcha
contains_patterns:
  - "a - b"
concept_tags: [array_sort, comparator, lexicographic_sort]
