id: core_refresher_03
title: "String Concatenation to Template Literal"
language: node
level: 8
objective: "Replace + string concatenation with a template literal."
explanation: |
  Building a sentence out of `+` concatenation means constantly breaking
  out of string literals to splice in a variable, then back into another
  string literal -- `"Hi " + name + ", you are " + age + " years old."`.
  Every quote-to-plus-to-quote transition is a place to lose track of
  spacing, forget a `+`, or introduce an extra/missing space, and the
  overall shape of the final sentence is hard to read directly from the
  code.

  Template literals (backtick strings) let a variable be embedded
  directly in place with `${expr}`, so the string reads the same way the
  output will look, with no interruption to splice in a plus sign:
  `` `Hi ${name}, you are ${age} years old.` ``. `${}` can hold any
  expression, not just a bare variable, and the whole literal can span
  multiple lines without `\n` escapes -- both are reasons template
  literals became the default way to build any string with dynamic
  content once ES2015 introduced them.
example_code: |
  const name = "Ada";
  const age = 30;

  // The trap: string concatenation, easy to lose a space or a +.
  const greetingConcat = "Hi " + name + ", you are " + age + " years old.";
  console.log(greetingConcat);

  // The fix: a template literal reads like the final sentence.
  const greeting = `Hi ${name}, you are ${age} years old.`;
  console.log(greeting);
starter_code: |
  function greet(name, age) {
    return "Hi " + name + ", you are " + age + " years old.";
  }
  console.log(greet("Ada", 30));
challenge: |
  Rewrite `greet` to build the sentence with a template literal instead
  of `+` concatenation, keeping the exact same output.
expected_output: |
  Hi Ada, you are 30 years old.
hints:
  - "Use backticks: `Hi ${name}, you are ${age} years old.`"
xp_reward: 10
achievement: null
category: core_refresher
category_level: 3
difficulty: core
contains_patterns:
  - "\\$\\{name\\}"
  - "\\$\\{age\\}"
concept_tags: [template_literals, string_concatenation]
