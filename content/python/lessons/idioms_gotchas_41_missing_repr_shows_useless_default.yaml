challenge: |
  Fix `Item` by adding a `__repr__` method returning `f"Item({self.name
  !r})"`. It should print `False`, not `True`.
expected_output: |
  False
hints:
  - "Add: def __repr__(self): return f\"Item({self.name!r})\", as another method on the class."
  - "Printing a list calls repr() on each of its elements, not str() -- a class needs __repr__ specifically to look meaningful inside a container."
