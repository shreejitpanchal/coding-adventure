id: deployment_03
title: "Handling a Shutdown Signal Gracefully"
language: python
level: 68
objective: "Fix a signal handler that's registered but does nothing, instead of flipping a flag the rest of the program can check to shut down cleanly."
explanation: |
  A deployed process typically gets SIGTERM when it's asked to stop
  (e.g. during a rolling deploy) -- the standard pattern is to register a
  handler via signal.signal() that just flips a flag ("we've been asked
  to stop"), letting the main loop notice it and wind down cleanly
  (finish in-flight work, close connections) instead of being killed
  mid-request.
example_code: |
  import signal

  stop_requested = False

  def handle(signum, frame):
      global stop_requested
      stop_requested = True

  signal.signal(signal.SIGTERM, handle)
starter_code: |
  import signal

  shutting_down = False

  def handle_shutdown(signum, frame):
      pass

  signal.signal(signal.SIGTERM, handle_shutdown)
  handle_shutdown(signal.SIGTERM, None)
  print(shutting_down)
challenge: |
  handle_shutdown is registered as the SIGTERM handler but does nothing
  when called -- shutting_down never actually changes. Fix it to set the
  global shutting_down flag to True, so the output (after the simulated
  signal call) is True.
expected_output: |
  True
hints:
  - "The handler needs `global shutting_down` to modify the module-level variable."
  - "Set shutting_down = True inside handle_shutdown."
xp_reward: 15
