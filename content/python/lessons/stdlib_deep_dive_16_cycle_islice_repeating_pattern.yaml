challenge: |
  Rewrite `repeat_pattern` using `itertools.cycle(pattern)` combined
  with `itertools.islice(..., n)`, instead of manual modulo indexing.
  Keep the same output: ['a', 'b', 'a', 'b', 'a'].
expected_output: |
  ['a', 'b', 'a', 'b', 'a']
hints:
  - "from itertools import cycle, islice, then: return list(islice(cycle(pattern), n))."
  - "cycle(pattern) handles the wraparound internally -- no modulo arithmetic needed anywhere in the caller's own code."
