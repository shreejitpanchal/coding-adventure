challenge: |
  Replace `log_info`/`log_warning` with one generic `log(level, msg)`
  function plus `log_info = partial(log, "INFO")` and
  `log_warning = partial(log, "WARNING")`. Keep the same output:
  [INFO] started
  [WARNING] low disk space
expected_output: |
  [INFO] started
  [WARNING] low disk space
hints:
