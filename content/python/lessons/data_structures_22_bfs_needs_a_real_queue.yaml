challenge: |
  Fix `bfs` so it uses `collections.deque` and `.popleft()`, instead of
  a plain list and `.pop()` (which pops from the wrong end). It should
  print `['A', 'B', 'C', 'D', 'E', 'F']`, not
  `['A', 'B', 'C', 'F', 'D', 'E']`.
expected_output: |
  ['A', 'B', 'C', 'D', 'E', 'F']
hints:
  - "from collections import deque, then queue = deque([start]) and node = queue.popleft() instead of queue.pop()."
  - "popleft() removes from the FRONT, processing nodes in the order they were discovered -- that's what actually makes the traversal breadth-first."
