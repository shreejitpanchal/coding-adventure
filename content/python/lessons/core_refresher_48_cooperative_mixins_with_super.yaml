challenge: |
  Fix `LoggingMixin` and `ValidatingMixin` so each `save()` calls
  `super().save()` after appending, continuing the chain to the next
  class in the MRO. Keep the same output: 2.
expected_output: |
  2
hints:
  - "Add super().save() as the last line inside both LoggingMixin.save() and ValidatingMixin.save()."
  - "Without super().save(), whichever mixin comes first in the MRO runs its own logic and simply stops -- the other mixin's override is never reached."
