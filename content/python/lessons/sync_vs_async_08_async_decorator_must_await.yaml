      print(log)

  asyncio.run(main())
challenge: |
  Fix `wrapper` so it's an `async def` function that does
  `result = await func(*args, **kwargs)` instead of calling `func`
  directly. It should print
  `['before', 'fetch running', 'after']`, not
  `['before', 'after', 'fetch running']`.
expected_output: |
  ['before', 'fetch running', 'after']
hints:
  - "async def wrapper(*args, **kwargs): log.append(\"before\"); result = await func(*args, **kwargs); log.append(\"after\"); return result."
  - "A non-async wrapper only ever creates the coroutine object -- it never actually drives it, so anything logged \"after\" the call fires before the real work has run at all."
