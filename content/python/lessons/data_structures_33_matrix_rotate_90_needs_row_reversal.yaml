id: data_structures_33
title: "Rotating a Matrix 90 Degrees Needs a Row Reversal, Not Just a Transpose"
language: python
level: 190
objective: "Fix a rotation function that only transposes the matrix, when a genuine 90-degree clockwise rotation needs the rows reversed first -- a plain transpose alone swaps rows and columns but doesn't actually rotate anything."
explanation: |
  This category's previous lesson covered `zip(*matrix)` for a
  transpose -- but a transpose alone isn't the same thing as a 90-
  degree rotation, even though they look similar. Rotating clockwise
  by 90 degrees is a transpose *combined with* reversing the row order
  first: `zip(*matrix[::-1])`. Skipping the reversal produces a
  genuinely different result (a transpose, which flips across the
  diagonal) instead of the intended rotation (which turns the whole
  grid a quarter turn).

  The bug this exercise fixes uses `zip(*matrix)` alone -- a transpose,
  not a rotation. The fix reverses the rows first with `matrix[::-1]`.
example_code: |
  # The trap: zip(*matrix) alone is a TRANSPOSE, not a 90-degree
  # rotation -- missing the row-reversal step.
  def rotate_90_trap(matrix):
      return [list(row) for row in zip(*matrix)]

  print(rotate_90_trap([[1, 2], [3, 4]]))
  # [[1, 3], [2, 4]] -- this is a transpose, not a rotated grid

  # The fix: reverse the rows FIRST, then transpose.
  def rotate_90(matrix):
      return [list(row) for row in zip(*matrix[::-1])]

  print(rotate_90([[1, 2], [3, 4]]))
  # [[3, 1], [4, 2]] -- correctly rotated 90 degrees clockwise
starter_code: |
  def rotate_90(matrix):
      return [list(row) for row in zip(*matrix)]

  print(rotate_90([[1, 2], [3, 4]]))
challenge: |
  Fix `rotate_90` so it reverses the rows first (`matrix[::-1]`) before
  transposing. It should print `[[3, 1], [4, 2]]`, not
  `[[1, 3], [2, 4]]`.
expected_output: |
  [[3, 1], [4, 2]]
hints:
  - "Change zip(*matrix) to zip(*matrix[::-1])."
  - "A transpose alone flips across the diagonal -- combining it with a row reversal is what actually turns the grid a quarter turn."
