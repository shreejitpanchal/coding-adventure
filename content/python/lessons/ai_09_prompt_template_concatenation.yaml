id: ai_09
title: "Concatenating Retrieved Context Straight Into the Prompt"
language: python
level: 84
objective: "Fix a RAG prompt builder that concatenates retrieved context and the user's question with no separator, by using a clearly delimited template instead."
explanation: |
  `context + question` glues two strings together with nothing marking
  where one ends and the other begins -- if the retrieved context
  doesn't happen to end in whitespace or punctuation, the last word of
  the context runs directly into the first word of the question with no
  space at all, producing malformed, confusing input. More seriously,
  plain concatenation gives a language model no structural signal
  distinguishing "this is background information I retrieved for you"
  from "this is the actual question you need to answer" -- both are
  just part of one undifferentiated block of text. Retrieved context
  often comes from external documents the pipeline doesn't fully
  control; with no clear boundary, text embedded in that context could
  even be mistaken for additional instructions rather than reference
  material, a real category of concern in RAG system design known as
  prompt injection via retrieved content.

  A clearly delimited template fixes both problems at once: labeling
  each section explicitly (`"Context:\n{context}\n---\nQuestion:
  {question}"`) gives the model an unambiguous structural cue for what
  each piece of text represents, and the delimiter (`---`) guarantees
  the two sections are never run together regardless of what
  punctuation the context happens to end with. This is a small, purely
  textual change, but it's the standard first line of defense in RAG
  prompt construction -- never hand a model retrieved content and
  instructions as one undifferentiated blob of text.
example_code: |
  # The trap: no separation between retrieved context and the question.
  def build_prompt_trap(context, question):
      return context + question

  context = "Paris is the capital of France"
  question = "What is the capital?"
  print(repr(build_prompt_trap(context, question)))
  # 'Paris is the capital of FranceWhat is the capital?' -- runs together, no boundary at all

  # The fix: a clearly delimited template with labeled sections.
  def build_prompt(context, question):
      return f"Context:\n{context}\n---\nQuestion: {question}"

  print(build_prompt(context, question))
  # Context:
  # Paris is the capital of France
  # ---
  # Question: What is the capital?
starter_code: |
  def build_prompt(context, question):
      return context + question

  context = "Paris is the capital of France."
  question = "What is the capital?"
  print(build_prompt(context, question))
challenge: |
  Fix `build_prompt` so it returns a clearly delimited template instead
  of plain concatenation -- format it as "Context:\n{context}\n---\n
  Question: {question}".
expected_output: |
  Context:
  Paris is the capital of France.
  ---
  Question: What is the capital?
hints:
  - "return f\"Context:\\n{context}\\n---\\nQuestion: {question}\""
  - "\\n inside an f-string produces an actual newline in the output, matching the expected multi-line format exactly."
