id: data_structures_45
title: "Counter.most_common() Breaks Ties by Insertion Order, Not Alphabetically"
language: python
level: 202
objective: "Fix a function that alphabetically re-sorts tied results from most_common(), when the tie-breaking order most_common() already provides -- first-encountered wins -- is itself meaningful information that alphabetical sorting destroys."
explanation: |
  When two keys in a `Counter` have the same count, `.most_common()`
  preserves their relative *insertion* order among the tied entries --
  whichever key was incremented first appears first among equally-
  ranked ties. Re-sorting the result alphabetically to "make it
  deterministic" actually destroys real information: insertion order
  often reflects something meaningful (which item was seen first in a
  stream, which candidate got its first vote earliest), and alphabetical
  order has nothing to do with that.

  The bug this exercise fixes re-sorts `most_common()`'s result
  alphabetically. The fix uses the tie order `most_common()` already
  provides directly.
example_code: |
  # The trap: re-sorts alphabetically, destroying the meaningful
  # insertion-order tie-break most_common() already provides.
  from collections import Counter

  def first_tied_trap(counts):
      return sorted(counts.most_common())[0][0]

  counts = Counter()
  counts["b"] += 1
  counts["a"] += 1
  print(first_tied_trap(counts))
  # "a" -- alphabetical sort picked this, regardless of which was actually seen first

  # The fix: use most_common()'s own tie order directly.
  def first_tied(counts):
      return counts.most_common()[0][0]

  print(first_tied(counts))
  # "b" -- correctly reflects insertion order for the tied counts
