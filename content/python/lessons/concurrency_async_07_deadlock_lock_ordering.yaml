  a1, a2 = Account(1), Account(2)
  log = []
  transfer(log, a2, a1)
  print(log)
challenge: |
  Fix `transfer` so it always acquires (logs) the lower-id account
  first, via `first, second = sorted([from_acc, to_acc], key=lambda a:
  a.id)`, instead of logging in whatever order they were passed. It
  should print `[1, 2]`, not `[2, 1]`.
expected_output: |
  [1, 2]
hints:
  - "first, second = sorted([from_acc, to_acc], key=lambda a: a.id), then log.append(first.id); log.append(second.id)."
  - "Two threads transferring in opposite directions, both acquiring in \"from, then to\" order, acquire their locks in OPPOSITE orders -- exactly the setup for a deadlock. A fixed, consistent order removes that risk."
