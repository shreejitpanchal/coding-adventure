  import asyncio

  async def other_task(log):
      log.append("other ran")

  async def cpu_loop(log):
      total = 0
      for i in range(3):
          total += i
      log.append("loop done")
      return total

  async def main():
      log = []
      await asyncio.gather(cpu_loop(log), other_task(log))
      print(log)

  asyncio.run(main())
challenge: |
  Fix `cpu_loop` by adding `await asyncio.sleep(0)` inside the `for`
  loop. It should print `['other ran', 'loop done']`, not
  `['loop done', 'other ran']`.
expected_output: |
  ['other ran', 'loop done']
hints:
  - "Add await asyncio.sleep(0) as a line inside the for loop body."
  - "asyncio.sleep(0) doesn't actually pause for any time -- it's a deliberate signal letting the event loop run other ready tasks before resuming."
