  import threading, time

  cond = threading.Condition()
  items = []

  def producer():
      items.append(1)
      cond.notify()

  def consumer(log):
      with cond:
          while not items:
              cond.wait()
          log.append(items.pop())

  def run():
      log = []
      t = threading.Thread(target=consumer, args=(log,))
      t.start()
      time.sleep(0.02)
      try:
          producer()
          t.join()
          print(log)
      except RuntimeError:
          print("crashed")

  run()
challenge: |
  Fix `producer` so it wraps `items.append(1)` and `cond.notify()` in
  `with cond:`, instead of calling `notify()` without holding the
  lock. It should print `[1]`, not `crashed`.
expected_output: |
  [1]
