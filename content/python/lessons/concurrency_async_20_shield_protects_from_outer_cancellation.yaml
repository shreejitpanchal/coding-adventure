  asyncio.run(main())
challenge: |
  Fix `main` so it wraps the save call in `asyncio.shield(save(log))`
  before handing it to `wait_for`, protecting it from the outer
  timeout's cancellation. It should print `['saved']`, not `[]`.
expected_output: |
  ['saved']
hints:
