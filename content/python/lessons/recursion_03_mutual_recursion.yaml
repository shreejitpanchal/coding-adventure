id: recursion_03
title: "Mutual Recursion with a Wrong Base Case"
language: python
level: 53
objective: "Fix a mutually recursive pair of functions whose base case returns the wrong value."
explanation: |
  Mutual recursion is what happens when two (or more) functions call
  *each other* instead of each calling itself directly -- `is_even(n)`
  delegating to `is_odd(n - 1)`, which delegates back to `is_even(n -
  2)`, and so on, alternating between the two functions until one of
  them hits its base case. It's a natural fit whenever a problem
  genuinely has two distinct "modes" that flip back and forth as the
  recursion proceeds (even/odd here; parsing grammars with alternating
  expression types is a more elaborate real-world example). Everything
  that applies to ordinary single-function recursion applies here too --
  each function still needs a correct base case -- except now there
  are *multiple* base cases (one per function in the mutual cycle), and
  each one needs to be independently correct, since the two functions
  are trusting each other's correctness at the boundary.

  That trust is exactly what makes a wrong base case in mutual
  recursion particularly easy to overlook: `is_even(0)` returning
  `False` is a self-contained, obviously wrong fact (0 is even, by
  definition), but its effect doesn't stay contained to calls that
  directly hit that base case -- it silently corrupts every result that
  passes through it. `is_even(10)` calls `is_odd(9)`, which calls `is_
  even(8)`, ... eventually bottoming out at `is_even(0)`, and that one
  wrong base case flips the correctness of the entire chain built on
  top of it, even though every other line of logic in both functions is
  completely correct. Debugging a mutual-recursion bug like this
  usually means checking each function's base case in isolation first,
  independent of the mutual call structure, since the actual defect is
  often a small, local, single-line mistake that a full call-chain
  trace only makes look more complicated than it is.
example_code: |
  # The trap: one wrong base case corrupts every result built on top of it.
  def is_even_broken(n):
      if n == 0:
          return False              # WRONG -- 0 is even!
      return is_odd_broken(n - 1)

  def is_odd_broken(n):
      if n == 0:
          return False              # correct: 0 is not odd
      return is_even_broken(n - 1)

  print(is_even_broken(4))          # False -- WRONG, corrupted by the bad base case

  # Fix: correct is_even's base case -- is_odd's was already right.
  def is_even(n):
      if n == 0:
          return True                # 0 IS even
      return is_odd(n - 1)

  def is_odd(n):
      if n == 0:
          return False
      return is_even(n - 1)

  print(is_even(10))                 # True
  print(is_odd(7))                   # True

  # Debugging tip: check each base case IN ISOLATION, independent of the chain.
  print(is_even(0))                  # True -- verify the base case directly first
  print(is_odd(0))                   # False
starter_code: |
  def is_even(n):
      if n == 0:
          return False
      return is_odd(n - 1)

  def is_odd(n):
      if n == 0:
          return False
      return is_even(n - 1)

  print(is_even(10))
  print(is_odd(7))
challenge: |
  is_even's base case is wrong -- 0 is even, so is_even(0) should return
  True, not False. Fix that one base case so both lines print correctly:
  True, then True (10 is even, 7 is odd).
expected_output: |
  True
  True
hints:
  - "0 is even by definition -- is_even(0) should return True."
  - "Only is_even's base case is wrong; is_odd's base case (False) is already correct."
