challenge: |
  Fix `install_order` by tracking `done` and `in_progress` as separate
  sets, raising `ValueError` when `visit` encounters a name that's
  still `in_progress`. It should print `circular dependency detected`,
  not `no error raised`.
expected_output: |
  circular dependency detected
hints:
  - "done = set(); in_progress = set(); inside visit: if name in done: return; if name in in_progress: raise ValueError(...)."
  - "in_progress.add(name) before recursing, in_progress.discard(name) and done.add(name) after -- a name still in_progress when revisited IS a real cycle."
