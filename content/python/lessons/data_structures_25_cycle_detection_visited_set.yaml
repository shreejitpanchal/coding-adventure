challenge: |
  Fix `has_cycle` so `visit` checks `if node in visited: return True`
  before adding the node and recursing further, propagating that
  `True` back up through each recursive call. It should print `True`,
  not `crashed`.
expected_output: |
  True
hints:
  - "Add: if node in visited: return True, as the very first line inside visit()."
  - "Each recursive call also needs to check and propagate the True it gets back -- if visit(neighbor): return True -- so the cycle detection actually reaches the top-level caller."
