id: sync_vs_async_02
title: "Running Blocking I/O Without Blocking the Loop"
language: python
level: 42
objective: "Use asyncio.to_thread to run a genuinely blocking function (one you can't rewrite as async) without freezing the event loop."
explanation: |
  The previous exercise's fix -- swap `time.sleep()` for `asyncio.sleep
  ()` -- only works when an async-native equivalent actually exists.
  Often it doesn't: a third-party library with no async support, a C
  extension doing genuine blocking I/O at a lower level than Python can
  intercept, or legacy code that can't be rewritten. Calling any of
  those directly inside a coroutine has exactly the same effect as the
  previous exercise's `time.sleep()` mistake -- it blocks the entire
  event loop for as long as it runs, since there's no `await` point
  inside it for the loop to reclaim control at.

  `asyncio.to_thread(func, *args, **kwargs)` solves this by running
  `func` in a separate background thread (drawn from a thread pool
  managed internally) rather than on the event loop's own thread, and
  returning an awaitable that completes once that background call
  finishes. The event loop's own thread is free to keep running other
  coroutines the entire time the blocking call is executing elsewhere
  -- the blocking work still takes just as long in wall-clock terms
  (running it on a different thread doesn't make `blocking_io()` itself
  faster), but it no longer *prevents* anything else from making
  progress concurrently, which is the actual goal. This only helps for
  I/O-bound blocking work, for the same GIL-related reason threads help
  I/O-bound work generally (see the `concurrency_async` category): a
  thread genuinely blocked on I/O releases the GIL, letting the event
  loop's thread run Python code in the meantime, whereas CPU-bound work
  moved to a thread would still contend for the GIL and provide much
  less benefit -- `asyncio`'s own docs point toward `ProcessPoolExecutor
  ` instead for CPU-bound work that needs to run alongside an event
  loop without blocking it.
example_code: |
  import asyncio, time

  # The trap: a blocking call with no async equivalent, called inline.
  def blocking_io(delay=0.05):
      time.sleep(delay)              # e.g. a legacy function, no await version exists
      return "io done"

  async def fast_task(log):
      await asyncio.sleep(0.01)
      log.append("fast task done")

  async def main_broken():
      log = []
      async def wrapped():
          result = blocking_io()     # blocks the WHOLE event loop for 0.05s
          log.append(result)
      await asyncio.gather(wrapped(), fast_task(log))
      print(log)                      # ['io done', 'fast task done'] -- wrong order

  asyncio.run(main_broken())

  # Fix: asyncio.to_thread runs it off the event loop's own thread.
  async def main():
      log = []
      async def wrapped():
          result = await asyncio.to_thread(blocking_io, 0.05)   # args forwarded to blocking_io
          log.append(result)
      await asyncio.gather(wrapped(), fast_task(log))
      print(log)                      # ['fast task done', 'io done'] -- correct interleaving

  asyncio.run(main())

  # For CPU-bound work (not I/O), a ProcessPoolExecutor is the better fit --
  # to_thread still contends for the GIL for pure computation.
starter_code: |
  import asyncio
  import time

  def blocking_io():
      time.sleep(0.05)
      return "io done"

  async def fast_task(log):
      await asyncio.sleep(0.01)
      log.append("fast task done")

  async def main():
      log = []

      async def wrapped():
          result = blocking_io()
          log.append(result)

      await asyncio.gather(wrapped(), fast_task(log))
      print(log)

  asyncio.run(main())
challenge: |
  wrapped() calls blocking_io() directly, freezing the event loop for
  its full 0.05s -- so fast_task (which only needs 0.01s) can't run
  until it's done. Fix wrapped() to run blocking_io via
  `await asyncio.to_thread(blocking_io)` instead, so fast_task finishes
  first. The output should become ['fast task done', 'io done'].
expected_output: |
  ['fast task done', 'io done']
hints:
  - "blocking_io itself can't be rewritten with await -- it's a plain blocking function."
  - "await asyncio.to_thread(blocking_io) runs it off the event loop's thread."
