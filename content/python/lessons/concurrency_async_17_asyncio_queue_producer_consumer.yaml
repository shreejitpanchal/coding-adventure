  import asyncio

  async def producer(shared, items):
      for item in items:
          shared.append(item)

  async def consume(shared, count):
      results = []
      while len(results) < count:
          while not shared:
              await asyncio.sleep(0.001)
          results.append(shared.pop(0))
      return results

  async def main():
      shared = []
      await producer(shared, [1, 2, 3])
      results = await consume(shared, 3)
      print(sum(results))

  asyncio.run(main())
challenge: |
  Rewrite this using `asyncio.Queue` -- `await q.put(item)` in the
  producer, `await q.get()` in the consumer -- instead of a plain list
  with a manual polling loop. Keep the same output: `6`.
expected_output: |
  6
hints:
  - "q = asyncio.Queue(); producer calls await q.put(item); consumer calls [await q.get() for _ in range(count)]."
  - "await q.get() already suspends the coroutine until an item is actually available -- no manual asyncio.sleep-and-recheck loop needed."
