challenge: |
  Fix this by defining `pipe(*funcs)` (folding with
  `lambda acc, f: lambda x: f(acc(x))` starting from `lambda x: x`),
  building `clean = pipe(strip_step, lower_step, replace_step)` once,
  and applying `clean(...)` to each input instead of repeating the
  nested-call chain. Keep the same output: hello_world foo_bar.
expected_output: |
  hello_world foo_bar
