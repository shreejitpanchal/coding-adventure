challenge: |
  Rewrite `transpose` using `[list(row) for row in zip(*matrix)]`,
  instead of the manual nested loop. Keep the same output:
  [[1, 4], [2, 5], [3, 6]].
expected_output: |
  [[1, 4], [2, 5], [3, 6]]
hints:
