id: ai_18
title: "Registering an MCP Tool List That Silently Overwrites Duplicates"
language: python
level: 93
objective: "Fix a tool registry builder that silently lets a later tool definition overwrite an earlier one with the same name, by rejecting duplicate names explicitly."
explanation: |
  Building a `{tool["name"]: tool for tool in tool_defs}` dictionary
  comprehension from a list of tool definitions is a compact way to
  index them by name -- but a plain dict comprehension has no concept
  of "this key was already used." If two tool definitions in the list
  happen to share the same `name` (a genuine bug somewhere upstream --
  a copy-paste error while defining tools, or two independently
  authored tool modules that happened to pick the same name), the
  comprehension doesn't complain at all; it just keeps whichever
  definition came *last* in the list, silently discarding the earlier
  one with no record that a collision ever happened. An MCP server
  exposing a `tools/list` built this way could end up serving a
  completely different tool than the one that was supposed to be
  registered under that name, with nothing in the registration step
  itself hinting that anything was overwritten.

  The fix is to build the registry incrementally, checking for an
  existing entry before adding each new one: `if t["name"] in registry:
  raise ValueError(f'duplicate tool name: {t["name"]}')` turns a silent
  overwrite into an immediate, specific failure at registration time --
  exactly when the actual mistake was made, rather than surfacing later
  as "why does calling this tool do the wrong thing," disconnected from
  its real cause. Catching a naming collision at registration is far
  cheaper than debugging its downstream symptoms once the server is
  already running with the wrong tool silently in place.
example_code: |
  # The trap: a plain dict comprehension silently lets duplicates overwrite.
  def register_tools_trap(tool_defs):
      return {t["name"]: t for t in tool_defs}

  defs = [{"name": "search", "version": 1}, {"name": "search", "version": 2}]
  print(register_tools_trap(defs))
  # {'search': {'name': 'search', 'version': 2}} -- version 1 silently vanished, no warning at all

  # The fix: check for an existing entry before adding, fail loudly on a collision.
  def register_tools(tool_defs):
      registry = {}
      for t in tool_defs:
          if t["name"] in registry:
              raise ValueError(f"duplicate tool name: {t['name']}")
          registry[t["name"]] = t
      return registry

  try:
      register_tools(defs)
  except ValueError as e:
      print(f"caught: {e}")   # caught: duplicate tool name: search
starter_code: |
  def register_tools(tool_defs):
      return {t["name"]: t for t in tool_defs}

  defs = [{"name": "search", "version": 1}, {"name": "search", "version": 2}]
  print(register_tools(defs))
challenge: |
  Fix `register_tools` so registering a duplicate tool name raises a
  ValueError ("duplicate tool name: search") instead of silently
  overwriting the earlier definition -- catch it and print "caught:
  duplicate tool name: search".
expected_output: |
  caught: duplicate tool name: search
hints:
  - "Build the registry with a for loop instead of a dict comprehension, so you can check `if t[\"name\"] in registry:` before adding each one."
  - "raise ValueError(f\"duplicate tool name: {t['name']}\") inside that if, then wrap the register_tools(defs) call in try/except ValueError."
