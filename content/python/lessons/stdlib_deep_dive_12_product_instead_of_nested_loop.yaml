      return result

  print(all_combos([1, 2], ["a", "b"]))
challenge: |
  Rewrite `all_combos` using `itertools.product(a, b)`, instead of a
  manual nested loop. Keep the same output:
  [(1, 'a'), (1, 'b'), (2, 'a'), (2, 'b')].
expected_output: |
  [(1, 'a'), (1, 'b'), (2, 'a'), (2, 'b')]
hints:
