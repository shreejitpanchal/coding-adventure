challenge: |
  Fix `wait_for_dependency` so it retries `check_fn()` up to
  `max_attempts=5` times, sleeping `delay=0.01` seconds between
  attempts, returning `True` the moment it succeeds, instead of
  checking only once. It should print `True`, not `False`.
expected_output: |
  True
