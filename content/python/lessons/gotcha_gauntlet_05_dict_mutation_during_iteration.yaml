id: gotcha_gauntlet_05
title: "The Dict That Changed Size Mid-Loop"
language: python
level: 34
objective: "Fix a RuntimeError caused by deleting dict keys while iterating over the dict itself."
explanation: |
  `for name in scores:` doesn't loop over a static snapshot of the
  dict's keys -- it creates an iterator that walks the dict's *live*
  internal structure directly, advancing one entry at a time as the
  loop runs. `del scores[name]` inside that same loop mutates that
  exact structure mid-walk, and CPython detects this deliberately: it
  raises `RuntimeError: dictionary changed size during iteration`
  rather than silently producing some unpredictable subset of keys
  (skipping entries, revisiting entries, or worse) depending on
  internal bucket layout. That's a defensive, intentional safeguard,
  not an arbitrary restriction -- the alternative, letting size-changing
  mutation during iteration "just work" in whatever way the internal
  hash table happens to shake out, would be far worse: silently wrong
  results with no error at all, which is much harder to catch than a
  loud crash.

  The standard fix is to iterate over a *snapshot* of the keys instead
  of the live dict: `list(scores)` (or, equivalently, `list(scores.
  keys())`) materializes every key into a plain list right at the start
  of the loop, completely decoupled from the dict's internal state
  afterward -- deleting from `scores` during the loop no longer affects
  what's being iterated over, because the thing being iterated over is
  now an independent list, not the dict itself. This same shape --
  "iterating over a live mutable collection while mutating that exact
  collection is unsafe; iterate over a snapshot instead" -- applies
  beyond dicts too: removing items from a list while iterating over it
  directly (`for item in my_list: my_list.remove(item)`) has the same
  problem, just without CPython raising an error for it the way dicts
  do (it silently skips elements instead, an even more insidious
  version of the same underlying mistake), and the same `list(...)`-
  style snapshot fix applies there as well.
example_code: |
  # The trap: mutating a dict's size while iterating over the LIVE dict.
  scores_broken = {"alice": 10, "bob": -5, "carol": 8}
  # for name in scores_broken:
  #     if scores_broken[name] < 0:
  #         del scores_broken[name]        # RuntimeError: dict changed size!

  # Fix: iterate over a SNAPSHOT of the keys, not the live dict.
  scores = {"a": 1, "b": -1, "c": 2}
  for key in list(scores):           # list(scores) is an independent copy of keys
      if scores[key] < 0:
          del scores[key]            # mutating the ORIGINAL dict is now safe
  print(scores)                      # {'a': 1, 'c': 2}

  # The same shape applies to lists too -- silently WRONG, not even an error:
  nums = [1, -2, 3, -4, 5]
  for n in nums:
      if n < 0:
          nums.remove(n)             # skips elements! -2 removed shifts -4 forward
  print(nums)                        # [1, 3, -4, 5] -- -4 survived, a bug with no crash

  # Fix: same snapshot pattern -- iterate over a copy, mutate the original.
  nums2 = [1, -2, 3, -4, 5]
  for n in list(nums2):
      if n < 0:
          nums2.remove(n)
  print(nums2)                       # [1, 3, 5] -- correct
starter_code: |
  scores = {"alice": 10, "bob": -5, "carol": 8}
  for name in scores:
      if scores[name] < 0:
          del scores[name]
  print(scores)
challenge: |
  This currently raises a RuntimeError. Fix it so it iterates over a
  snapshot of the keys instead of the live dict, ending with only the
  non-negative scores: {'alice': 10, 'carol': 8}.
expected_output: |
  {'alice': 10, 'carol': 8}
hints:
