challenge: |
  Fix this by defining `class InsufficientFundsError(Exception): pass`
  and raising/catching that instead of the generic `ValueError`. Keep
  the same output: insufficient funds.
expected_output: |
  insufficient funds
hints:
  - "class InsufficientFundsError(Exception): pass, then raise/except that instead of ValueError."
  - "A custom exception class costs almost nothing to define and gives callers something specific to catch, instead of an indistinguishable generic type."
