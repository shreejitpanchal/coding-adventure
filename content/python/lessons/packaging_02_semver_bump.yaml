id: packaging_02
title: "Bumping a Semantic Version"
language: python
level: 62
objective: "Implement a semantic-version bump: incrementing one part resets every part below it to zero."
explanation: |
  Semantic versioning (major.minor.patch) encodes meaning in each
  position -- bumping the minor version for a new backward-compatible
  feature should reset the patch number back to 0, since patch numbers
  are only meaningful relative to a specific minor release. Getting this
  reset wrong is a common packaging-tooling bug.
example_code: |
  def bump_patch(version):
      major, minor, patch = (int(p) for p in version.split("."))
      return f"{major}.{minor}.{patch + 1}"

  print(bump_patch("1.0.0"))
starter_code: |
  def bump_version(version, part):
      return version

  print(bump_version("1.2.3", "minor"))
challenge: |
  bump_version doesn't actually bump anything -- it just returns the
  input unchanged. Fix it so a "minor" bump on "1.2.3" increments the
  minor number and resets patch to 0, producing "1.3.0".
expected_output: |
  1.3.0
hints:
  - "Split the version into major, minor, patch as integers first."
  - "For a minor bump: f\"{major}.{minor + 1}.0\" -- patch resets to 0."
xp_reward: 10
achievement: null
category: packaging
category_level: 2
difficulty: core
contains_patterns:
  - "minor \\+ 1"
concept_tags: [packaging, semantic_versioning]
