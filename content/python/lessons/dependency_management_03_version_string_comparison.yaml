id: dependency_management_03
title: "Comparing Version Numbers as Strings"
language: python
level: 58
objective: "Fix a version comparison that's wrong because it compares version strings lexicographically instead of numerically."
explanation: |
  "10.0.0" > "9.0.0" is False as a plain string comparison -- Python
  compares strings character by character, and the character '1' sorts
  before '9', so "10.0.0" looks "smaller" than "9.0.0" even though
  version 10 is clearly newer than version 9. Real version comparisons
  need to split on the dots and compare each numeric component as an
  integer, not as text.
example_code: |
  def parse(v):
      return tuple(int(p) for p in v.split("."))

  print(parse("2.10.0") > parse("2.9.0"))
starter_code: |
  def is_newer(version_a, version_b):
      return version_a > version_b

  print(is_newer("10.0.0", "9.0.0"))
challenge: |
  is_newer compares the raw strings, so "10.0.0" incorrectly looks older
  than "9.0.0" (this prints False). Fix it to split each version on "."
  and compare the parts as a tuple of integers, so the output correctly
  becomes True.
expected_output: |
  True
hints:
  - "String comparison is character-by-character -- '1' < '9', so \"10.0.0\" < \"9.0.0\" as text."
  - "Convert each version to tuple(int(p) for p in version.split(\".\")) before comparing."
