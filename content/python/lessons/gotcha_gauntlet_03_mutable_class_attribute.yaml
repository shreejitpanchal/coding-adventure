id: gotcha_gauntlet_03
title: "The Shopping Cart Shared By Every Customer"
language: python
level: 32
objective: "Fix a mutable class-level attribute that's shared across every instance instead of being per-instance."
explanation: |
  A name assigned directly in a class body (`items = []` sitting right
  under `class ShoppingCart:`, not inside any method) creates a *class*
  attribute -- one single object, owned by the class itself, that every
  instance shares access to unless something shadows it. Reading
  `self.items` works because Python's attribute lookup falls back from
  the instance to the class when the instance itself has no attribute
  by that name -- but *mutating* it via `self.items.append(item)` finds
  that same one shared list through the fallback and appends to it, so
  the mutation is visible to every other instance too, since there was
  never more than one list in the first place. `cart1.add("apple")` and
  `cart2.add("bread")` both end up appending to the *same* underlying
  list object, and `cart1.items` shows both, which looks bizarre until
  you realize `cart1.items` and `cart2.items` were never two separate
  lists to begin with.

  This is the class-attribute sibling of the mutable-default-argument
  trap: both bugs come from a mutable object being created exactly
  once, at definition time, and then shared across every subsequent use
  instead of being freshly created per use. The fix follows the same
  logic in both cases -- create the mutable object fresh, per instance,
  at the point where a new instance actually comes into being, which
  for a class is inside `__init__`, assigned onto `self`. `self.items =
  []` inside `__init__` runs once *per instantiation*, not once *per
  class definition*, so every `ShoppingCart()` call gets its own
  genuinely independent list. As a general rule: class-body assignments
  are fine, even idiomatic, for genuinely shared, immutable constants
  (`MAX_ITEMS = 100`), but any mutable default that's meant to be
  per-instance state belongs in `__init__`, never in the class body
  directly.
example_code: |
  # The trap: items = [] in the class body is ONE list, shared by every instance.
  class ShoppingCartBroken:
      items = []                     # class attribute -- created ONCE, shared

      def add(self, item):
          self.items.append(item)    # mutates the ONE shared list

  cart1 = ShoppingCartBroken()
  cart2 = ShoppingCartBroken()
  cart1.add("apple")
  cart2.add("bread")
  print(cart1.items)                  # ['apple', 'bread'] -- cart2's item leaked in!

  # Fix: create the list fresh, per instance, inside __init__.
  class Basket:
      def __init__(self):
          self.items = []             # created ONCE PER INSTANCE

      def add(self, item):
          self.items.append(item)

  b1 = Basket()
  b2 = Basket()
  b1.add("milk")
  b2.add("eggs")
  print(b1.items)                     # ['milk'] -- independent from b2

  # Class-body assignment is fine for genuinely shared, IMMUTABLE constants:
  class ShoppingCart:
      MAX_ITEMS = 100                 # shared constant -- never mutated, safe

      def __init__(self):
          self.items = []
starter_code: |
  class ShoppingCart:
      items = []

      def add(self, item):
          self.items.append(item)

  cart1 = ShoppingCart()
  cart2 = ShoppingCart()
  cart1.add("apple")
  cart2.add("bread")
  print(cart1.items)
challenge: |
  cart1 and cart2 are sharing the same underlying list, so cart1.items
  shows both carts' items. Fix ShoppingCart so each instance gets its own
  independent list, and cart1.items ends up with just ['apple'].
expected_output: |
  ['apple']
hints:
  - "items = [] in the class body is shared by every instance -- it's a class attribute, not an instance attribute."
  - "Move it into __init__ as self.items = []."
