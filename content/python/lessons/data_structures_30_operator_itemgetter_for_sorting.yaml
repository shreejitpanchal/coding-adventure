id: data_structures_30
title: "operator.itemgetter Reads More Clearly Than a Small Lambda for Sorting"
language: python
level: 187
objective: "Replace a small lambda extracting one tuple element with operator.itemgetter, the standard-library tool built specifically for this."
explanation: |
  `lambda x: x[0]` as a sort key works fine, but `operator.itemgetter
  (0)` does the exact same extraction while naming the operation
  directly -- "get item 0" -- rather than requiring a reader to parse a
  small anonymous function to see what's actually being extracted.
  `itemgetter` is also implemented in C, making it marginally faster
  than an equivalent lambda for large sorts, though the main reason to
  reach for it is simply that it reads as a named, purpose-built tool
  rather than an inline function.
example_code: |
  # A lambda extracting one tuple element.
  data = [(3, "c"), (1, "a"), (2, "b")]
  sorted_loop = sorted(data, key=lambda x: x[0])
  print(sorted_loop)                        # [(1, 'a'), (2, 'b'), (3, 'c')]

  # operator.itemgetter does the same extraction, named directly.
  from operator import itemgetter

  sorted_data = sorted(data, key=itemgetter(0))
  print(sorted_data)                        # [(1, 'a'), (2, 'b'), (3, 'c')]
starter_code: |
  data = [(3, "c"), (1, "a"), (2, "b")]
  sorted_data = sorted(data, key=lambda x: x[0])
  print(sorted_data)
challenge: |
  Rewrite the sort key as `itemgetter(0)` (imported from `operator`),
  instead of `lambda x: x[0]`. Keep the same output:
  [(1, 'a'), (2, 'b'), (3, 'c')].
expected_output: |
  [(1, 'a'), (2, 'b'), (3, 'c')]
hints:
  - "from operator import itemgetter, then: sorted(data, key=itemgetter(0))."
  - "itemgetter(0) is functionally identical to lambda x: x[0] -- it just names the extraction directly instead of requiring an inline function."
