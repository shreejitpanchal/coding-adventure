id: ai_12
title: "An Agent Loop With No Iteration Limit"
language: python
level: 87
objective: "Fix an agent loop that can spin forever if the model never signals it's done, by adding an explicit max-iterations guard."
explanation: |
  An agent loop typically runs "ask the model what to do next, act on
  it, repeat" until the model signals it's finished. That loop's
  termination depends entirely on the model eventually producing that
  signal -- if it doesn't (a genuine model quirk, a bug in how the stop
  signal is checked, or a tool that keeps returning results the model
  keeps reacting to without ever concluding), a `while True:` loop with
  no independent bound just keeps running, indefinitely, consuming
  whatever the loop's actions cost (tool calls, API requests, compute)
  the entire time with nothing external stopping it.

  A `max_steps` guard is cheap insurance against exactly this failure
  mode: bounding the loop with `while steps < max_steps:` (or an
  explicit counter check inside a `while True:`) guarantees the agent
  gives up and reports failure after a fixed, known number of
  iterations, rather than running unboundedly. Raising a clear error
  once that limit is hit (`raise RuntimeError(f"agent exceeded
  max_steps={max_steps}")`) is itself part of the fix -- it turns "ran
  forever, someone eventually had to notice and kill it" into "failed
  after a known, bounded number of steps, with a clear message
  explaining exactly why." This is one of the first defensive patterns
  worth building into any agentic loop, independent of how good the
  underlying model or tools are.
example_code: |
  # The trap: no bound at all -- runs forever if get_next_action never says "done".
  def run_agent_trap(get_next_action):
      steps = 0
      while True:
          action = get_next_action(steps)
          steps += 1
          if action == "done":
              return steps
      # unreachable if action is never "done" -- genuinely infinite

  # The fix: an explicit max_steps guard that fails loudly instead.
  def run_agent(get_next_action, max_steps):
      steps = 0
      while steps < max_steps:
          action = get_next_action(steps)
          steps += 1
          if action == "done":
              return steps
      raise RuntimeError(f"agent exceeded max_steps={max_steps} without finishing")

  def never_done(steps):
      return "keep_going"

  try:
      run_agent(never_done, max_steps=5)
  except RuntimeError as e:
      print(f"caught: {e}")
starter_code: |
  def run_agent(get_next_action):
      steps = 0
      while True:
          action = get_next_action(steps)
          steps += 1
          if action == "done":
              return steps
          if steps > 3:               # a workaround, not a real fix -- still unbounded in general
              return "gave up silently"

  def never_done(steps):
      return "keep_going"

  print(run_agent(never_done))
challenge: |
  Rewrite `run_agent` to take an explicit `max_steps` parameter and
  raise a RuntimeError ("agent exceeded max_steps=5 without finishing")
  once that many steps have run, instead of silently giving up with a
  string return value -- call it with `max_steps=5`, catch the
  RuntimeError, and print "caught: agent exceeded max_steps=5 without
  finishing".
expected_output: |
  caught: agent exceeded max_steps=5 without finishing
hints:
  - "def run_agent(get_next_action, max_steps): while steps < max_steps: ... raise RuntimeError(f\"agent exceeded max_steps={max_steps} without finishing\")"
  - "Wrap the call in try/except RuntimeError as e, printing f\"caught: {e}\"."
