id: data_structures_04
title: "The k Smallest Items Without a Full Sort"
language: python
level: 16
objective: "Use heapq.nsmallest instead of sorting an entire list just to read off the first few items."
explanation: |
  sorted(data)[:k] sorts the *entire* list in O(n log n) just to throw
  most of it away. heapq.nsmallest(k, data) (and nlargest) does the same
  job in O(n log k), which matters once data gets large and k stays
  small.
example_code: |
  import heapq
  data = [9, 1, 8, 2, 7, 3]
  print(heapq.nlargest(2, data))
starter_code: |
  scores = [42, 7, 19, 3, 88, 15]
  smallest_three = sorted(scores)[:3]
  print(smallest_three)
challenge: |
  Rewrite this using heapq.nsmallest(3, scores) instead of a full sort,
  keeping the same output.
expected_output: |
  [3, 7, 15]
hints:
  - "import heapq"
  - "heapq.nsmallest(3, scores) returns the 3 smallest values, already sorted."
xp_reward: 10
achievement: null
category: data_structures
category_level: 4
difficulty: core
contains_patterns:
  - "heapq"
concept_tags: [heapq, algorithms]
