  print(is_honker(Car()))
challenge: |
  Fix this by defining a `@runtime_checkable` `Honker(Protocol)` with a
  `honk(self) -> str` method, and checking with `isinstance(obj,
  Honker)` instead of `hasattr(obj, "honk")`. Keep the same output:
  True.
expected_output: |
  True
hints:
  - "from typing import Protocol, runtime_checkable, then @runtime_checkable above class Honker(Protocol): def honk(self) -> str: ..."
  - "isinstance(obj, Honker) checks the object's structural shape against the Protocol -- a real, reusable, named type instead of an ad-hoc attribute probe."
