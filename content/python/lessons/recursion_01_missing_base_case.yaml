id: recursion_01
title: "The Countdown That Never Stopped"
language: python
level: 51
objective: "Fix infinite recursion caused by a missing base case."
explanation: |
  Every recursive function needs at least one base case -- a condition
  where it stops calling itself and just returns. Without one, each call
  makes another call, forever, until Python's recursion limit is hit and
  a RecursionError is raised. The fix is always the same shape: check for
  the stopping condition first, and return directly instead of recursing
  further.
example_code: |
  def countdown(n):
      if n < 0:
          return
      print(n)
      countdown(n - 1)

  countdown(2)
starter_code: |
  def countdown(n):
      print(n)
      countdown(n - 1)

  countdown(3)
challenge: |
  This recurses forever (n keeps decreasing past 0 into negative
  numbers) until it hits a RecursionError. Add a base case so it stops
  right after printing 0, producing: 3, 2, 1, 0.
expected_output: |
  3
  2
  1
  0
hints:
  - "Every recursive function needs a condition that stops it from calling itself again."
  - "Add `if n == 0: return` after printing, before the recursive call."
xp_reward: 10
achievement: null
category: recursion
category_level: 1
difficulty: gotcha
contains_patterns:
  - "if n == 0"
concept_tags: [recursion, base_case, gotchas]
