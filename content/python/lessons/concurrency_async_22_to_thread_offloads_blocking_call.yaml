  import asyncio, time

  async def other_task(log):
      log.append("other started")
      await asyncio.sleep(0.001)
      log.append("other finished")

  async def blocked(log):
      time.sleep(0.05)
      log.append("blocking done")

  async def main():
      log = []
      await asyncio.gather(blocked(log), other_task(log))
      print(log)

  asyncio.run(main())
challenge: |
  Fix `blocked` so it uses `await asyncio.to_thread(time.sleep, 0.05)`
  instead of calling `time.sleep(0.05)` directly. It should print
  `['other started', 'other finished', 'blocking done']`, not
  `['blocking done', 'other started', 'other finished']`.
expected_output: |
  ['other started', 'other finished', 'blocking done']
hints:
  - "await asyncio.to_thread(time.sleep, 0.05), instead of a direct, unawaited time.sleep(0.05) call."
  - "A coroutine only yields control at an await point -- a genuinely blocking call has none, so it freezes the WHOLE event loop, not just the one coroutine running it."
