challenge: |
  Fix `demo` so `pool = asyncio.Semaphore(2)` is used instead of
  `asyncio.Lock()`. It should print `2`, not `1`.
expected_output: |
  2
hints:
  - "Change pool = asyncio.Lock() to pool = asyncio.Semaphore(2)."
  - "asyncio.Lock only ever allows one coroutine into the section at once -- asyncio.Semaphore(n) allows up to n concurrently, correctly modeling a bounded pool bigger than 1."
