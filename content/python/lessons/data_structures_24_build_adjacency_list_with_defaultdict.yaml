challenge: |
  Rewrite `build_adjacency` using `collections.defaultdict(list)`,
  instead of the manual existence check. Keep the same output:
  {'A': ['B', 'C'], 'B': ['D']}.
expected_output: |
  {'A': ['B', 'C'], 'B': ['D']}
hints:
  - "from collections import defaultdict, then graph = defaultdict(list), with no if-check needed before appending."
  - "Return dict(graph) at the end if you want a plain dict in the printed output rather than a defaultdict repr."
