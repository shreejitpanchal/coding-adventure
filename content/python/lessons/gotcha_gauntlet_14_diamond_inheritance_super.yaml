  print(log)
challenge: |
  Fix every `__init__` in `A`, `B`, `C`, and `D` so each calls
  `super().__init__(log)` instead of a parent by name directly. It
  should print `['A', 'C', 'B', 'D']`, not `['A', 'B', 'A', 'C', 'D']`.
expected_output: |
  ['A', 'C', 'B', 'D']
hints:
  - "Replace every A.__init__(self, log) / B.__init__(self, log) / C.__init__(self, log) with super().__init__(log)."
  - "super() doesn't call \"my direct parent\" -- it calls whatever comes next in the whole hierarchy's single linearized MRO, so each __init__ along the chain runs exactly once."
