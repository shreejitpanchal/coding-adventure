challenge: |
  Fix this by changing `ALLOWED_ROLES` to `frozenset({"admin",
  "editor", "viewer"})`, instead of a plain mutable `set`. It should
  print `rejected` then `False`, not `mutated` then `True`.
expected_output: |
  rejected
  False
hints:
