id: idioms_gotchas_04
title: "0.1 + 0.2 Is Not Quite 0.3"
language: python
level: 4
objective: "Fix a floating-point equality check that fails due to binary representation error, without changing the numbers involved."
explanation: |
  Python's `float` is IEEE-754 double-precision binary floating-point --
  the same representation nearly every mainstream language uses. Binary
  floating-point can represent any value that's a sum of powers of two
  (0.5, 0.25, 0.125, ...) exactly, but most ordinary decimal fractions,
  including 0.1 and 0.2, are NOT sums of powers of two -- in binary
  they're repeating fractions, the same way 1/3 is a repeating decimal in
  base 10. Since a float only has 53 bits of mantissa to work with, that
  repeating binary fraction gets truncated, and the stored value is the
  *closest representable double* to 0.1, not 0.1 itself. Add two such
  approximations together and the rounding errors don't necessarily
  cancel out -- `0.1 + 0.2` evaluates to `0.30000000000000004`, a value
  that is very close to, but not bit-for-bit equal to, the float closest
  to 0.3. This isn't a Python bug or a rare edge case; it's simply how
  binary floating-point arithmetic works everywhere, and it means `==`
  is almost never the right tool for comparing floats that arrived at
  their values through any arithmetic at all.

  The standard fix is a tolerance-based comparison instead of exact
  equality: "are these two numbers close enough, within some acceptable
  margin?" `math.isclose(a, b)` does exactly that, using a sensible
  relative tolerance by default (about 1e-9), which scales appropriately
  whether you're comparing numbers near 1 or near 1,000,000. For code
  that genuinely needs exact decimal arithmetic -- money is the classic
  example, where a rounding error of a fraction of a cent is
  unacceptable -- the right tool isn't a smarter float comparison at
  all, it's switching representations entirely to `decimal.Decimal`,
  which stores numbers in base 10 and avoids this class of error from
  the start.
example_code: |
  # The trap: exact equality on values that arrived via arithmetic.
  print(0.1 + 0.2 == 0.3)              # False
  print(0.1 + 0.2)                     # 0.30000000000000004

  # Fix: tolerance-based comparison.
  import math
  print(math.isclose(0.1 + 0.2, 0.3))  # True
  print(math.isclose(1.1 + 2.2, 3.3))  # True

  # For money/exact-decimal needs, change representation entirely:
  from decimal import Decimal
  print(Decimal("0.1") + Decimal("0.2") == Decimal("0.3"))  # True
starter_code: |
  total = 0.1 + 0.2
  if total == 0.3:
      print("equal")
  else:
      print("not equal")
challenge: |
  total is actually 0.30000000000000004, so the exact `==` check fails.
  Fix the comparison (not the numbers) so it correctly recognizes total as
  close enough to 0.3, printing "equal".
expected_output: |
  equal
hints:
  - "Binary floats can't represent 0.1 or 0.2 exactly."
  - "Replace the == comparison with math.isclose(total, 0.3)."
xp_reward: 10
achievement: null
category: idioms_gotchas
category_level: 4
difficulty: gotcha
contains_patterns:
  - "isclose"
concept_tags: [floats, precision, gotchas]
