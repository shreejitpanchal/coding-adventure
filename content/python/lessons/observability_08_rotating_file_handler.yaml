challenge: |
  Fix this by importing `logging.handlers` and using
  `logging.handlers.RotatingFileHandler(path, maxBytes=1000,
  backupCount=3)` instead of `logging.FileHandler(path)`. It should
  print `True`, not `False`.
expected_output: |
  True
