challenge: |
  Fix `process_all` so it submits each item individually with
  `pool.submit(risky, n)`, then handles each future's exception
  separately via `as_completed` and a per-future `try/except
  ValueError:`, instead of using `pool.map(...)`. It should print
  `[10, None, 30]`, not `crashed, lost the results for 1 and 3 too`.
expected_output: |
  [10, None, 30]
hints:
  - "futures = {pool.submit(risky, n): n for n in nums}, then for future in as_completed(futures): try: results[n] = future.result() except ValueError: results[n] = None."
  - "map() collects results in order and propagates the FIRST exception it hits, discarding every other result -- submitting individually lets each future's success or failure be handled on its own."
