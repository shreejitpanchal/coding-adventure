challenge: |
  Fix this by creating `barrier = threading.Barrier(2)` and having
  both `worker_a` and `worker_b` call `barrier.wait()` right before
  appending their `"-passed"` entry. It should print `False`, not
  `True`.
expected_output: |
  False
