id: idioms_gotchas_14
title: "** Is Right-Associative -- It Groups From the Top Down"
language: python
level: 83
objective: "Fix a function assuming ** groups left-to-right like most other operators, when it's actually right-associative -- 2 ** 3 ** 2 means 2 ** (3 ** 2), not (2 ** 3) ** 2."
explanation: |
  Almost every other binary operator in Python groups left to right
  (`10 - 3 - 2` is `(10 - 3) - 2`), which makes it easy to assume `**`
  works the same way -- but exponentiation is right-associative
  specifically, since that matches the mathematical convention for
  towers of exponents. `2 ** 3 ** 2` means `2 ** (3 ** 2)` (`2 ** 9` =
  `512`), not `(2 ** 3) ** 2` (`8 ** 2` = `64`) -- a completely
  different number, from the same-looking expression.

  The bug this exercise fixes assumes left-to-right grouping and
  computes `(2 ** 3) ** 2` explicitly. The fix uses the real
  right-associative chain `2 ** 3 ** 2`.
example_code: |
  # The trap: assumes ** groups left-to-right, like subtraction does.
  def power_tower_trap():
      return (2 ** 3) ** 2

  print(power_tower_trap())
  # 64 -- this is NOT what 2 ** 3 ** 2 actually evaluates to

  # The fix: ** is right-associative -- write the real chain.
  def power_tower():
      return 2 ** 3 ** 2

  print(power_tower())
  # 512 -- correctly 2 ** (3 ** 2), matching how ** actually associates
starter_code: |
  def power_tower():
      return (2 ** 3) ** 2

  print(power_tower())
challenge: |
  Fix `power_tower` so it returns `2 ** 3 ** 2` directly (no extra
  parentheses forcing left-to-right grouping). It should print `512`,
  not `64`.
expected_output: |
  512
hints:
  - "Remove the parentheses: return 2 ** 3 ** 2."
  - "** groups right-to-left -- 2 ** 3 ** 2 is 2 ** (3 ** 2) = 2 ** 9 = 512, not (2 ** 3) ** 2 = 64."
