id: gotcha_gauntlet_04
title: "The Price That Rounded the Wrong Way"
language: python
level: 33
objective: "Fix an unreliable float rounding result by switching to Decimal for money-like precision."
explanation: |
  Python's `float` type stores numbers in IEEE-754 binary
  floating-point, which can represent most integers and many simple
  fractions exactly, but *cannot* exactly represent most decimal
  fractions -- the same way `1/3` has no exact finite decimal
  representation, `2.675` has no exact finite *binary* representation.
  It gets stored as the nearest representable binary value, which turns
  out to be very slightly *less* than the true 2.675 (something like
  2.67499999999999982236431605997495353221893310546875 under the
  hood). So when `round(2.675, 2)` looks at that stored value to decide
  which way to round, it's actually rounding a number that's a hair
  below 2.675, and correctly rounds *that* down to 2.67 -- correct
  given what's actually stored, but not what a human expects from
  "round 2.675 to two decimal places," which intuitively should give
  2.68. This isn't a bug in `round()` -- it's an inherent, unavoidable
  consequence of representing decimal fractions in binary at all, and
  it affects far more values than just 2.675.

  For anything where exact decimal behavior actually matters -- money
  being the canonical example, since a system that silently rounds
  currency the wrong way is a real, auditable problem, not just a
  cosmetic one -- the fix is to stop using binary floats entirely and
  use `decimal.Decimal` instead, which stores numbers in base 10
  internally and so represents decimal fractions like `2.675` exactly,
  with no representation error to round incorrectly from. The critical
  detail: `Decimal` must be constructed from a *string* (`Decimal
  ("2.675")`), never from a `float` (`Decimal(2.675)`) -- constructing
  from a float just imports that float's *already-corrupted* binary
  approximation into a Decimal, defeating the entire purpose.
  `.quantize(Decimal("0.01"), rounding=ROUND_HALF_UP)` then rounds to
  exactly two decimal places using an explicit, named rounding rule
  (`ROUND_HALF_UP` matches the "round half away from zero" convention
  most people learned in school; Python's own `round()` actually uses
  banker's rounding, round-half-to-even, by default, which is a second,
  separate source of "unexpected" rounding results worth knowing about
  even when the value being rounded happens to be exactly representable).
example_code: |
  # The trap: 2.675 isn't exactly representable in binary float.
  price_wrong = 2.675
  print(round(price_wrong, 2))       # 2.67 -- NOT 2.68, due to binary representation

  # Proof it's a representation issue, not a round() bug:
  print(f"{2.675:.20f}")             # 2.67499999999999982236 -- already less than 2.675!

  # Fix: Decimal, constructed from a STRING (never from a float).
  from decimal import Decimal, ROUND_HALF_UP

  price = Decimal("9.995")
  print(price.quantize(Decimal("0.01"), rounding=ROUND_HALF_UP))   # 10.00

  correct = Decimal("2.675").quantize(Decimal("0.01"), rounding=ROUND_HALF_UP)
  print(correct)                     # 2.68 -- exact decimal rounding

  # The trap within the trap: constructing Decimal FROM a float imports the error.
  wrong_construction = Decimal(2.675)     # imports the corrupted binary value!
  print(wrong_construction)               # 2.67499999999999982236431605997495353221893310546875
starter_code: |
  price = 2.675
  rounded = round(price, 2)
  print(rounded)
challenge: |
  round(2.675, 2) unreliably gives 2.67 due to binary float
  representation. Rewrite this using decimal.Decimal (constructed from
  the string "2.675") with quantize(..., rounding=ROUND_HALF_UP) so it
  reliably prints 2.68.
expected_output: |
  2.68
hints:
  - "from decimal import Decimal, ROUND_HALF_UP"
  - "Decimal(\"2.675\").quantize(Decimal(\"0.01\"), rounding=ROUND_HALF_UP)"
