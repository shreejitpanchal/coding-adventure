challenge: |
  Fix `Transaction` by resetting `self.pending = []` inside
  `__enter__`, so each `with` block starts from a clean slate. It
  should print `committed: ['insert A']` then `committed: ['insert B']`,
  not `committed: ['insert A', 'insert B']` on the second line.
expected_output: |
  committed: ['insert A']
  committed: ['insert B']
hints:
  - "Add self.pending = [] as the first line inside __enter__, right before return self."
  - "A with block ending doesn't automatically reset anything on the context manager instance -- whatever __enter__ doesn't explicitly clear is still there the next time the same instance is reused."
