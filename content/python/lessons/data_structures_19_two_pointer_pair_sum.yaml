challenge: |
  Rewrite `has_pair_sum` using the two-pointer technique instead of a
  nested loop. Keep the same output: True.
expected_output: |
  True
hints:
  - "left, right = 0, len(sorted_nums) - 1, then while left < right: check the sum, and move left up or right down depending on whether it's too small or too large."
  - "Since the list is sorted, moving left forward only ever increases the sum, and moving right backward only ever decreases it -- that's what lets each pointer move just once."
