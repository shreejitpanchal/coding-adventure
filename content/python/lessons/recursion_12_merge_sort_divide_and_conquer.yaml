id: recursion_12
title: "Merge Sort: Split in Half Recursively, Merge the Sorted Halves Back Together"
language: python
level: 452
objective: "Fix a sort stub that returns the input unchanged, when merge sort recursively sorts each half of the list independently, then merges the two already-sorted halves back together in order -- a classic divide-and-conquer recursive algorithm."
explanation: |
  Merge sort is the canonical divide-and-conquer recursive algorithm:
  split the list into two roughly equal halves, recursively sort each
  half completely on its own (the exact same problem, on a smaller
  input), then merge the two already-sorted halves back into one fully
  sorted list. Merging two already-sorted lists is itself simple and
  non-recursive -- walk both with two pointers, always taking whichever
  front element is smaller, until one side runs out, then append
  whatever's left of the other. The base case is a list of length 0 or
  1, which is trivially already sorted on its own.

  The fix implements the actual split-recurse-merge structure, instead
  of returning the input unchanged.
example_code: |
  # The trap: doesn't sort anything at all -- just returns the input unchanged.
  def merge_sort_trap(items):
      return items

  print(merge_sort_trap([5, 2, 4, 1, 3]))
  # [5, 2, 4, 1, 3] -- WRONG, completely unsorted

  # The fix: split in half, recursively sort each half, merge them back together.
  def merge(left, right):
      result = []
      i = j = 0
      while i < len(left) and j < len(right):
          if left[i] <= right[j]:
              result.append(left[i])
              i += 1
          else:
              result.append(right[j])
              j += 1
      result.extend(left[i:])
      result.extend(right[j:])
      return result

  def merge_sort(items):
      if len(items) <= 1:
          return items
      mid = len(items) // 2
      left = merge_sort(items[:mid])
      right = merge_sort(items[mid:])
      return merge(left, right)

  print(merge_sort([5, 2, 4, 1, 3]))
  # [1, 2, 3, 4, 5] -- correctly sorted via recursive divide-and-conquer
