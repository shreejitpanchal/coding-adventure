  def merge_sort(items):
      return items

  print(merge_sort([5, 2, 4, 1, 3]))
challenge: |
  Fix `merge_sort` so its base case (`len(items) <= 1`) returns
  `items` unchanged, and otherwise splits `items` at the midpoint,
  recursively sorts each half, and returns `merge(left, right)`. It
  should print `[1, 2, 3, 4, 5]`, not `[5, 2, 4, 1, 3]`.
expected_output: |
  [1, 2, 3, 4, 5]
hints:
  - "if len(items) <= 1: return items, then: mid = len(items) // 2; left = merge_sort(items[:mid]); right = merge_sort(items[mid:]); return merge(left, right)."
  - "merge() already correctly combines two SORTED lists -- the recursion's whole job is making sure both halves are genuinely sorted before merge() ever sees them."
