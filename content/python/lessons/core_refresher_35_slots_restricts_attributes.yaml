challenge: |
  Fix `Point` by adding `__slots__ = ("x", "y")`. It should print
  `False`, not `True`.
expected_output: |
  False
hints:
  - "Add __slots__ = (\"x\", \"y\") as the first line inside the class body, before __init__."
  - "Declaring __slots__ removes the per-instance __dict__ entirely -- only the exact names listed can ever be assigned to an instance."
