  - id: q53
    question: "What problem does memoization (e.g. via std::unordered_map) solve in naive recursive Fibonacci?"
    options:
      - "It makes the recursion use less stack space"
      - "It avoids exponential recomputation of overlapping subproblems by caching each result the first time it's computed"
      - "It removes the need for a base case"
      - "It converts the recursion into a loop automatically"
    correct: 1
    explanation: "Naive recursive Fibonacci recomputes the same subproblems repeatedly; caching turns exponential time into linear."
    concept_tags: [recursion, memoization, performance]

  - id: q54
    question: "What makes a recursive call a 'tail call'?"
    options:
      - "The function has more than one recursive call"
      - "The recursive call is the very last operation the function performs, with no pending work left to do when it returns"
      - "The function uses an accumulator parameter of any kind"
      - "The recursion depth is small"
    correct: 1
    explanation: "An accumulator parameter carries the running result forward before the call, making the recursive call itself the last operation."
