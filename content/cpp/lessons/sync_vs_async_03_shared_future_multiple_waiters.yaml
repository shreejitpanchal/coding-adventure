id: sync_vs_async_03
title: "One Result, Two Readers"
language: cpp
level: 33
objective: "Convert a std::future to a std::shared_future via .share() so more than one piece of code can independently retrieve its result."
explanation: |
  `std::future<T>`'s copy constructor is deliberately deleted -- a `
  future` represents a single, exclusively-owned handle to a result,
  the same "unique ownership" philosophy `std::unique_ptr` applies to
  heap allocations elsewhere in this app. That exclusivity is exactly
  why `.get()` is a single-use, consuming operation (covered in a
  neighboring exercise): there's only ever one owner of the future's
  result, so there's no ambiguity about whether it's still available.
  `int a = fut.get(); int b = fut.get();` on a plain `std::future<int>`
  hits exactly this limitation -- the first `.get()` consumes the
  result, and the second throws `std::future_error`, regardless of
  whether the calling code intends both calls as "the same code reading
  the value twice" or something else entirely; the future simply has
  nothing left to give after the first read.

  `std::shared_future<T>` is the standard library's purpose-built
  answer for when multiple independent readers genuinely need access
  to the *same* eventual result -- it's created by calling `.share()`
  on a plain `std::future` (which transfers, rather than copies, the
  underlying shared state into the new `shared_future`), and unlike `
  std::future`, `shared_future` *is* copyable, and `.get()` can be
  called on it -- or on any of its copies -- as many times as needed, by
  as many separate holders as needed, all safely retrieving the same
  result. This mirrors the naming and relationship of `std::unique_ptr`
  versus `std::shared_ptr` for heap ownership: exclusive single-owner
  semantics by default, with an explicit opt-in (`.share()`, or `std::
  shared_ptr`'s own constructor) when the actual requirement is
  multiple independent holders of the same thing.
example_code: |
  #include <iostream>
  #include <future>

  // The trap: a plain future can only be read ONCE -- a second get() throws.
  std::future<int> futBroken = std::async(std::launch::async, []() { return 7; });
  // int a = futBroken.get();
  // int b = futBroken.get();   // throws -- the result was already consumed by the first call!

  // Fix: .share() converts it to a shared_future -- readable multiple times.
  int main() {
      std::shared_future<int> fut = std::async(std::launch::async, []() { return 7; }).share();
      int a = fut.get();          // both calls succeed --
      int b = fut.get();           // shared_future can be read repeatedly
      std::cout << a << " " << b << std::endl;   // 7 7
      return 0;
  }

  auto task = []() { return 7; };
  std::shared_future<int> fut2 = std::async(std::launch::async, task).share();
  std::cout << fut2.get() << " " << fut2.get() << std::endl;   // 7 7
starter_code: |
  #include <iostream>
  #include <future>
  int main() {
      std::future<int> fut = std::async(std::launch::async, []() { return 7; });
      int a = fut.get();
      int b = fut.get();
      std::cout << a << " " << b << std::endl;
      return 0;
  }
challenge: |
  fut.get() is called twice on a plain std::future, which throws on the
  second call since get() consumes the result. Fix this by converting
  fut to a std::shared_future<int> (via .share() on the result of
  std::async), which allows both get() calls to succeed, keeping the
  output "7 7".
expected_output: |
  7 7
hints:
  - "std::future can only be read once -- std::shared_future (via .share()) supports being read multiple times."
  - "std::shared_future<int> fut = std::async(std::launch::async, []() { return 7; }).share();"
