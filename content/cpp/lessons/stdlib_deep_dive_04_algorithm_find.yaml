id: stdlib_deep_dive_04
title: "Manual Search Loop to std::find"
language: cpp
level: 19
objective: "Replace a manual search loop with std::find from <algorithm>."
explanation: |
  A manual loop checking each element against a target reinvents
  std::find, which does the same linear scan but expresses the intent
  directly ("find this value") and returns an iterator you can compare
  against `.end()` to know whether it was found.
example_code: |
  #include <algorithm>
  bool found = std::find(v.begin(), v.end(), target) != v.end();
starter_code: |
  #include <iostream>
  #include <vector>
  int main() {
      std::vector<int> nums = {10, 20, 30, 40};
      int target = 30;
      bool found = false;
      for (size_t i = 0; i < nums.size(); i++) {
          if (nums[i] == target) {
              found = true;
              break;
          }
      }
      std::cout << found << std::endl;
      return 0;
  }
challenge: |
  Rewrite this using std::find from <algorithm> instead of a manual
  search loop, keeping the same output: 1 (true).
expected_output: |
  1
hints:
  - "#include <algorithm>"
  - "bool found = std::find(nums.begin(), nums.end(), target) != nums.end();"
xp_reward: 10
achievement: null
category: stdlib_deep_dive
category_level: 4
difficulty: core
contains_patterns:
  - "std::find"
concept_tags: [algorithms, searching]
