id: functional_programming_02
title: "The Function Pointer That Couldn't Hold a Lambda"
language: cpp
level: 37
objective: "Use std::function instead of a raw function pointer, so a parameter can hold a lambda that captures variables."
explanation: |
  A raw function pointer, `int (*f)(int)`, is fundamentally just an
  address -- the memory location of a plain function's compiled code,
  with nothing else attached to it. That works fine for a plain
  function or a *non-capturing* lambda (a lambda with an empty `[]`
  capture list, which has no state of its own to remember, and is
  specifically permitted by the standard to implicitly convert to a
  bare function pointer for exactly this reason). But `[bonus](int x) {
  return x + bonus; }` captures `bonus` -- it needs somewhere to
  actually *store* that captured value, and a plain function pointer,
  being just an address with no attached storage, has nowhere to put
  it. A capturing lambda is, under the hood, its own distinct compiler-
  generated class type, with `bonus` as one of its (typically hidden)
  member variables -- it simply cannot be represented as a bare
  function pointer at all, regardless of how the parameter type is
  written, which is exactly why `applyTwice`'s `int (*f)(int)`
  parameter fails to compile against a capturing lambda argument.

  `std::function<Signature>` (from `<functional>`) solves this by being
  a *type-erased* wrapper -- rather than storing a raw address the way
  a function pointer does, it can hold any callable at all that matches
  the given signature (`int(int)` here: takes an `int`, returns an `int`
  ), regardless of what that callable actually *is* internally --
  a plain function, a non-capturing lambda, a capturing lambda with its
  own stored state, even a functor struct with `operator()`. `std::
  function` manages whatever internal storage the wrapped callable
  needs (allocating it if necessary) and presents a single, uniform
  interface (`operator()`) to invoke it, regardless of the concrete
  type underneath. This is precisely why `std::function<int(int)>` is
  the right parameter type for `applyTwice` once it needs to accept
  *any* kind of callable, including ones with captured state -- it's
  the general-purpose "any callable matching this signature" type,
  where a raw function pointer only ever covers the narrower "callable
  with no state" case.
example_code: |
  #include <iostream>
  #include <functional>

  // The trap: a raw function pointer can't hold a lambda that captures anything.
  int applyTwiceBroken(int (*f)(int), int x) {
      return f(f(x));
  }
  int bonusBroken = 3;
  // applyTwiceBroken([bonusBroken](int x) { return x + bonusBroken; }, 10);
  // -- FAILS TO COMPILE: a capturing lambda can't decay to a function pointer

  // Fix: std::function can hold ANY callable matching the signature, capturing or not.
  int applyTwice(std::function<int(int)> f, int x) {
      return f(f(x));
  }

  int main() {
      int bonus = 3;
      std::cout << applyTwice([bonus](int x) { return x + bonus; }, 10) << std::endl;
      // 10+3=13, 13+3=16
      return 0;
  }
  // 16

  // std::function equally accepts a plain function or a non-capturing lambda too:
  int addOne(int x) { return x + 1; }
  std::cout << applyTwice(addOne, 5) << std::endl;                   // 7
  std::cout << applyTwice([](int x) { return x * 2; }, 3) << std::endl;   // 12
starter_code: |
  #include <iostream>
  int applyTwice(int (*f)(int), int x) {
      return f(f(x));
  }
  int main() {
      int bonus = 3;
      std::cout << applyTwice([bonus](int x) { return x + bonus; }, 10) << std::endl;
      return 0;
  }
challenge: |
  applyTwice takes a raw function pointer, but the lambda passed to it
  captures bonus -- a capturing lambda can't decay to a function
  pointer, so this fails to compile. Fix this by changing applyTwice's
  parameter type to std::function<int(int)>, which can hold a capturing
  lambda, keeping the output 16 (10+3=13, 13+3=16).
expected_output: |
  16
hints:
  - "A capturing lambda is not a plain function pointer -- it has its own storage for the captured variable."
  - "#include <functional>, then change the parameter type to std::function<int(int)> f."
