id: events_05
title: "The Event That Forgot What Happened"
language: spring
level: 20
objective: "Give a custom ApplicationEvent subclass an actual payload field and getter, so listeners can find out what happened, not just that something did."
explanation: |
  Extending `ApplicationEvent` immediately grants access to Spring's
  built-in event infrastructure -- a timestamp of when the event was
  created, the `source` object that triggered it, and integration with
  the whole publish/listen dispatch mechanism covered elsewhere in this
  category. But none of that built-in infrastructure has any idea what
  a *particular* event's application-specific content should be -- an
  order ID, a tracking number, a purchase amount -- because that
  content is entirely specific to the meaning of the custom event being
  defined, not something `ApplicationEvent` could possibly know about
  generically. `ShipmentEvent`'s constructor here *receives* `
  trackingNumber` as a parameter, but never actually stores it anywhere
  -- it's used only to satisfy the constructor's own parameter list and
  then discarded the instant the constructor returns, since nothing
  assigns it to a field.

  The result is an event that carries no genuinely useful payload at
  all: a listener receiving this `ShipmentEvent` can tell *that* a
  shipment event happened (the type itself carries that much
  information), but has absolutely no way to find out *which* shipment
  -- there's no field to read the tracking number back from, so `
  ShipmentListener` is forced to hardcode `"unknown"` as a placeholder,
  since the real value was never preserved anywhere accessible. The fix
  follows the standard shape for adding a payload to any custom event:
  declare a field for the actual content (`private final String
  trackingNumber;`), assign it from the constructor parameter (`this.
  trackingNumber = trackingNumber;`, immediately after the mandatory `
  super(source)` call to properly initialize the `ApplicationEvent`
  base class), and expose it through a public getter (`getTracking
  Number()`) so listeners can actually retrieve it. Only with all three
  pieces in place does the event genuinely communicate *what happened*,
  not merely *that something happened* -- the entire point of giving an
  event a payload in the first place.
example_code: |
  package com.codingadventure.exercise;

  import org.springframework.context.ApplicationEvent;

  // The trap: the constructor receives the payload but never actually STORES it.
  class ShipmentEventBroken extends ApplicationEvent {
      public ShipmentEventBroken(Object source, String trackingNumber) {
          super(source);
          // trackingNumber is discarded here -- never assigned to a field!
      }
      // no getter possible -- there's no field to expose
  }
  // any listener receiving this event has NO way to find out which shipment it was

  // Fix: store the payload in a field, expose it via a getter.
  class ShipmentEvent extends ApplicationEvent {
      private final String trackingNumber;

      public ShipmentEvent(Object source, String trackingNumber) {
          super(source);                              // initializes the ApplicationEvent base
          this.trackingNumber = trackingNumber;         // actually preserves the payload
      }

      public String getTrackingNumber() {
          return trackingNumber;                        // listeners can now retrieve it
      }
  }

  import org.springframework.context.event.EventListener;
  import org.springframework.stereotype.Component;

  @Component
  class ShipmentListener {
      static String lastTrackingNumber = null;

      @EventListener
      public void onShipment(ShipmentEvent event) {
          lastTrackingNumber = event.getTrackingNumber();   // reads the REAL value now
      }
  }
  // service.ship("TRACK-123") -> ShipmentListener.lastTrackingNumber becomes "TRACK-123"
starter_code: |
  package com.codingadventure.exercise;

  import org.springframework.beans.factory.annotation.Autowired;
  import org.springframework.context.ApplicationEvent;
  import org.springframework.context.ApplicationEventPublisher;
  import org.springframework.context.event.EventListener;
  import org.springframework.stereotype.Component;

  class ShipmentEvent extends ApplicationEvent {
      public ShipmentEvent(Object source, String trackingNumber) {
          super(source);
      }
  }

  @Component
  class ShipmentService {
      @Autowired
      private ApplicationEventPublisher publisher;
      public void ship(String trackingNumber) {
          publisher.publishEvent(new ShipmentEvent(this, trackingNumber));
      }
  }

  @Component
  class ShipmentListener {
      static String lastTrackingNumber = null;

      @EventListener
      public void onShipment(ShipmentEvent event) {
          lastTrackingNumber = "unknown";
      }
  }
challenge: |
  ShipmentEvent's constructor receives trackingNumber but never stores
  it, so there's no way for any listener to actually retrieve it --
  ShipmentListener has to hardcode "unknown" since the real value is
  lost. Fix this by adding a trackingNumber field to ShipmentEvent (set
  in the constructor) with a getTrackingNumber() getter, and update
  ShipmentListener to read event.getTrackingNumber() instead of
  hardcoding a placeholder.
expected_output_pattern: "BUILD SUCCESS"
hints:
  - "ShipmentEvent's constructor receives trackingNumber as a parameter but never saves it anywhere."
  - "Add a private final String trackingNumber; field, set via this.trackingNumber = trackingNumber; in the constructor, and a getTrackingNumber() getter."
