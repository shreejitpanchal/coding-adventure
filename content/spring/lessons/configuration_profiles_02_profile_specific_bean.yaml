category: configuration_profiles
category_level: 2
difficulty: core
contains_patterns:
  - '@Profile\("dev"\)'
  - '@Profile\("prod"\)'
concept_tags: [configuration, profiles, environment_specific_beans]
spring_test_code: |
  package com.codingadventure.exercise;

  import org.junit.jupiter.api.Test;
  import org.springframework.context.annotation.AnnotationConfigApplicationContext;
  import static org.assertj.core.api.Assertions.assertThat;

  public class MailServiceTest {
      @Test
      void devProfileSelectsDevMailService() {
          try (AnnotationConfigApplicationContext ctx = new AnnotationConfigApplicationContext()) {
              ctx.getEnvironment().setActiveProfiles("dev");
              ctx.register(DevMailService.class, ProdMailService.class);
              ctx.refresh();
              MailService service = ctx.getBean(MailService.class);
              assertThat(service.send("ada@example.com")).isEqualTo("LOGGED (dev): mail to ada@example.com");
          }
      }
  }
