id: resilience_05
title: "The Retry That Kept Hammering a Circuit That Should Have Stopped It"
language: spring
level: 30
objective: "Fix the decoration order of a combined CircuitBreaker + Retry so the circuit breaker sits inside the retry, letting it actually stop repeated attempts from reaching a failing dependency."
explanation: |
  Combining a circuit breaker and a retry around the same underlying
  call is a genuinely common resilience pattern -- but *decoration
  order* between the two matters far more than it might look, because
  it determines what each decorator actually *observes*. `CircuitBreaker
  .decorateSupplier(cb, Retry.decorateSupplier(retry, risky))` nests
  the retry *inside* the circuit breaker: from the circuit breaker's
  point of view, the thing it's wrapping is "the retry-decorated
  supplier," a single unit that internally may make several attempts
  before finally settling on one outcome -- success, or failure once
  every retry attempt is exhausted. The breaker never sees the
  individual attempts at all, only that one final, already-resolved
  outcome per logical call. That means the breaker's sliding window
  fills up far too slowly to ever actually protect anything: every
  individual retry attempt still genuinely reaches the failing
  dependency internally, invisible to the breaker, which only records
  one outcome no matter how many attempts happened underneath it.

  Flipping the order -- `Retry.decorateSupplier(retry, CircuitBreaker.
  decorateSupplier(cb, risky))`, retry *outside*, circuit breaker
  *inside* -- changes what each layer actually observes. Now the retry
  is the one repeatedly invoking "the circuit-breaker-decorated
  supplier," which means *each individual retry attempt* passes through
  the circuit breaker separately, and the breaker records *each one*
  as its own distinct outcome in its sliding window. Once enough of
  those individually-recorded failures cross the breaker's threshold,
  it opens -- and any *subsequent* retry attempt, still within the same
  overall retry sequence, now hits the now-open breaker and fails
  immediately with `CallNotPermittedException`, without ever reaching
  the real failing dependency again. The general principle worth
  internalizing: whichever decorator is applied *outermost* determines
  what unit of work the *inner* decorator perceives as "one call" --
  getting that nesting backward silently defeats the inner decorator's
  entire purpose, even though both configurations compile and run
  without any error.
example_code: |
  package com.codingadventure.exercise;

  import io.github.resilience4j.circuitbreaker.CircuitBreaker;
  import io.github.resilience4j.retry.Retry;
  import java.util.function.Supplier;

  // The trap: circuit breaker OUTSIDE the retry -- it only sees ONE outcome per logical call.
  // CircuitBreaker.decorateSupplier(circuitBreaker, Retry.decorateSupplier(retry, risky));
  // -- every individual retry attempt still genuinely reaches the failing dependency,
  //    invisible to the breaker's sliding window, which never fills up fast enough to open

  // Fix: circuit breaker INSIDE, retry OUTSIDE -- each individual attempt is recorded separately.
  Supplier<String> risky = () -> { throw new RuntimeException("downstream is down"); };
  Supplier<String> decorated = Retry.decorateSupplier(retry,
          CircuitBreaker.decorateSupplier(circuitBreaker, risky));
  // decorated.get() -- each retry attempt passes through the breaker individually;
  // once enough real failures accumulate, the breaker opens, and REMAINING retry
  // attempts fail fast with CallNotPermittedException instead of reaching `risky` again
starter_code: |
  package com.codingadventure.exercise;

  import io.github.resilience4j.circuitbreaker.CircuitBreaker;
  import io.github.resilience4j.circuitbreaker.CircuitBreakerConfig;
  import io.github.resilience4j.retry.Retry;
  import io.github.resilience4j.retry.RetryConfig;
  import org.springframework.stereotype.Component;
  import java.time.Duration;
  import java.util.function.Supplier;

  @Component
  public class PaymentGateway {
      private final CircuitBreaker circuitBreaker;
      private final Retry retry;
      public int callCount = 0;

      public PaymentGateway() {
          CircuitBreakerConfig cbConfig = CircuitBreakerConfig.custom()
              .slidingWindowSize(2)
              .failureRateThreshold(50)
              .waitDurationInOpenState(Duration.ofSeconds(30))
              .build();
          circuitBreaker = CircuitBreaker.of("payment", cbConfig);

          RetryConfig retryConfig = RetryConfig.custom()
              .maxAttempts(5)
              .waitDuration(Duration.ofMillis(1))
              .build();
          retry = Retry.of("payment", retryConfig);
      }

      public String chargeAlwaysFails() {
          Supplier<String> risky = () -> {
              callCount++;
              throw new RuntimeException("downstream is down");
          };
          Supplier<String> decorated = CircuitBreaker.decorateSupplier(circuitBreaker, Retry.decorateSupplier(retry, risky));
          return decorated.get();
      }
  }
challenge: |
  The circuit breaker wraps the retry, so the breaker only ever sees ONE
  outcome per call to chargeAlwaysFails() -- every one of the 5 retry
  attempts genuinely reaches the (simulated) failing dependency, and the
  breaker never gets a chance to open and stop them. Fix this by
  swapping the decoration order to
  Retry.decorateSupplier(retry, CircuitBreaker.decorateSupplier(circuitBreaker, risky)),
  so each individual attempt is recorded by the breaker separately --
  after 2 real failures it opens, and the remaining retry attempts fail
  fast with CallNotPermittedException instead of calling risky again,
  keeping callCount at exactly 2.
expected_output_pattern: "BUILD SUCCESS"
hints:
  - "Whichever decorator is applied LAST (outermost) sees each call the OTHER decorator lets through as a single unit -- order changes what each one actually observes."
  - "Change the decoration line to: Retry.decorateSupplier(retry, CircuitBreaker.decorateSupplier(circuitBreaker, risky));"
xp_reward: 15
achievement: resilience_master
category: resilience
category_level: 5
difficulty: deep_dive
contains_patterns:
  - "Retry\\.decorateSupplier\\(retry, CircuitBreaker\\.decorateSupplier\\(circuitBreaker, risky\\)\\)"
concept_tags: [resilience, circuit_breaker, retry, resilience4j, decorator_order]
spring_test_code: |
  package com.codingadventure.exercise;

  import io.github.resilience4j.circuitbreaker.CallNotPermittedException;
  import org.junit.jupiter.api.Test;
  import static org.assertj.core.api.Assertions.assertThat;
  import static org.assertj.core.api.Assertions.assertThatThrownBy;

  public class PaymentGatewayTest {
      @Test
      void retryFailsFastOnceCircuitBreakerOpens() {
          PaymentGateway gw = new PaymentGateway();
          assertThatThrownBy(gw::chargeAlwaysFails).isInstanceOf(CallNotPermittedException.class);
          assertThat(gw.callCount).isEqualTo(2);
      }
  }
