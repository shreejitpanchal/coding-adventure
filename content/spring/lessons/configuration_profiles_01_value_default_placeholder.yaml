spring_test_code: |
  package com.codingadventure.exercise;

  import org.junit.jupiter.api.Test;
  import org.springframework.context.annotation.AnnotationConfigApplicationContext;
  import static org.assertj.core.api.Assertions.assertThat;

  public class AppConfigTest {
      @Test
      void resolvesDefaultPlaceholderValue() {
          try (AnnotationConfigApplicationContext ctx = new AnnotationConfigApplicationContext(AppConfig.class, Greeter.class)) {
              Greeter greeter = ctx.getBean(Greeter.class);
              assertThat(greeter.greet("Ada")).isEqualTo("Hello, Ada!");
          }
      }
  }
