concept_tags: [bean_lifecycle, postconstruct, initialization, gotchas]
spring_test_code: |
  package com.codingadventure.exercise;

  import org.junit.jupiter.api.Test;
  import org.springframework.context.annotation.AnnotationConfigApplicationContext;
  import static org.assertj.core.api.Assertions.assertThat;

  public class CatalogCacheTest {
      @Test
      void warmsUpAfterDependenciesAreInjected() {
          try (AnnotationConfigApplicationContext ctx = new AnnotationConfigApplicationContext(CatalogCache.class, CatalogSource.class)) {
              CatalogCache cache = ctx.getBean(CatalogCache.class);
              assertThat(cache.summary()).isEqualTo("CACHED: catalog-data");
          }
      }
  }
