id: dependency_injection_02
title: "Two Beans, One Interface, No Way to Choose"
language: spring
level: 2
objective: "Fix a NoUniqueBeanDefinitionException by qualifying which implementation of an interface should be injected."
explanation: |
  When `AlertDispatcher`'s constructor asks Spring for an `AlertChannel`
  , the container looks through every registered bean of that type to
  find a match -- and here it finds *two*, `EmailAlert` and `SmsAlert`,
  both legitimately implementing the `AlertChannel` interface. Spring
  has no basis for guessing which one the caller actually intends, and
  deliberately doesn't try to -- silently picking one arbitrarily could
  wire in the wrong dependency with no error anywhere, a much worse
  outcome than failing loudly. Instead, the container fails fast, at
  *context-refresh time* (application startup), with `NoUniqueBean
  DefinitionException` -- a clear, immediate signal that the ambiguity
  needs to be resolved, well before the application ever handles a
  real request that might depend on this wiring being correct.

  `@Qualifier(name)` resolves exactly this kind of ambiguity by letting
  the injection point specify *which* bean it wants, by that bean's
  registered name -- `@Component("smsAlert")` on the `SmsAlert` class
  registers it under the name `"smsAlert"`, and `@Qualifier("smsAlert")`
  on `AlertDispatcher`'s constructor parameter tells Spring "when
  resolving this parameter, use specifically the bean named `smsAlert`,"
  eliminating the ambiguity between the two candidates entirely. This
  pattern generalizes beyond just two implementations -- any number of
  beans can implement the same interface, and `@Qualifier` at each
  injection point is how the application specifies, unambiguously,
  which particular implementation that specific consumer actually
  needs, independent of what any other consumer elsewhere in the
  application might be wired to.
example_code: |
  package com.codingadventure.exercise;

  import org.springframework.beans.factory.annotation.Autowired;
  import org.springframework.beans.factory.annotation.Qualifier;
  import org.springframework.stereotype.Component;

  interface AlertChannel {
      String alert(String text);
  }

  @Component("emailAlert")
  class EmailAlert implements AlertChannel {
      public String alert(String text) { return "EMAIL: " + text; }
  }

  @Component("smsAlert")
  class SmsAlert implements AlertChannel {
      public String alert(String text) { return "SMS: " + text; }
  }

  // The trap: plain @Autowired on AlertChannel is ambiguous -- TWO beans match.
  // @Component
  // class AlertDispatcherBroken {
  //     @Autowired
  //     public AlertDispatcherBroken(AlertChannel channel) { ... }
  //     // NoUniqueBeanDefinitionException at context refresh -- can't pick between the two
  // }

  // Fix: @Qualifier specifies exactly which named bean to wire in.
  @Component
  public class AlertDispatcher {
      private final AlertChannel channel;

      @Autowired
      public AlertDispatcher(@Qualifier("smsAlert") AlertChannel channel) {
          this.channel = channel;         // unambiguously wired to SmsAlert
      }

      public String dispatch(String text) {
          return channel.alert(text);
      }
  }
  // dispatcher.dispatch("server down") -> "SMS: server down"
starter_code: |
  package com.codingadventure.exercise;

  import org.springframework.beans.factory.annotation.Autowired;
  import org.springframework.stereotype.Component;

  interface AlertChannel {
      String alert(String text);
  }

  @Component("emailAlert")
  class EmailAlert implements AlertChannel {
      public String alert(String text) { return "EMAIL: " + text; }
  }

  @Component("smsAlert")
  class SmsAlert implements AlertChannel {
      public String alert(String text) { return "SMS: " + text; }
  }

  @Component
  public class AlertDispatcher {
      private final AlertChannel channel;

      @Autowired
      public AlertDispatcher(AlertChannel channel) {
          this.channel = channel;
      }

      public String dispatch(String text) {
          return channel.alert(text);
      }
  }
challenge: |
  Both EmailAlert and SmsAlert implement AlertChannel, so
  AlertDispatcher's constructor injection of a plain AlertChannel is
  ambiguous -- the context fails to refresh with
  NoUniqueBeanDefinitionException. Fix this by adding
  @Qualifier("smsAlert") to the constructor parameter, so the dispatcher
  is unambiguously wired to SmsAlert.
expected_output_pattern: "BUILD SUCCESS"
hints:
  - "Two @Component beans implement the same interface -- Spring can't pick one on its own."
  - "@Autowired public AlertDispatcher(@Qualifier(\"smsAlert\") AlertChannel channel) { ... }"
