spring_test_code: |
  package com.codingadventure.exercise;

  import org.junit.jupiter.api.Test;
  import org.springframework.context.annotation.AnnotationConfigApplicationContext;
  import static org.assertj.core.api.Assertions.assertThat;

  public class ResultLoggerAspectTest {
      @Test
      void capturesTheReturnValue() {
          ResultLoggerAspect.lastResult = null;
          try (AnnotationConfigApplicationContext ctx = new AnnotationConfigApplicationContext(AppConfig.class)) {
              Calculator calc = ctx.getBean(Calculator.class);
              calc.square(6);
              assertThat(ResultLoggerAspect.lastResult).isEqualTo("36");
          }
      }
  }
