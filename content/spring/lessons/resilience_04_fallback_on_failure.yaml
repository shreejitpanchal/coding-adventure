spring_test_code: |
  package com.codingadventure.exercise;

  import org.junit.jupiter.api.Test;
  import static org.assertj.core.api.Assertions.assertThat;

  public class PaymentGatewayTest {
      @Test
      void fallsBackToCachedPriceOnFailure() {
          PaymentGateway gw = new PaymentGateway();
          assertThat(gw.fetchPrice(false)).isEqualTo("live-price");
          assertThat(gw.fetchPrice(true)).isEqualTo("cached-price");
      }
  }
