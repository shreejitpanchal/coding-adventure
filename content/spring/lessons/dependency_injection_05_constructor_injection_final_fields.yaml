id: dependency_injection_05
title: "Every Dependency, Explicit and Immutable"
language: spring
level: 5
objective: "Consolidate multiple field-injected dependencies into a single constructor with final fields."
explanation: |
  `ReportGenerator` with two separate `@Autowired` fields has exactly
  the same fundamental problem as the single-field case covered earlier
  in this category, just compounded: both `formatter` and `store` are
  populated only via Spring's reflection-based field injection after
  construction, so `new ReportGenerator()` outside a container leaves
  *both* fields `null`, and nothing about the class's public API (its
  constructor signature is empty) reveals that it actually depends on
  anything at all -- a reader has to look inside the class body, past
  the constructor, to discover what it genuinely needs to function.
  That's the deeper cost of field injection beyond just "harder to unit
  test": it hides a class's real dependency list from anyone reading
  its public interface, since Java constructors are normally where a
  class states what it needs.

  Consolidating every field-injected dependency into one constructor
  fixes both problems simultaneously. First, visibility: `public Report
  Generator(ReportFormatter formatter, ReportStore store)` puts every
  dependency directly in the class's public signature -- reading the
  constructor *is* reading the complete list of what this class
  requires, no separate documentation or field-scanning needed. Second,
  immutability: declaring the corresponding fields `final` (`private
  final ReportFormatter formatter;`) means the compiler itself
  guarantees they're assigned exactly once, at construction, and can
  never be reassigned afterward -- there's no code path anywhere that
  could leave the object in a state where `formatter` points at
  something different than what it was constructed with. Together,
  these two properties mean the object is fully, correctly, and
  permanently wired the instant it exists -- there's no window where it
  could be observed half-constructed, and (the same testability payoff
  as the single-dependency case) a unit test can build a fully working
  instance with `new` and hand-crafted fakes, no Spring context
  required at all.
example_code: |
  package com.codingadventure.exercise;

  import org.springframework.stereotype.Component;

  // The trap: multiple field-injected dependencies -- hidden AND unbuildable outside Spring.
  @Component
  class ReportGeneratorBroken {
      // @Autowired
      // private ReportFormatterBroken formatter;   // hidden dependency, null outside a container
      // @Autowired
      // private ReportStoreBroken store;             // same problem, second dependency
  }
  // new ReportGeneratorBroken() -- both fields stay null, unusable and untestable directly

  // Fix: every dependency consolidated into ONE constructor, all fields final.
  @Component
  public class ReportGenerator {
      private final ReportFormatter formatter;
      private final ReportStore store;

      public ReportGenerator(ReportFormatter formatter, ReportStore store) {
          this.formatter = formatter;   // assigned exactly once, guaranteed by `final`
          this.store = store;
      }

      public String generate(String data) {
          String formatted = formatter.format(data);
          store.save(formatted);
          return formatted;
      }
  }

  @Component
  class ReportFormatter {
      public String format(String data) { return "[REPORT] " + data; }
  }

  @Component
  class ReportStore {
      public void save(String report) { /* no-op for the exercise */ }
  }
  // new ReportGenerator(new ReportFormatter(), new ReportStore()) -- fully valid, no Spring needed
  // generator.generate("sales") -> "[REPORT] sales"
starter_code: |
  package com.codingadventure.exercise;

  import org.springframework.beans.factory.annotation.Autowired;
  import org.springframework.stereotype.Component;

  @Component
  public class ReportGenerator {
      @Autowired
      private ReportFormatter formatter;
      @Autowired
      private ReportStore store;

      public String generate(String data) {
          String formatted = formatter.format(data);
          store.save(formatted);
          return formatted;
      }
  }

  @Component
  class ReportFormatter {
      public String format(String data) { return "[REPORT] " + data; }
  }

  @Component
  class ReportStore {
      public void save(String report) { /* no-op for the exercise */ }
  }
challenge: |
  The test constructs ReportGenerator directly with `new` and hand-made
  collaborators, with no Spring context involved -- but both dependencies
  are field-injected, so they stay null outside a real container. Fix
  this by giving ReportGenerator a constructor that takes both
  ReportFormatter and ReportStore as parameters, assigning them to final
  fields, and removing the @Autowired field injection entirely.
expected_output_pattern: "BUILD SUCCESS"
hints:
  - "Both dependencies need to become constructor parameters assigned to final fields."
  - "public ReportGenerator(ReportFormatter formatter, ReportStore store) { this.formatter = formatter; this.store = store; }"
xp_reward: 15
achievement: dependency_injection_master
category: dependency_injection
category_level: 5
difficulty: deep_dive
contains_patterns:
  - "public ReportGenerator\\("
  - "final ReportFormatter"
  - "final ReportStore"
concept_tags: [dependency_injection, constructor_injection, immutability]
spring_test_code: |
  package com.codingadventure.exercise;

  import org.junit.jupiter.api.Test;
  import static org.assertj.core.api.Assertions.assertThat;

  public class ReportGeneratorTest {
      @Test
      void constructsDirectlyWithoutReflection() {
          ReportGenerator generator = new ReportGenerator(new ReportFormatter(), new ReportStore());
          assertThat(generator.generate("sales")).isEqualTo("[REPORT] sales");
      }
  }
