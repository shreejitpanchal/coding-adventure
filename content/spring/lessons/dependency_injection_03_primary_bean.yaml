id: dependency_injection_03
title: "Picking a Default Among Equals"
language: spring
level: 3
objective: "Use @Primary to resolve ambiguity by declaring one implementation the default, instead of qualifying every injection point."
explanation: |
  `@Qualifier` (covered in the previous exercise) resolves ambiguity at
  *each individual injection site* -- correct, but repetitive the
  moment an application has many places that all want the *same*
  default implementation of an interface, with only a handful of
  exceptions wanting something different. Annotating every single one
  of those "just give me the default" injection sites with an identical
  `@Qualifier("standardPricing")` works, but it's needless repetition
  for something that's really a single, application-wide policy: "when
  nothing more specific is asked for, use `StandardPricing`."

  `@Primary`, placed on the bean definition itself rather than at each
  injection point, expresses that policy directly and once: `@Component
  @Primary class StandardPricing implements PricingStrategy { ... }`
  tells Spring "when resolving a `PricingStrategy` and nothing else
  disambiguates the choice, prefer this one." Every injection point
  that doesn't specify an explicit `@Qualifier` of its own then
  resolves to the `@Primary` bean automatically, with zero repeated
  annotations needed at each of those call sites. `@Qualifier` still
  takes precedence over `@Primary` at any *specific* site that adds
  one -- `@Primary` is purely the fallback tiebreaker for everywhere
  else, not an override that trumps an explicit, more specific request.
  This division of labor -- `@Primary` for "the sensible default almost
  everyone wants," `@Qualifier` for "this particular spot needs
  something different" -- keeps the common case terse while still
  allowing exceptions to be expressed precisely where they're actually
  needed.
example_code: |
  package com.codingadventure.exercise;

  import org.springframework.context.annotation.Primary;
  import org.springframework.stereotype.Component;

  interface PricingStrategy {
      double price(double base);
  }

  // The trap: two beans implement PricingStrategy, no tiebreaker -- ambiguous everywhere.
  // @Component
  // class StandardPricingBroken implements PricingStrategy { ... }
  // @Component
  // class DiscountPricingBroken implements PricingStrategy { ... }
  // -- NoUniqueBeanDefinitionException at every plain injection point

  // Fix: @Primary marks the sensible default -- no @Qualifier needed at most call sites.
  @Component
  @Primary
  class StandardPricing implements PricingStrategy {
      public double price(double base) { return base; }
  }

  @Component
  class DiscountPricing implements PricingStrategy {
      public double price(double base) { return base * 0.9; }
  }

  @Component
  public class Checkout {
      private final PricingStrategy strategy;

      public Checkout(PricingStrategy strategy) {    // no @Qualifier needed -- resolves to @Primary
          this.strategy = strategy;
      }

      public double total(double base) {
          return strategy.price(base);
      }
  }
  // checkout.total(100.0) -> 100.0 -- wired to StandardPricing, the @Primary default
starter_code: |
  package com.codingadventure.exercise;

  import org.springframework.stereotype.Component;

  interface PricingStrategy {
      double price(double base);
  }

  @Component
  class StandardPricing implements PricingStrategy {
      public double price(double base) { return base; }
  }

  @Component
  class DiscountPricing implements PricingStrategy {
      public double price(double base) { return base * 0.9; }
  }

  @Component
  public class Checkout {
      private final PricingStrategy strategy;

      public Checkout(PricingStrategy strategy) {
          this.strategy = strategy;
      }

      public double total(double base) {
          return strategy.price(base);
      }
  }
challenge: |
  StandardPricing and DiscountPricing both implement PricingStrategy with
  no way to disambiguate, so the context fails to refresh with
  NoUniqueBeanDefinitionException. Fix this by adding @Primary to
  StandardPricing, making it the unambiguous default so Checkout wires in
  correctly and total(100.0) returns 100.0 (full price, not discounted).
expected_output_pattern: "BUILD SUCCESS"
hints:
  - "@Primary marks one implementation as the default when there's no other tiebreaker."
  - "Add @Primary above @Component on StandardPricing."
xp_reward: 10
achievement: null
category: dependency_injection
category_level: 3
difficulty: core
contains_patterns:
  - "@Primary"
concept_tags: [dependency_injection, primary_bean, ambiguous_bean]
spring_test_code: |
  package com.codingadventure.exercise;

  import org.junit.jupiter.api.Test;
  import org.springframework.context.annotation.AnnotationConfigApplicationContext;
  import static org.assertj.core.api.Assertions.assertThat;

  public class CheckoutTest {
      @Test
      void resolvesUnambiguously() {
          try (AnnotationConfigApplicationContext ctx = new AnnotationConfigApplicationContext(
                  StandardPricing.class, DiscountPricing.class, Checkout.class)) {
              Checkout checkout = ctx.getBean(Checkout.class);
              assertThat(checkout.total(100.0)).isEqualTo(100.0);
          }
      }
  }
