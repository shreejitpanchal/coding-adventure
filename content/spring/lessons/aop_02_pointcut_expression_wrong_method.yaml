id: aop_02
title: "The Pointcut Watching the Wrong Method"
language: spring
level: 22
objective: "Fix a pointcut expression that names the wrong method, so the advice actually matches the call it's meant to intercept."
explanation: |
  A pointcut expression like `execution(* com.codingadventure.exercise.
  AccountService.deposit(..))` matches *exactly* the method signature it
  names -- the return type wildcard (`*`), the fully-qualified class
  name, the specific method name, and the argument wildcard (`(..)`,
  matching any arguments) together pin down one precise method. It
  doesn't match "something like deposit," it doesn't match "methods on
  `AccountService` related to deposits" -- it matches `deposit(..)` and
  nothing else. `AuditAspect`'s intent, per its name and the exercise's
  own description, is to audit *withdrawals* specifically -- but its
  pointcut expression names `deposit(..)`, so that's exactly, and only,
  what it actually intercepts, regardless of what the aspect's author
  actually meant it to do.

  This is a genuinely dangerous class of bug because there's *no
  compile-time check whatsoever* that a pointcut expression's method
  name is even correct -- `execution(...)` expressions are plain
  strings, evaluated by AspectJ's own matching engine at runtime
  (specifically, at proxy-creation time during context startup), not
  parsed or validated by the Java compiler against the actual method
  signatures in the codebase at all. A typo in a pointcut expression,
  or (as here) simply naming the wrong operation, produces code that
  compiles cleanly, starts up without error, and *appears* to work --
  the aspect fires, just for the wrong method -- with nothing anywhere
  flagging the mismatch between the aspect's evident intent and its
  actual behavior. The fix is purely textual once the mismatch is
  spotted: change the expression from `AccountService.deposit(..)` to `
  AccountService.withdraw(..)`, correctly aligning what the pointcut
  actually matches with what the aspect was meant to audit.
example_code: |
  package com.codingadventure.exercise;

  import org.aspectj.lang.annotation.Aspect;
  import org.aspectj.lang.annotation.Before;
  import org.springframework.stereotype.Component;

  // The trap: the pointcut names the WRONG method -- compiles fine, silently wrong behavior.
  @Aspect
  @Component
  class AuditAspectBroken {
      public static int calls = 0;

      @Before("execution(* com.codingadventure.exercise.AccountService.deposit(..))")
      public void audit() {
          calls++;    // fires on deposit(), NOT withdraw() -- opposite of the intent
      }
  }

  // Fix: the pointcut names the CORRECT method the aspect is actually meant to audit.
  @Aspect
  @Component
  public class AuditAspect {
      public static int calls = 0;

      @Before("execution(* com.codingadventure.exercise.AccountService.withdraw(..))")
      public void audit() {
          calls++;    // now genuinely fires on withdrawals
      }
  }

  @Component
  class AccountService {
      public void deposit(int amount) { }
      public void withdraw(int amount) { }
  }
  // service.deposit(100); service.withdraw(50);
  // AuditAspect.calls == 1 -- only the withdrawal was audited, correctly
starter_code: |
  package com.codingadventure.exercise;

  import org.aspectj.lang.annotation.Aspect;
  import org.aspectj.lang.annotation.Before;
  import org.springframework.context.annotation.ComponentScan;
  import org.springframework.context.annotation.Configuration;
  import org.springframework.context.annotation.EnableAspectJAutoProxy;
  import org.springframework.stereotype.Component;

  @Configuration
  @EnableAspectJAutoProxy
  @ComponentScan
  class AppConfig {}

  @Aspect
  @Component
  public class AuditAspect {
      public static int calls = 0;

      @Before("execution(* com.codingadventure.exercise.AccountService.deposit(..))")
      public void audit() {
          calls++;
      }
  }

  @Component
  class AccountService {
      public void deposit(int amount) { }
      public void withdraw(int amount) { }
  }
challenge: |
  AuditAspect is meant to audit withdrawals specifically, but its
  pointcut targets deposit(..) instead -- calling withdraw() is never
  audited, while deposit() is (incorrectly). Fix this by changing the
  pointcut expression to target AccountService.withdraw(..) instead of
  deposit(..).
expected_output_pattern: "BUILD SUCCESS"
hints:
  - "The pointcut expression names deposit(..), but the intent (auditing) is really about withdraw(..)."
  - 'Change the expression to: "execution(* com.codingadventure.exercise.AccountService.withdraw(..))"'
xp_reward: 10
achievement: null
category: aop
category_level: 2
difficulty: gotcha
contains_patterns:
  - "AccountService\\.withdraw\\(\\.\\.\\)"
concept_tags: [aop, pointcut, before_advice, gotchas]
spring_test_code: |
  package com.codingadventure.exercise;

  import org.junit.jupiter.api.Test;
  import org.springframework.context.annotation.AnnotationConfigApplicationContext;
  import static org.assertj.core.api.Assertions.assertThat;

  public class AuditAspectTest {
      @Test
      void auditsWithdrawalsNotDeposits() {
          AuditAspect.calls = 0;
          try (AnnotationConfigApplicationContext ctx = new AnnotationConfigApplicationContext(AppConfig.class)) {
              AccountService service = ctx.getBean(AccountService.class);
              service.deposit(100);
              service.withdraw(50);
              assertThat(AuditAspect.calls).isEqualTo(1);
          }
      }
  }
