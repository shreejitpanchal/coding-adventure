questions:
  - id: q01
    question: "Why does a field annotated @Autowired stay null when the object is constructed directly with `new` instead of through Spring?"
    options:
      - "Field injection only works for interface types"
      - "Spring populates @Autowired fields via reflection after construction -- a plain `new` call never triggers that step"
      - "@Autowired fields require a no-args constructor"
      - "It doesn't stay null -- this is a myth"
    correct: 1
    explanation: "Field injection depends entirely on the container's post-construction reflection step; bypass the container and nothing populates the field."
    concept_tags: [dependency_injection, testability, gotchas]

  - id: q02
    question: "What's the main advantage of constructor injection over field injection?"
    options:
      - "Constructor injection is faster at runtime"
      - "Dependencies become explicit, required constructor parameters -- the object can't exist half-wired, and it's testable with plain `new`"
      - "Field injection is deprecated and no longer works"
      - "There's no real difference"
    correct: 1
    explanation: "Constructor injection makes every dependency visible in the signature and guarantees the object is fully valid the moment it's constructed."
    concept_tags: [dependency_injection, constructor_injection]

  - id: q03
    question: "What happens when two beans implement the same interface and a third bean @Autowired-injects that interface with no further disambiguation?"
    options:
      - "Spring picks the first one registered"
      - "NoUniqueBeanDefinitionException -- the context fails to refresh"
      - "Both get injected into a List automatically"
      - "It compiles but throws at first use, not at startup"
    correct: 1
    explanation: "Ambiguous injection fails fast at context-refresh time rather than guessing which bean was meant."
    concept_tags: [dependency_injection, ambiguous_bean]

  - id: q04
    question: "What does @Qualifier(\"beanName\") do?"
    options:
      - "Marks a bean as required"
      - "Tells Spring exactly which registered bean (by name) to inject at that specific injection point"
      - "Renames a bean"
      - "Excludes a bean from the context entirely"
    correct: 1
    explanation: "@Qualifier disambiguates which of several matching beans should be wired in at a specific point."
    concept_tags: [dependency_injection, qualifier]

  - id: q05
    question: "How does @Primary differ from @Qualifier for resolving ambiguous beans?"
    options:
      - "They're identical in every way"
      - "@Primary marks one implementation as the default for every unqualified injection point, rather than disambiguating at each individual site"
      - "@Primary only works on interfaces, @Qualifier only on classes"
      - "@Primary is deprecated in favor of @Qualifier"
    correct: 1
    explanation: "@Primary sets a default that applies everywhere an injection point doesn't otherwise disambiguate; @Qualifier still wins at any site that specifies it."
    concept_tags: [dependency_injection, primary_bean]

  - id: q06
    question: "What does @Autowired(required = false) change about a dependency?"
    options:
      - "The dependency becomes lazy-loaded"
      - "If no matching bean exists, the field is left null instead of failing context startup with NoSuchBeanDefinitionException"
      - "The dependency is injected as an Optional automatically"
      - "It has no effect -- required is always false by default"
    correct: 1
    explanation: "required = false turns a missing dependency from a startup failure into a null field, for genuinely optional collaborators."
    concept_tags: [dependency_injection, optional_dependency]

  - id: q07
    question: "What scope does a @Component get if no @Scope is specified?"
    options:
      - "prototype -- a new instance every time"
      - "singleton -- exactly one shared instance for the whole container"
      - "request -- one instance per HTTP request"
      - "It depends on the class's constructor"
    correct: 1
    explanation: "Singleton is Spring's default bean scope; every getBean() call or injection returns the same instance unless told otherwise."
    concept_tags: [bean_lifecycle, bean_scope]

  - id: q08
    question: "Why might @Scope(\"prototype\") be necessary for a bean holding per-use mutable state?"
    options:
      - "Prototype beans are faster to construct"
      - "Without it, every 'separate' request for the bean returns the exact same singleton instance, so mutations leak across supposedly independent uses"
      - "Prototype scope is required for any class with fields"
      - "It isn't necessary -- singleton beans can't hold state at all"
    correct: 1
    explanation: "Singleton scope means shared state by default; prototype scope gives each request a genuinely independent instance."
    concept_tags: [bean_lifecycle, prototype_scope, gotchas]

  - id: q09
    question: "Why can't initialization logic that reads an @Autowired field safely live in the constructor?"
    options:
      - "Constructors can't call other methods"
      - "Field injection happens after the constructor runs, so the field is still null when the constructor executes"
      - "Spring forbids logic inside constructors"
      - "It's actually safe -- this is a myth"
    correct: 1
    explanation: "The container must construct the object before it has anything to reflectively inject -- reading an @Autowired field in the constructor reads it before it's set."
    concept_tags: [bean_lifecycle, postconstruct, gotchas]

  - id: q10
    question: "What does @PostConstruct guarantee about when its annotated method runs?"
    options:
      - "It runs before the constructor"
      - "It runs after construction AND after all dependency injection is complete"
      - "It runs on a background thread"
      - "It runs only once per JVM, regardless of how many beans use it"
    correct: 1
    explanation: "@PostConstruct is the right place for initialization logic that depends on injected collaborators, since it fires only after they're all set."
    concept_tags: [bean_lifecycle, postconstruct, initialization]

  - id: q11
    question: "What triggers a bean's @PreDestroy method to run?"
    options:
      - "It runs automatically every time the bean is used"
      - "The ApplicationContext shutting down (e.g. ctx.close())"
      - "A JVM garbage collection pass"
      - "@PreDestroy methods never run automatically -- they must be called manually"
    correct: 1
    explanation: "@PreDestroy hooks into container teardown, making it the natural place for releasing resources a bean acquired during its lifetime."
    concept_tags: [bean_lifecycle, predestroy, cleanup]

  - id: q12
    question: "What's the effect of adding @Lazy to a singleton bean?"
    options:
      - "The bean becomes prototype-scoped"
      - "Construction is deferred until the bean is actually first requested, instead of happening eagerly at context startup"
      - "The bean is constructed on a separate thread"
      - "@Lazy has no effect on singleton beans"
    correct: 1
    explanation: "@Lazy avoids paying an expensive bean's construction cost on every startup, even when that bean is never actually used in a given run."
    concept_tags: [bean_lifecycle, lazy_initialization, performance]

  - id: q13
    question: "In plain Spring (not Spring Boot), what's required before @Value(\"${...}\") placeholders will actually resolve?"
    options:
      - "Nothing -- it works automatically like in Spring Boot"
      - "A PropertySourcesPlaceholderConfigurer bean must be explicitly registered in the context"
      - "The property must be a Java system property"
      - "@Value only works inside @Configuration classes"
    correct: 1
    explanation: "Spring Boot auto-configures placeholder resolution; plain Spring needs an explicit PropertySourcesPlaceholderConfigurer bean or nothing gets resolved."
    concept_tags: [configuration, value_annotation, placeholder_resolution, gotchas]

  - id: q14
    question: "What does @Value(\"${greeting.prefix:Hello}\") do if greeting.prefix is never configured anywhere?"
    options:
      - "Throws an exception at context startup"
      - "Resolves to the default value \"Hello\" after the colon"
      - "Resolves to an empty string"
      - "Resolves to null"
    correct: 1
    explanation: "The colon syntax provides a fallback default used whenever the property itself isn't set."
    concept_tags: [configuration, value_annotation]

  - id: q15
    question: "What does @Profile(\"dev\") on a @Component mean?"
    options:
      - "The bean is only used during development builds, determined at compile time"
      - "The bean is only registered in the context when \"dev\" is among the currently active profiles"
      - "The bean gets extra debug logging automatically"
      - "@Profile has no runtime effect, it's purely documentation"
    correct: 1
    explanation: "@Profile gates bean registration on which profiles are active at context-refresh time, letting environment-specific implementations coexist in the same codebase."
    concept_tags: [configuration, profiles, environment_specific_beans]

  - id: q16
    question: "What does @Profile(\"!prod\") mean?"
    options:
      - "The bean is active only in a profile literally named \"!prod\""
      - "The bean is active whenever \"prod\" is NOT among the active profiles, including when no profile is set at all"
      - "It's invalid syntax and will throw at startup"
      - "It's equivalent to @Profile(\"prod\")"
    correct: 1
    explanation: "The ! prefix negates a profile condition -- useful for dev/debug conveniences that should exist everywhere except one specific environment."
    concept_tags: [configuration, profiles, profile_negation]

  - id: q17
    question: "What does Spring's Environment abstraction represent?"
    options:
      - "Only Java system environment variables (System.getenv())"
      - "Every configured property source (system properties, property files, explicitly registered sources) as one queryable object"
      - "The currently active Spring profile, and nothing else"
      - "A wrapper around the JVM's classpath"
    correct: 1
    explanation: "Environment unifies every property source into one API, injectable and queryable like any other bean via getProperty()."
    concept_tags: [configuration, environment, property_resolution]

  - id: q18
    question: "Why might @Value(\"${db.url}\") (no default) be preferred over @Value(\"${db.url:some-fallback}\") for a production database URL?"
    options:
      - "It's faster to resolve"
      - "A missing required config value fails loudly at startup instead of silently connecting to a wrong or dummy fallback"
      - "There's no functional difference between the two"
      - "It's required syntax for @Profile-scoped beans"
    correct: 1
    explanation: "For genuinely critical config, failing fast on a missing value is safer than silently limping along with an inappropriate default."
    concept_tags: [configuration, value_annotation, required_property]

  - id: q19
    question: "What happens when ctx.getBean(SomeClass.class) is called on a class with no @Component (and not otherwise registered)?"
    options:
      - "Spring constructs it on the fly using its no-args constructor"
      - "NoSuchBeanDefinitionException -- the class was never registered as a bean"
      - "It returns null"
      - "It works as long as the class is public"
    correct: 1
    explanation: "A plain class is invisible to Spring's container until something (like @Component) registers it as a managed bean."
    concept_tags: [bean_lifecycle, component_annotation]

  - id: q20
    question: "Why is constructor injection generally considered easier to unit test than field injection?"
    options:
      - "It isn't -- both are equally testable"
      - "A constructor-injected object can be built directly with `new` and hand-made fakes, with no Spring container involved at all"
      - "Constructor injection automatically generates mock objects"
      - "Field injection requires a database connection to test"
    correct: 1
    explanation: "Constructor parameters are just normal Java arguments -- no reflection or container needed to supply them in a test."
    concept_tags: [dependency_injection, constructor_injection, testability]

  - id: q21
    question: "What does ApplicationEventPublisher.publishEvent() do?"
    options:
      - "Directly calls every method that might care about the event"
      - "Publishes an event that any bean with a matching @EventListener method will automatically receive, with no direct reference between publisher and listener"
      - "Writes the event to a log file"
      - "Blocks until every listener has finished processing"
    correct: 1
    explanation: "Spring's event system decouples publishers from listeners entirely -- publishing is a one-way broadcast, not a direct call."
    concept_tags: [events, application_event_publisher]

  - id: q22
    question: "What does a method need for Spring to recognize it as an event handler?"
    options:
      - "Just a name starting with 'on'"
      - "The @EventListener annotation (or implementing ApplicationListener<T> directly), and the containing class must be a registered bean"
      - "A return type of void only"
      - "It must be declared in the same class that publishes the event"
    correct: 1
    explanation: "Without @EventListener, a method is just a plain method -- Spring has no way to know it should be wired up as a handler."
    concept_tags: [events, event_listener, gotchas]

  - id: q23
    question: "If two separate @Component beans both have an @EventListener method for the same event type, what happens when that event is published?"
    options:
      - "Only the first-registered listener fires"
      - "Both listeners fire independently -- publishing isn't limited to a single handler"
      - "Spring throws an exception due to ambiguous listeners"
      - "Only one fires, chosen at random"
    correct: 1
    explanation: "Every registered bean with a matching @EventListener method gets called when a matching event is published -- there's no single-listener limit."
    concept_tags: [events, event_listener, fan_out]

  - id: q24
    question: "What does @EventListener's `condition` attribute do?"
    options:
      - "Filters which listener beans get registered at startup"
      - "Evaluates a SpEL expression against the published event -- the listener method's body only runs when it evaluates true"
      - "Sets a timeout for how long the listener can run"
      - "Specifies which thread the listener runs on"
    correct: 1
    explanation: "condition lets a listener declaratively filter events (e.g. only large purchases) without an internal if-check."
    concept_tags: [events, event_listener, spel, conditional]

  - id: q25
    question: "What's required to reference an @EventListener method's parameter by name in a SpEL condition (e.g. #event.amount)?"
    options:
      - "Nothing -- parameter names are always available at runtime"
      - "The compiler needs to preserve parameter names in the bytecode (e.g. via the -parameters flag), or reflection-based name discovery fails"
      - "The event class must implement a special interface"
      - "SpEL conditions can only reference static fields, never parameters"
    correct: 1
    explanation: "Without -parameters (or equivalent debug info), Spring's parameter name discovery can't resolve #event to the actual argument."
    concept_tags: [events, spel, reflection]

  - id: q26
    question: "Why does a custom event class need its own field and getter for its payload, even when extending ApplicationEvent?"
    options:
      - "ApplicationEvent doesn't allow additional fields"
      - "ApplicationEvent only provides infrastructure (timestamp, source) -- any event-specific data has to be stored and exposed explicitly by the subclass"
      - "Payload fields must be static"
      - "Getters are optional and Spring generates them automatically"
    correct: 1
    explanation: "Without an explicit field and getter, listeners can tell an event happened but have no way to access what specifically happened."
    concept_tags: [events, custom_event, application_event]

  - id: q27
    question: "What does @Aspect mark a class as, in Spring AOP?"
    options:
      - "A regular bean with no special behavior"
      - "A class whose advice annotations (@Before, @After, @Around, etc.) should actually be recognized and woven into matching method calls"
      - "A class that can never be proxied"
      - "A configuration class"
    correct: 1
    explanation: "Advice annotations only have effect on a class also annotated @Aspect -- without it, they're just unused annotations."
    concept_tags: [aop, aspect, gotchas]

  - id: q28
    question: "What happens if an @Before pointcut expression names the wrong method?"
    options:
      - "Spring raises a compile error"
      - "The advice silently never fires for the method actually intended, since a pointcut expression matches exactly what it names -- nothing more"
      - "The advice fires for every method in the class instead"
      - "Spring automatically corrects common typos in pointcut expressions"
    correct: 1
    explanation: "There's no compile-time check that a pointcut's method name is correct -- a typo or wrong target just means silent non-matching."
    concept_tags: [aop, pointcut, gotchas]

  - id: q29
    question: "Why would you use @AfterReturning instead of plain @After to log a method's result?"
    options:
      - "They're functionally identical"
      - "@AfterReturning's `returning` attribute binds the method's actual return value to an advice parameter; plain @After has no access to it"
      - "@After only works on void methods"
      - "@AfterReturning runs before the method instead of after"
    correct: 1
    explanation: "Plain @After runs regardless of outcome and can't see the return value; @AfterReturning is specifically for the success case with result access."
    concept_tags: [aop, afterreturning_advice, pointcut]

  - id: q30
    question: "What makes @Around advice more powerful than @Before/@After/@AfterReturning?"
    options:
      - "It runs faster"
      - "It receives a ProceedingJoinPoint and controls what pjp.proceed() returns, letting it inspect, transform, or replace the method's return value"
      - "It can only be used once per aspect"
      - "It doesn't require @EnableAspectJAutoProxy"
    correct: 1
    explanation: "Because @Around wraps the call and controls proceed()'s result, it can modify the return value -- something the other advice types can't do."
    concept_tags: [aop, around_advice, proceedingjoinpoint]

  - id: q31
    question: "What is Spring AOP's 'self-invocation' gotcha?"
    options:
      - "A bean can't inject itself under any circumstances"
      - "A method calling another advised method on `this` (or bare, implicitly on this) bypasses the Spring proxy entirely, so that method's advice never fires"
      - "Aspects can't advise private methods"
      - "Two aspects can't advise the same method"
    correct: 1
    explanation: "Only calls that go through the proxy (i.e. external calls) trigger advice -- internal self-calls reach the real object directly."
    concept_tags: [aop, self_invocation, proxy, gotchas]

  - id: q32
    question: "What's the standard fix for Spring AOP's self-invocation problem?"
    options:
      - "Make the method static"
      - "Self-inject a reference to the bean's own proxy (typically @Autowired with @Lazy to avoid a circular dependency) and call through that reference instead of `this`"
      - "There is no fix -- self-invocation can never trigger advice"
      - "Mark the class @Aspect as well as @Component"
    correct: 1
    explanation: "Self-injection routes the internal call back through the proxy, so advice fires just like an external call would."
    concept_tags: [aop, self_invocation, proxy]

  - id: q33
    question: "Why is @Lazy typically needed on a self-injected field (e.g. @Autowired private Greeter self)?"
    options:
      - "It isn't needed -- it's purely optional styling"
      - "It avoids a circular dependency during construction, since the bean would otherwise need to inject itself before it's fully constructed"
      - "It makes the injected reference thread-safe"
      - "It's required syntax for all @Autowired fields"
    correct: 1
    explanation: "@Lazy defers resolving the self-reference until it's actually used, sidestepping the construction-order problem of a bean depending on itself."
    concept_tags: [aop, self_invocation, lazy_initialization]

  - id: q34
    question: "By default, does Spring AOP use JDK dynamic proxies or CGLIB subclass proxies for a class with no interfaces?"
    options:
      - "It fails -- AOP requires an interface"
      - "CGLIB, which creates a runtime subclass of the concrete class to intercept calls, since JDK dynamic proxies require an interface"
      - "JDK dynamic proxies, applied to the class's own methods directly"
      - "Neither -- it modifies the original class's bytecode in place"
    correct: 1
    explanation: "Spring automatically falls back to CGLIB class-based proxying when the target bean doesn't implement any interface."
    concept_tags: [aop, proxy, cglib]

  - id: q35
    question: "What does a Resilience4j CircuitBreaker do once its failure rate threshold is crossed within its sliding window?"
    options:
      - "It slows down every subsequent call instead of rejecting them"
      - "It \"opens\": for a configured duration, calls are rejected immediately with CallNotPermittedException instead of reaching the real function"
      - "It automatically restarts the failing dependency"
      - "It logs a warning but otherwise has no effect on call behavior"
    correct: 1
    explanation: "An open circuit breaker fails fast, protecting an already-struggling downstream dependency from more traffic while it recovers."
    concept_tags: [resilience, circuit_breaker, resilience4j]

  - id: q36
    question: "What kind of failure is Resilience4j's Retry decorator meant to address?"
    options:
      - "Permanent failures like a missing configuration value"
      - "Transient failures -- momentary blips that are likely to succeed if simply attempted again shortly after"
      - "Compile-time errors"
      - "Failures caused by invalid user input"
    correct: 1
    explanation: "Retry automatically re-attempts a call up to a bounded number of times, appropriate for failures expected to resolve on their own."
    concept_tags: [resilience, retry, resilience4j]

  - id: q37
    question: "What does RateLimiterConfig's timeoutDuration control?"
    options:
      - "How long the entire application waits before starting"
      - "How long a call will wait for a permit to become available before giving up, with Duration.ZERO meaning reject immediately instead of waiting"
      - "How often the rate limiter's configuration is reloaded"
      - "The maximum lifetime of the RateLimiter object itself"
    correct: 1
    explanation: "A zero timeout makes an over-limit call fail fast with RequestNotPermitted rather than blocking until a permit frees up."
    concept_tags: [resilience, rate_limiter, resilience4j]

  - id: q38
    question: "What does Decorators.ofSupplier(risky).withFallback(exceptionTypes, handler) do?"
    options:
      - "Retries the call automatically on failure"
      - "Calls the fallback handler and returns its result when the wrapped call throws one of the listed exception types, instead of propagating the exception"
      - "Logs the exception without changing the call's behavior"
      - "Converts every exception into a checked exception"
    correct: 1
    explanation: "A fallback lets code degrade gracefully -- e.g. returning a cached value -- instead of surfacing every failure to the caller."
    concept_tags: [resilience, fallback, resilience4j]

  - id: q39
    question: "Why does CircuitBreaker.decorateSupplier(cb, Retry.decorateSupplier(retry, risky)) (circuit breaker wrapping retry) fail to protect the dependency the way intended?"
    options:
      - "This ordering isn't valid and won't compile"
      - "The circuit breaker only sees ONE outcome per logical call -- the retry absorbs every individual attempt internally, so the breaker's window never fills fast enough to open in time"
      - "It works identically to the opposite ordering"
      - "The circuit breaker takes priority and prevents the retry from running at all"
    correct: 1
    explanation: "With the circuit breaker outermost, retries happen entirely inside it, and it only records the final result -- every attempt still reaches the real dependency."
    concept_tags: [resilience, circuit_breaker, retry, decorator_order]

  - id: q40
    question: "What changes when the decoration order is flipped to Retry.decorateSupplier(retry, CircuitBreaker.decorateSupplier(cb, risky)) (retry wrapping circuit breaker)?"
    options:
      - "Nothing -- decoration order never matters for Resilience4j decorators"
      - "Each individual attempt is separately recorded by the circuit breaker, so once it opens, later retry attempts fail fast with CallNotPermittedException instead of reaching the dependency"
      - "The retry stops working entirely"
      - "The circuit breaker is bypassed completely"
    correct: 1
    explanation: "With the circuit breaker innermost, it observes every individual call attempt, letting it open mid-retry-sequence and stop further attempts from reaching a failing dependency."
    concept_tags: [resilience, circuit_breaker, retry, decorator_order]

  - id: q41
    question: "What's the practical benefit of a circuit breaker opening, from the perspective of the failing downstream dependency?"
    options:
      - "None -- circuit breakers only benefit the calling code"
      - "It stops sending additional traffic to a dependency that's already struggling, giving it room to recover instead of piling on more load"
      - "It automatically fixes whatever caused the dependency to fail"
      - "It permanently disables calls to that dependency"
    correct: 1
    explanation: "A circuit breaker protects the callee as much as the caller -- reducing load on something already failing is often what lets it recover."
    concept_tags: [resilience, circuit_breaker, resilience4j]

  - id: q42
    question: "In Resilience4j, what does slidingWindowSize control on a CircuitBreakerConfig?"
    options:
      - "How many threads the circuit breaker can use"
      - "How many of the most recent call outcomes are considered when calculating the current failure rate"
      - "The maximum number of calls allowed per second"
      - "How long the circuit breaker stays open before testing recovery"
    correct: 1
    explanation: "The sliding window is the recent-history sample the failure rate threshold is evaluated against -- e.g. a window of 4 means the last 4 outcomes."
    concept_tags: [resilience, circuit_breaker, resilience4j]

  - id: q43
    question: "Why might combining resilience patterns (retry, circuit breaker, fallback) around the same call require care about ordering?"
    options:
      - "It doesn't -- Resilience4j automatically picks the correct order"
      - "Each decorator only observes what the decorator(s) inside it let through, so the same set of patterns can behave very differently depending on which one is applied last (outermost)"
      - "Only one resilience pattern can be applied to a given call at all"
      - "Ordering only matters for performance, never for correctness"
    correct: 1
    explanation: "Decoration order changes what each pattern actually observes -- e.g. whether a circuit breaker sees each retry attempt or just the final outcome."
    concept_tags: [resilience, decorator_order, resilience4j]

  - id: q44
    question: "What do CircuitBreaker, Retry, and RateLimiter all have in common in Resilience4j's functional API?"
    options:
      - "They all require Spring Boot autoconfiguration to work"
      - "Each provides a decorateSupplier(instance, supplier) method that wraps a plain Supplier<T> with its behavior, usable in plain Spring (or no framework at all)"
      - "They can only be used with void-returning methods"
      - "They all require a running network connection to function"
    correct: 1
    explanation: "Resilience4j's core decorators work against plain functional interfaces, independent of any framework -- no Spring Boot autoconfiguration required."
    concept_tags: [resilience, resilience4j]
